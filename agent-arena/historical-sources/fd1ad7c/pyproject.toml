[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-arena"
version = "1.0.0"
description = "Local-first AI agent evaluation engine"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "pyyaml>=6.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
providers = [
    # The provider's counted HTTP transport uses httpx.Client; SDK 1.x requires httpx2.
    "anthropic>=0.39,<1",
    "openai>=1.0",
    "httpx>=0.27,<1",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "httpx>=0.27,<1",
]

[project.scripts]
agent-arena = "agent_arena.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Preserve the existing rule policy independently of Ruff default changes.
select = ["E4", "E7", "E9", "F"]
