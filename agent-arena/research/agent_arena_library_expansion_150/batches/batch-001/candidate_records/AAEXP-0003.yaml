duplicate_control:
  checked_against_existing_library: true
  checked_against_previous_batches: not_applicable_first_batch
  checked_against_current_batch: true
  duplicate_status: CLEAN
  duplicate_cluster_id: null
  duplicate_notes: >
    Checked against all 48 active canonical cases and against AAEXP-0001/0002.
    The 13 existing solid cases were reviewed; the nearest are 029
    (amyloid_antibody_biomarkers — mixed results reported without inflating the
    positive) and 052 (strong_rct_fair, synthetic_fixture). This case is
    distinct: the honest element is not a mixed biomarker/clinical result but a
    reported FAILURE OF TRANSFER — interventions that succeeded in surveys and
    expert prediction did not replicate in the field. No existing case turns on
    intention-to-behaviour or prediction-to-field transferability. Case 001
    (social_media) and 037 (mindfulness_app) are the only other behavioural-
    science cases and share no structure with this one.

provisional_classification:
  primary_label: solid
  strongest_alternative_label: overclaim
  secondary_failure_modes: []
  label_confidence: high
  primary_label_rationale: >
    The claim reports what was measured, at the magnitude measured, with the
    uncertainty measured, in the population studied, using a design that
    supports the causal wording used. Three pre-registered RCTs (N = 314,824)
    with trial registry identifiers support "increased booster uptake." Effects
    are given in absolute percentage points with a 95% confidence interval, not
    as relative risk. Null results are reported in the same breath as positive
    ones rather than being omitted or reframed. The population caveat is stated
    in the claim itself ("Despite repeated exposure to COVID-19 vaccination
    messaging in our population").

    Under frozen taxonomy v0.6.5 this is the core solid signal: "Evidence
    supports the claims made" and "Mixed results reported without inflating the
    positive aspects."
  why_not_alternative_labels: >
    NOT overclaim: no rhetorical inflation is present. The strongest available
    inflation opportunity — leading with "behavioural nudges increase
    vaccination" and omitting the nulls — was declined. The concluding sentence
    is deliberately modest and points at a methodological caution rather than at
    the authors' own positive finding.

    NOT correlation_vs_causation: the design is randomized and pre-registered;
    causal language is earned.

    NOT mechanism_vs_evidence: the outcome measured is the target outcome
    (actual booster uptake), not a surrogate, biomarker, or mechanism.
  evidence_that_would_change_label: >
    (a) Evidence that the reported nulls were selectively defined post hoc, or
    that pre-registration did not cover the reported comparisons, would move
    this toward overclaim. (b) A published Matters Arising disputing the
    analysis. (c) Evidence that accompanying institutional press communication
    inflated the finding — this would NOT change the label on the paper's own
    claim but would make an excellent paired case (see conversion_notes).

domain: psychology_and_behavioral_science
subdomain: behavioural science field experiments — public health messaging
claim_type: intervention_effect_and_transferability_claim
reader_impact_risk: >
  Moderate. Behavioural-science findings are widely adopted by governments and
  health systems on the strength of survey or laboratory evidence. This claim's
  accuracy is directly relevant to whether such adoption is warranted.

public_claim:
  exact_quote: >-
    Despite repeated exposure to COVID-19 vaccination messaging in our
    population, reminders and psychological ownership language increased booster
    uptake, replicating prior findings. However, strategies deemed effective by
    prediction or intention surveys, such as encouraging the bundling of
    COVID-19 boosters and flu shots or addressing misconceptions, yielded no
    detectable benefits over simple reminders.
  supporting_quotes_same_source:
    - >-
      Across three pre-registered randomized controlled trials (RCTs, N =
      314,824) involving a critical policy domain—COVID-19 booster uptake—we
      field tested text-based interventions that either increased vaccinations
      in prior field work (RCT1, NCT05586204), elevated vaccination intentions
      in an online study (RCT2, NCT05586178) or were favoured by scientists and
      non-experts (RCT3, NCT05586165).
    - >-
      These findings underscore the importance of testing interventions'
      transferability to real-world settings.
  normalized_claim: >
    In three large pre-registered field RCTs, reminder and psychological-
    ownership text messages produced a small increase in COVID-19 booster
    uptake, while interventions favoured by intention surveys and by expert and
    lay prediction produced no detectable benefit over simple reminders.
  original_language: en
  literal_translation: not_applicable
  source_voice_type: peer_reviewed_research_paper_author_voice
  speaker_or_entity: >
    Silvia Saccardo, Hengchen Dai, Maria A. Han, Sitaram Vangala, Juyea Hoo, …
    Jeffrey Fujimoto (full author list truncated in the retrieved HTML behind a
    "Show authors" control)
  organization: >
    Carnegie Mellon University; UCLA Anderson School of Management; Cedars-Sinai
    Medical Center (per listed author affiliations)
  source_title: >
    Field testing the transferability of behavioural science knowledge on
    promoting vaccinations
  publication_date: 2024-03-14 (online); 2024-05 (issue)
  source_type: peer_reviewed_journal_article_open_access
  canonical_url: https://www.nature.com/articles/s41562-023-01813-4
  archive_url: unavailable_to_agent
  persistent_identifier: 10.1038/s41562-023-01813-4
  exact_location: Abstract, sentences 4-5 (main claim); sentence 3 (design); sentence 6 (conclusion)
  access_date: 2026-08-03
  source_sha256: unavailable_to_agent

evidence:
  primary_source:
    title: >
      Field testing the transferability of behavioural science knowledge on
      promoting vaccinations (same document — the paper's own results)
    authors_or_entity: Saccardo, Dai, Han, Vangala, Hoo, … Fujimoto
    publication_date: 2024-03-14
    venue: Nature Human Behaviour, volume 8, pages 878-890
    identifier: 10.1038/s41562-023-01813-4
    canonical_url: https://www.nature.com/articles/s41562-023-01813-4
    archive_url: unavailable_to_agent
    source_sha256: unavailable_to_agent
    design: >
      Three pre-registered randomized controlled trials, registered on
      ClinicalTrials.gov as NCT05586204, NCT05586178 and NCT05586165.
    population_or_setting: >
      Patients in a US health-system population with repeated prior exposure to
      COVID-19 vaccination messaging.
    sample_size: N = 314,824
    intervention_or_exposure: Text-based behavioural interventions
    comparator: >
      Business-as-usual and, critically, simple reminders — so that the tested
      strategies had to beat an active control rather than nothing.
    outcome: COVID-19 booster uptake (behavioural, not self-reported intention)
    main_result: >-
      DIRECTLY VERIFIED QUOTE (Results): "The average effect of all reminders on
      booster uptake within 4 weeks was 1.13 percentage points (t(314,782) =
      7.33, P < 0.001, 95% CI 0.0083 to 0.0143; Supplementary Table 1 column
      2)."
    uncertainty: >
      Reported as a 95% confidence interval on the absolute effect
      (0.83 to 1.43 percentage points). Effect is small in absolute terms and
      the paper presents it as such.
    limitations: >
      Single health-system population with unusually heavy prior messaging
      exposure, which the authors state explicitly in the claim itself and which
      plausibly attenuates effects. Text-message modality only. Booster-specific
      context.
    funding: not_retrieved
    conflicts: not_retrieved
    correction_or_retraction_status: >
      No correction, erratum, retraction, expression of concern, or Matters
      Arising found as of 2026-08-03. Nature Human Behaviour's 2024 Matters
      Arising listing was checked and contains no entry for this article.
  supplementary_sources:
    - title: ClinicalTrials.gov registrations NCT05586204 / NCT05586178 / NCT05586165
      role: preregistration_verification
      finding: >
        Three registry identifiers are cited in the abstract itself, enabling a
        curator to verify pre-specified outcomes against reported outcomes. This
        is the single strongest support for the solid label.
      verification_status: identifiers_read_from_primary_abstract_2026-08-03 — registry entries NOT independently opened
      canonical_url: https://clinicaltrials.gov/study/NCT05586204
      archive_url: unavailable_to_agent

forensic_analysis:
  claim_scope: >
    A stated population with heavy prior messaging exposure; text-message
    interventions; a four-week booster-uptake window.
  evidence_scope: Identical. No expansion between what was tested and what was claimed.
  claim_evidence_alignment: >
    Aligned on design, population, comparator, outcome, magnitude, uncertainty,
    and causal strength. The claim's generalization is explicitly a caution
    against generalizing, which is the opposite of the usual failure mode.
  evidence_tier: Tier 1 — pre-registered randomized field experiments with registry identifiers.
  evidence_tier_explanation: >
    The highest available tier for this claim type. Behavioural outcome rather
    than surrogate; active-control comparator; pre-registration.
  causal_language_present: true
  causal_design_present: true
  mechanistic_evidence_present: false
  target_outcome_directly_measured: true
  comparison_group_present: true
  generalization_issue: none_identified
  superiority_issue: >
    None. Where a superiority claim could have been made (ownership language
    beats alternatives), the framing stays at "no detectable benefit over simple
    reminders" for the failed arms.
  missing_comparison: none_identified
  missing_causal_chain: not_applicable
  dominant_forensic_issue: >
    NONE — this is the solid case. Its forensic value is as a discriminative
    control: it contains the surface features that commonly accompany overclaim
    (a large N, a headline-friendly topic, a positive result, a policy-relevant
    domain) without the defect.
  strongest_supporting_interpretation: >
    Reporting is accurate on every §28 dimension: causal language matches design,
    population restrictions are preserved in the claim sentence itself, effect
    magnitude is given in absolute percentage points, uncertainty is quantified,
    comparator claims are fair, evidence is direct rather than mechanistic, and
    external validity is deliberately understated.
  strongest_critical_interpretation: >
    Two challenges are available and both were considered and rejected. First,
    "increased booster uptake" is causal wording for a 1.13-percentage-point
    average effect — arguably technically true but practically negligible, and a
    reader could take away more than the number warrants. Against this: the
    absolute figure and CI are reported rather than concealed, and the paper
    does not translate the effect into population-level projections. Second, the
    concluding sentence is normative rather than empirical; but it is offered as
    a methodological recommendation, not as a finding, and the empirical claims
    stand independently.
  future_blind_packet_readiness: >
    Strong. Anonymizes cleanly — the intervention type, population, and outcome
    can all be masked while preserving the reporting structure. Particularly
    valuable as a blind-packet control item, because an annotator anchored on
    "large study, positive result, policy topic" heuristics should be tempted
    toward overclaim and must read the actual reporting to resist it.

