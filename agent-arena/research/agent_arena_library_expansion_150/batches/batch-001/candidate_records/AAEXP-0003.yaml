  verification_notes: >
    Abstract and Results figures read directly from the publisher page on
    2026-08-03. The 1.13-percentage-point result with test statistic and 95% CI
    was read from the Results body text, not from any summary. §11 hazards
    checked: the claim is the paper's own authorial voice, not a press release,
    not a university communications headline, and not a journalist's wording.

    NOTE ON A NEARBY NON-USED SOURCE: discovery surfaced a Carnegie Mellon
    communications piece headlined "Ownership Language in Text Reminders Yields
    Action" and a MedicalXpress item. Neither was used as the claim source.
    Per §11, an institutional press headline must not be attributed to the
    paper. These are recorded as a paired-case opportunity, not as evidence.

    UNVERIFIED REMAINDER: (a) the three ClinicalTrials.gov registry entries were
    NOT opened; pre-registration is taken from the abstract's own citation of
    the identifiers. A curator should open them to confirm pre-specified
    outcomes match reported outcomes — this is the main residual risk to the
    solid label. (b) The full author list is truncated in the retrieved HTML.
    (c) Funding and competing-interests statements were not retrieved.

    Search queries used: megastudy nudge interventions effect sizes limitations;
    Saccardo Dai transferability correction critique commentary; Nature Human
    Behaviour 2024 Matters Arising listing.

