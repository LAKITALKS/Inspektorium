conversion_suitability: both
conversion_notes: >
  Well suited to both uses, and especially valuable as a blind-packet control
  item to test whether annotators over-apply overclaim to large positive studies.

  PAIRED-CASE OPPORTUNITY (recommended to curator, not actioned): an institutional
  press release for this same study carries the headline "Ownership Language in
  Text Reminders Yields Action." Pairing the paper's own scoped claim against the
  institutional communication layer would produce a claim-source-voice contrast
  case in the style of case_public_001, where the study is sound and the forensic
  issue sits in the communication layer. That would need its own candidate ID and
  its own verification pass; it is NOT counted here.

  Estimated curator conversion effort: low. The claim is short, self-contained,
  and quotable, and the context block needs little background.

