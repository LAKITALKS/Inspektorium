handling_note: >
  SENSITIVE TOPIC — READ FIRST. This case evaluates ONLY claim-evidence
  alignment: whether causal wording is supported by a cross-sectional research
  design. It takes no position on diversity policy, and it is not evidence that
  diversity is or is not beneficial. Green and Hand's finding is a failure to
  replicate three specific McKinsey analyses; it is not a finding that diversity
  harms performance, and they do not claim otherwise. Several secondary outlets
  covering this replication did import political framing; none were used as
  sources here. Curators and packet authors should preserve this neutrality.

duplicate_control:
  checked_against_existing_library: true
  checked_against_previous_batches: not_applicable_first_batch
  checked_against_current_batch: true
  duplicate_status: CLEAN
  duplicate_cluster_id: null
  duplicate_notes: >
    Checked against all 48 active canonical cases and against AAEXP-0001. The
    six existing correlation_vs_causation cases (019 houseplants, 023 green
    space, 040 vocational training, 046 coffee longevity, 063 policy caused
    improvement, public-001 exercise intensity) are all health, environment,
    education, or public-policy topics. None is a business or market claim, and
    none turns on reverse temporal ordering of measurement. Case 063
    (policy_caused_improvement) is the nearest shape but is a synthetic_fixture
    about policy counterfactuals, not about measurement-order inversion in a
    commercial research report. Distinct forensic value confirmed.

provisional_classification:
  primary_label: correlation_vs_causation
  strongest_alternative_label: overclaim
  secondary_failure_modes:
    - reverse_temporal_ordering_of_measurement
    - unreplicated_finding_presented_as_settled
    - quartile_comparison_presented_as_actionable_lever
  label_confidence: high
  primary_label_rationale: >
    The report states that "I&D is a powerful enabler of business performance."
    "Enabler" is causal wording: it asserts that diversity produces performance.
    The supporting evidence is a cross-sectional quartile comparison between
    executive-team diversity and industry-adjusted profitability. Under frozen
    taxonomy v0.6.5 this is the core correlation_vs_causation signal — "Causal
    language or policy recommendations from non-causal designs" — and the report
    goes on to make explicit action recommendations to companies on that basis.

    The defect is sharper than ordinary cross-sectional confounding. Per Green
    and Hand, McKinsey's diversity measures are taken at a date AFTER the
    financial-performance window they are related to. Their published wording is
    "the erroneous reverse-causality nature of McKinsey's tests." So the design
    cannot support the causal direction claimed even before confounding is
    considered.
  why_not_alternative_labels: >
    NOT overclaim as primary: the dominant defect is not rhetorical inflation of
    a real result but the causal reading of a non-causal, temporally inverted
    design. §9 precedence puts explicit or strongly implied unsupported
    causation from associative evidence above generic overclaim. An overclaim
    reading is available and is recorded as the strongest alternative, since the
    phrase "the business case remains robust" also overstates certainty for a
    finding that later failed replication.

    NOT mechanism_vs_evidence: no mechanism-level evidence is doing the work,
    and per the QC-001 ruling of 2026-08-03 the frozen category is biological in
    scope regardless.

    NOT solid: the report's own hedged phrasings ("more likely to outperform")
    sit alongside unhedged causal claims ("powerful enabler," "leverage I&D to
    position themselves to prosper"). Per taxonomy v0.6.5, hedging that does not
    constrain the surrounding claims is "decorative uncertainty."
  evidence_that_would_change_label: >
    (a) A McKinsey methodological appendix establishing that diversity was
    measured BEFORE the performance window would remove the reverse-ordering
    defect and move this toward overclaim or solid. (b) A successful independent
    replication with correct temporal ordering would materially weaken the case.
    (c) Evidence that "enabler" was explicitly scoped as associational elsewhere
    in the full PDF report (not retrieved) would soften the causal reading.

domain: business_and_market_claims
subdomain: management consulting research — corporate performance claims
claim_type: causal_business_performance_claim
reader_impact_risk: >
  High. This report series is among the most widely cited business-case
  references in corporate strategy and governance, and the reports explicitly
  direct companies to set targets and reallocate leadership accountability on
  the strength of the finding.

public_claim:
  exact_quote: >-
    As this report shows, however, I&D is a powerful enabler of business
    performance.
  supporting_quotes_same_source:
    - >-
      Our latest report shows not only that the business case remains robust but
      also that the relationship between diversity on executive teams and the
      likelihood of financial outperformance has strengthened over time.
    - >-
      Our 2019 analysis finds that companies in the top quartile for gender
      diversity on executive teams were 25 percent more likely to have
      above-average profitability than companies in the fourth quartile—up from
      21 percent in 2017 and 15 percent in 2014
    - >-
      In the case of ethnic and cultural diversity, our business-case findings
      are equally compelling: in 2019, top-quartile companies outperformed those
      in the fourth one by 36 percent in profitability
  normalized_claim: >
    Inclusion and diversity cause improved business performance, and the
    strength of this relationship has increased over time.
  original_language: en
  literal_translation: not_applicable
  source_voice_type: corporate_research_report_institutional_voice
  speaker_or_entity: Sundiatu Dixon-Fyle, Kevin Dolan, Dame Vivian Hunt, Sara Prince
  organization: McKinsey & Company
  source_title: "Diversity wins: How inclusion matters"
  publication_date: 2020-05-19
  source_type: official_company_report
  canonical_url: https://www.mckinsey.com/featured-insights/diversity-and-inclusion/diversity-wins-how-inclusion-matters
  archive_url: unavailable_to_agent
  persistent_identifier: source_does_not_provide_identifier
  exact_location: >
    Sidebar "In the COVID-19 crisis, inclusion and diversity matter more than
    ever," paragraph 2, sentence 3. Supporting quotes from the introductory
    summary and from section "A stronger business case for diversity, but slow
    progress overall," paragraphs 2-4.
  access_date: 2026-08-03
  source_sha256: unavailable_to_agent

evidence:
  primary_source:
    title: McKinsey's Diversity Matters/Delivers/Wins Results Revisited
    authors_or_entity: Jeremiah Green (Texas A&M), John R. M. Hand (UNC Chapel Hill)
    publication_date: 2024-03
    venue: Econ Journal Watch, Volume 21, Issue 1, Comments section, pages 5-34
    identifier: source_does_not_provide_identifier
    canonical_url: https://econjwatch.org/articles/mckinsey-s-diversity-matters-delivers-wins-results-revisited
    archive_url: unavailable_to_agent
    source_sha256: unavailable_to_agent
    design: >
      Quasi-replication. Reconstructs McKinsey's measures and tests them on an
      independently observable sample.
    population_or_setting: >
      S&P 500 firms as of 2019-12-31; executive racial/ethnic diversity measured
      at mid-2020; financial outcomes over 2015-2019.
    sample_size: S&P 500 constituent firms
    intervention_or_exposure: >
      McKinsey's inverse normalized Herfindahl-Hirschman measures of executive
      racial/ethnic diversity
    comparator: Industry-adjusted performance across diversity levels
    outcome: >
      Industry-adjusted EBIT margin, plus sales growth, gross margin, return on
      assets, return on equity, and total shareholder return.
    main_result: >-
      DIRECTLY VERIFIED QUOTE (abstract): "when we revisit McKinsey's tests
      using data for firms in the publicly observable S&P 500 as of 12/31/2019,
      we do not find statistically significant relations between McKinsey's
      inverse normalized Herfindahl-Hirschman measures of executive
      racial/ethnic diversity at mid-2020 and either industry-adjusted earnings
      before interest and taxes margin or industry-adjusted sales growth, gross
      margin, return on assets, return on equity, and total shareholder return
      over the prior five years 2015-2019."
    key_design_finding: >-
      DIRECTLY VERIFIED QUOTE (abstract): "Combined with the erroneous
      reverse-causality nature of McKinsey's tests, our inability to
      quasi-replicate their results suggests that despite the imprimatur given
      to McKinsey's studies, they should not be relied on to support the view
      that US publicly traded firms can expect to deliver improved financial
      performance if they increase the racial/ethnic diversity of their
      executives."
    uncertainty: >
      Green and Hand could not obtain McKinsey's underlying data and had to
      reconstruct the measures. Their sample (S&P 500) is narrower than
      McKinsey's global set of 1,000+ firms across 15 countries, so this is a
      quasi-replication on a different population, not an exact one.
    limitations: >
      Sample and period differ from McKinsey's. Econ Journal Watch publishes
      scholarly commentary rather than original empirical research as its
      primary remit; the piece appears in its Comments section. A failure to
      replicate on a different sample is not proof that the original
      association is absent in the original sample.
    funding: not_stated_in_retrieved_material
    conflicts: not_stated_in_retrieved_material
    correction_or_retraction_status: >
      No correction, erratum, retraction, or expression of concern found for
      either source as of 2026-08-03. The McKinsey report page remains live and
      unmodified in its claim wording; McKinsey published a further report in
      2023 continuing the series.
  supplementary_sources:
    - title: McKinsey series predecessors — "Why diversity matters" (2015), "Delivering through diversity" (2018)
      role: claim_lineage
      finding: >
        The 2020 report explicitly positions itself as the third in the series
        and as strengthening the earlier finding. Green and Hand address the
        first three reports. Confirms claim and evidence concern the same body
        of analyses (§12 same-intervention check).
      verification_status: verified_from_mckinsey_report_page_2026-08-03
      canonical_url: https://www.mckinsey.com/capabilities/people-and-organizational-performance/our-insights/why-diversity-matters
      archive_url: unavailable_to_agent

forensic_analysis:
  claim_scope: >
    Inclusion and diversity as a causal driver of firm financial performance,
    generalized across 15 countries and 1,000+ large companies, with an
    explicit claim that the relationship has strengthened over time.
  evidence_scope: >
    Cross-sectional quartile association between executive diversity measured at
    one date and industry-adjusted profitability over a preceding window.
  claim_evidence_alignment: >
    Misaligned on causal direction and on certainty. The design supports "these
    variables co-occur"; the claim asserts "one enables the other," and the
    measurement ordering runs opposite to the asserted causal arrow.
  evidence_tier: >
    Tier 1 for the contrary evidence in publication terms (peer-scrutinised
    academic comment by named accounting professors), with the caveat that it is
    a quasi-replication on a different sample.
  evidence_tier_explanation: >
    The reverse-ordering criticism is a design-level observation verifiable from
    McKinsey's own described methodology; it does not depend on the replication
    sample. The non-replication is sample-dependent and correspondingly weaker.
  causal_language_present: true
  causal_design_present: false
  mechanistic_evidence_present: false
  target_outcome_directly_measured: true
  comparison_group_present: true
  generalization_issue: >
    Present. Findings from McKinsey-selected large-firm samples are presented as
    a general business case applicable to companies broadly.
  superiority_issue: not_applicable
  missing_comparison: >
    No within-firm change analysis. The report never shows that firms that
    increased diversity subsequently improved performance — which is the claim
    a reader would take away.
  missing_causal_chain: >
    No identification strategy, no counterfactual, no instrument, no temporal
    precedence of exposure over outcome.
  dominant_forensic_issue: >
    Causal wording and action recommendations built on a cross-sectional
    quartile association whose measurement ordering is inverted relative to the
    asserted causal direction.
  strongest_supporting_interpretation: >
    Much of the report's own statistical language is carefully associational —
    "more likely to have above-average profitability," "likelihood of
    outperformance" — and quartile comparisons are a standard descriptive tool
    in business research, not a claimed identification strategy. A reader
    familiar with the genre would understand "business case" as decision-
    relevant association rather than proven causation. The phrase "powerful
    enabler" appears in a discursive COVID-19 sidebar rather than in the
    analytical section, so it may be read as framing rather than as the report's
    formal finding.
  strongest_critical_interpretation: >
    That defence is precisely the "decorative uncertainty" pattern the frozen
    taxonomy names: correct hedged wording in the statistics section does not
    constrain the unhedged causal claims and recommendations elsewhere. The
    report advises companies to set diversity targets and hold leaders
    accountable in order to obtain the performance benefit — advice that is only
    coherent under a causal reading. The reverse measurement ordering was
    present across three successive reports and was not corrected as the series
    continued.
  future_blind_packet_readiness: >
    USE WITH CAUTION. The forensic structure is excellent and anonymizes
    cleanly (the claiming organization, the diversity variable, and the outcome
    can all be masked while preserving the reverse-ordering defect). BUT the
    unmasked topic is politically charged, and annotators' priors on the subject
    could drive labels instead of the forensic structure — a shortcut-risk of
    exactly the kind the Phase 5.05d shortcut-risk audit examined. STRONG
    RECOMMENDATION: if used for blind IAA, abstract the variable (e.g. "a
    workforce-composition measure") so the structure is assessed without the
    topic.

