adversarial_review:
  strongest_case_for_support: see forensic_analysis.strongest_supporting_interpretation
  strongest_case_for_criticism: see forensic_analysis.strongest_critical_interpretation
  possible_missed_qualifier: >
    Yes — flagged. The full PDF was not retrieved and may scope the claim more
    carefully than the web article. This is the single largest open risk to the
    label and is recorded as an unresolved question rather than assumed away.
  possible_source_voice_error: >
    None identified. Quotes are from McKinsey's own published report under named
    McKinsey authors. The institutional voice is unambiguous.
  outcome_match_check: >
    Match. Both claim and evidence concern firm financial performance;
    Green and Hand test McKinsey's own EBIT-margin outcome plus five others.
  population_match_check: >
    PARTIAL MISMATCH — material and disclosed. McKinsey: 1,000+ firms across 15
    countries. Green and Hand: S&P 500 only. This is a quasi-replication on a
    narrower population, which limits how strongly the non-replication bears on
    McKinsey's own sample. The reverse-ordering criticism is unaffected by this
    mismatch, which is why the label rests primarily on design rather than on
    non-replication.
  reasonable_reviewer_disagreement: >
    Possible on label weighting. A reviewer might treat the dominant defect as
    overclaim (certainty inflation about a contested finding) rather than
    correlation_vs_causation. §9 precedence resolves this toward
    correlation_vs_causation because unsupported causation is explicitly present
    ("enabler") and drives the recommendations. A reviewer might also argue the
    population mismatch weakens the evidence more than recorded.
  unresolved_questions:
    - Does the full McKinsey PDF contain scoping language narrowing the causal claim?
    - Do Green and Hand elaborate the reverse-causality point beyond the abstract in pages 5-34?
    - Has McKinsey published a methodological response to the replication?

