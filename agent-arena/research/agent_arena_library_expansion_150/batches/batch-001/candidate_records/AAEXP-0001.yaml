adversarial_review:
  strongest_case_for_support: >
    See forensic_analysis.strongest_supporting_interpretation. The narrow
    reading of "unseen" is defensible and the authors did test held-out attacks.
  strongest_case_for_criticism: >
    See forensic_analysis.strongest_critical_interpretation. The adaptive-
    adversary standard was well established in adversarial ML before 2024.
  possible_missed_qualifier: >
    Checked. The abstract contains no scoping qualifier limiting the robustness
    claim to the evaluated attack set. The full paper may contain a limitations
    section with narrower scoping — NOT retrieved. A curator should check the
    paper body before finalizing, since a clear in-paper scoping statement would
    weaken the overclaim reading.
  possible_source_voice_error: >
    None identified. The quote is first-person authorial ("Our technique") from
    the paper's own abstract, not a press release, not a journalist's
    characterization, not an institutional summary. §11's attribution hazards
    were specifically checked.
  outcome_match_check: >
    Match. Both claim and evidence concern prevention of harmful model outputs
    under attack, measured as attack success rate.
  population_match_check: >
    Match on model family; the relevant "population" here is the adversary
    distribution, and the mismatch on that dimension IS the forensic issue
    rather than a defect in evidence matching.
  reasonable_reviewer_disagreement: >
    YES — expected and material. A reviewer applying the operating protocol's
    broad §8 definition would likely say mechanism_vs_evidence, because the
    representation-control mechanism is doing the work of the generality claim.
    A reviewer applying frozen taxonomy v0.6.5 must say overclaim, because no
    biological mechanism is present. This is a taxonomy-scope disagreement, not
    a facts disagreement. Label confidence is set to medium for this reason.
  unresolved_questions:
    - Does the Circuit Breakers paper body contain a scoping statement that narrows the abstract's generalization claim?
    - Figure 1 per-defense values in the evidence paper were not directly read.
    - Curator ruling required on whether mechanism_vs_evidence extends to non-biological mechanisms.

future_taxonomy_review:
  possible_domain_general_mechanism_analogue: true
  notes: >
    Under a domain-general reading of mechanism_vs_evidence (operating protocol
    §8), this case would plausibly carry that label: the representation-control
    mechanism is doing the work of the generality claim, and laboratory-only
    benchmark performance stands in for demonstrated robustness against real
    adversaries. Under frozen taxonomy v0.6.5 it cannot, because no biological
    mechanism is present. Curator ruling of 2026-08-03 keeps the frozen
    biological scope; this case is therefore classified `overclaim`, which is
    the best fit for the actual dominant defect (a technical claim exceeding
    demonstrated performance). Recorded as research metadata only. This is not a
    fifth label and implies no taxonomy change. See
    future_taxonomy_review_issue.md.

