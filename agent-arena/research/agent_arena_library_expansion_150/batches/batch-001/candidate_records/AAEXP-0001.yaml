    overclaim to stay inside the frozen taxonomy. See quality_control_log.md.

    Search queries used for contrary evidence: adaptive attacks jailbreak
    defenses attack success rate; circuit breakers robustness revisited;
    Attacker Moves Second defenses evaluated; correction/retraction checks on
    both arXiv records.

