provisional_classification:
  primary_label: overclaim
  strongest_alternative_label: mechanism_vs_evidence
  secondary_failure_modes:
    - unsupported_generalization_beyond_evaluated_conditions
    - missing_adversarial_comparator
    - threat_model_scope_mismatch
  label_confidence: medium
  primary_label_rationale: >
    The claim asserts that the technique prevents harmful outputs "even in the
    presence of powerful unseen attacks." The supporting evaluation used a set
    of attacks that were not designed against the defense's own mechanism. The
    claim therefore extrapolates from a tested attack distribution to the space
    of unseen attacks generally. Under the frozen taxonomy (v0.6.5) this is the
    'overclaim' pattern: "Conclusions that go beyond the data" and
    "Extrapolation to populations not studied" — here, extrapolation to attack
    distributions not studied. The framing is the problem; the reported
    within-scope results are not disputed.
  why_not_alternative_labels: >
    NOT correlation_vs_causation: no observational or associative design is
    involved; the evaluation is interventional (attacks are applied and outcomes
    measured).

    NOT mechanism_vs_evidence UNDER THE FROZEN TAXONOMY: v0.6.5 defines this
    label as "A biological mechanism is described and used to imply human
    clinical benefit," with both validated shapes (A and C) being animal or
    preclinical biomedical. No biological mechanism is present here. Applying
    mechanism_vs_evidence to a software robustness claim would extend the frozen
    category beyond its documented scope, which §2 forbids. See the governance
    flag in verification_notes — under the broader §8 definition in the
    operating protocol (which includes "laboratory-only performance" and
    "operational superiority"), mechanism_vs_evidence would be a strong and
    arguably better fit. This conflict is escalated, not resolved by the agent.

    NOT solid: the generalization to "unseen attacks" is materially broader than
    the evaluation supports, and two independent teams subsequently reached
    100% attack success rate.
  evidence_that_would_change_label: >
    (a) Curator ruling that the frozen mechanism_vs_evidence category extends to
    non-biological mechanisms would likely move this to
    mechanism_vs_evidence, since the defense's generality argument rests on the
    representation-control mechanism rather than on breadth of attack testing.
    (b) Evidence that the authors elsewhere scoped the claim explicitly to the
    evaluated attack set would weaken overclaim toward solid.

domain: software_and_cybersecurity
subdomain: AI model security — jailbreak and prompt-injection defenses
claim_type: robustness_generalization_claim
reader_impact_risk: >
  Moderate to high. Robustness claims of this kind inform deployment decisions
  about safety safeguards in production language-model systems. A defense
  believed robust to unseen attacks but bypassable at 100% ASR creates a
  concrete false-assurance risk.

public_claim:
  exact_quote: >-
    Our technique can be applied to both text-only and multimodal language
    models to prevent the generation of harmful outputs without sacrificing
    utility -- even in the presence of powerful unseen attacks.
  normalized_claim: >
    The circuit-breaker technique prevents language models from generating
    harmful outputs, without loss of utility, including under powerful attacks
    not seen during development.
  original_language: en
  literal_translation: not_applicable
  source_voice_type: peer_reviewed_research_paper_author_voice
  speaker_or_entity: >
    Andy Zou, Long Phan, Justin Wang, Derek Duenas, Maxwell Lin, Maksym
    Andriushchenko, Rowan Wang, Zico Kolter, Matt Fredrikson, Dan Hendrycks
    (paper authors, first-person "Our technique")
  organization: >
    Multi-institution (Gray Swan AI / Carnegie Mellon University / Center for AI
    Safety; per author affiliations and linked code repository)
  source_title: Improving Alignment and Robustness with Circuit Breakers
  publication_date: 2024-06-06 (v1); 2024-07-12 (v4, version quoted)
  source_type: preprint_with_peer_reviewed_publication (NeurIPS 2024)
  canonical_url: https://arxiv.org/abs/2406.04313
  archive_url: unavailable_to_agent
  persistent_identifier: 10.48550/arXiv.2406.04313
  exact_location: Abstract, sentence 5 (arXiv abstract page, v4)
  access_date: 2026-08-03
  source_sha256: unavailable_to_agent

evidence:
  primary_source:
    title: >
      The Attacker Moves Second: Stronger Adaptive Attacks Bypass Defenses
      Against LLM Jailbreaks and Prompt Injections
    authors_or_entity: >
      Milad Nasr, Nicholas Carlini, Chawin Sitawarin, Sander V. Schulhoff, Jamie
      Hayes, Michael Ilie, Juliette Pluto, Shuang Song, Harsh Chaudhari, Ilia
      Shumailov, Abhradeep Thakurta, Kai Yuanqing Xiao, Andreas Terzis, Florian
      Tramèr
    publication_date: 2025-10-10
    venue: arXiv preprint; accepted to USENIX Security '26
    identifier: 10.48550/arXiv.2510.09023
    canonical_url: https://arxiv.org/abs/2510.09023
    archive_url: unavailable_to_agent
    source_sha256: unavailable_to_agent
    design: >
      Adaptive adversarial re-evaluation of 12 published defenses using gradient
      descent, reinforcement learning, random search, and human-guided
      exploration.
    population_or_setting: >
      Published LLM jailbreak and prompt-injection defenses; Circuit Breakers
      evaluated on the HarmBench benchmark.
    sample_size: 12 defenses evaluated; Circuit Breakers is one of three examined in the training-based category (§5.2)
    intervention_or_exposure: Circuit-breaker representation-control defense
    comparator: >
      Same defense under static / non-adaptive attacks, versus under adaptive
      attacks designed against the defense.
    outcome: Attack success rate (ASR)
    main_result: >-
      DIRECTLY VERIFIED QUOTE (§5.2, para 4): "Circuit Breakers uses a similar
      idea but focuses on jailbreaking attempts; we observe similar results as
      our adaptive attacks can bypass this defense easily. In particular, we
      used our RL-based method to achieve 100% ASR against Circuit Breakers on
      HarmBench."
    uncertainty: >
      Single evaluation team; ASR is benchmark- and method-specific. The 100%
      figure is for the RL-based method on HarmBench specifically.
    limitations: >
      Adaptive attacks assume substantial attacker resources and, in some
      configurations, white-box or grey-box access. Real-world adversary
      capability varies. The paper's own framing is methodological (how defenses
      should be evaluated) rather than a claim that these defenses have zero
      value.
    funding: not_stated_in_retrieved_material
    conflicts: >
      Author affiliations include organizations that build competing safety
      systems. Not disclosed in the retrieved abstract page.
    correction_or_retraction_status: >
      No correction, erratum, retraction, or expression of concern found for
      either source as of 2026-08-03. Circuit Breakers is at v4 (revisions
      predate the contrary findings). Attacker-Moves-Second is at v1.
  supplementary_sources:
    - title: Revisiting the Robust Alignment of Circuit Breakers
      role: independent_prior_contrary_evidence
      finding: >-
        DIRECTLY VERIFIED QUOTE: "we show that the robustness claims of
        'Improving Alignment and Robustness with Circuit Breakers' against
        unconstraint continuous attacks in the embedding space of the input
        tokens may be overestimated... we achieve 100% attack success rate (ASR)
        against circuit breaker models. Without conducting any further
        hyperparameter tuning, these adjustments increase the ASR by more than
        80% compared to the original evaluation."
      verification_status: verified_from_primary_abstract_2026-08-03
      canonical_url: https://arxiv.org/abs/2407.15902
      archive_url: unavailable_to_agent
    - title: >
        The Attacker Moves Second (§5.2 framing of training-based defenses)
      role: contextual_mechanism_framing
      finding: >-
        DIRECTLY VERIFIED QUOTE: "These methods are based on the premise that,
        as in other machine learning domains, training on a diverse set of
        attacks will generalize to unseen ones and yield broad protection."
      verification_status: verified_from_primary_html_2026-08-03
      canonical_url: https://arxiv.org/html/2510.09023v1
      archive_url: unavailable_to_agent

forensic_analysis:
  claim_scope: >
    Prevention of harmful outputs across text-only and multimodal models,
    without utility loss, generalizing to "powerful unseen attacks."
  evidence_scope: >
    Measured performance against the attack suite available and applied at
    development time. Generalization to adaptive attackers was asserted, not
    demonstrated.
  claim_evidence_alignment: >
    Misaligned on the generalization dimension specifically. Within-scope
    results are not in dispute; the phrase "even in the presence of powerful
    unseen attacks" is the point of failure, and it is the phrase two
    independent teams later falsified at 100% ASR.
  evidence_tier: >
    Tier 1 for the contrary evidence (primary adversarial re-evaluation,
    independently replicated by a separate team using a different attack class).
  evidence_tier_explanation: >
    Two independent groups, using different methods (embedding-space attacks;
    RL-based optimization), both reached 100% ASR. This is replication of the
    failure, not a single dissenting result.
  causal_language_present: false
  causal_design_present: true
  mechanistic_evidence_present: true
  target_outcome_directly_measured: >
    Partially. Harmful-output prevention was measured, but only against
    non-adaptive attacks. The claimed target outcome — robustness to unseen
    powerful attacks — was not directly measured.
  comparison_group_present: true
  generalization_issue: >
    PRIMARY DEFECT. Extrapolation from a tested attack distribution to the open
    space of adversary strategies.
  superiority_issue: >
    Present but secondary — the claim positions the technique as superior to
    refusal training and adversarial training.
  missing_comparison: Adaptive adversary designed against the defense's own mechanism.
  missing_causal_chain: not_applicable
  dominant_forensic_issue: >
    A robustness property was claimed for an adversary class that the evaluation
    did not include. In security, the threat model is the population; evaluating
    against a fixed attack set and claiming robustness to unseen attacks is the
    structural equivalent of generalizing beyond the studied population.
  strongest_supporting_interpretation: >
    "Powerful unseen attacks" can be read narrowly as "attacks not seen during
    training," which the paper did test — it evaluated against attacks not in
    its training mixture. On this reading the claim is accurate as scoped, and
    the later failures reflect a genuinely stronger adversary class that did not
    exist at publication. Security research is iterative and defenses are
    routinely broken; that is normal scientific progress, not overclaiming.
  strongest_critical_interpretation: >
    The word "powerful" does substantive work, and the abstract's closing
    sentence ("a significant step forward in the development of reliable
    safeguards") reinforces a general reliability reading rather than a scoped
    one. A defense's evaluation must anticipate an adaptive adversary; the field
    had established this for vision models a decade earlier, and the
    Attacker-Moves-Second authors make exactly this point (§5.2 closing). The
    first 100% ASR result appeared roughly one month after publication.
  future_blind_packet_readiness: >
    Good with a caveat. The forensic structure survives anonymization
    (technique name and authors can be masked; the claim/evidence gap is
    intact). RISK: Circuit Breakers is a widely known defense and some
    annotators may recognize it even when anonymized, which could contaminate a
    blind IAA packet. Flag for packet-author attention.

