id: forecast-base-rate-trap-001
title: "Narrative vs Base Rate: Startup Acquisition"
domain: forecasting
difficulty: hard
task_type: forecasting_decision
task_family: forecasting_decision
trap_type: base_rate_neglect
ambiguity_level: medium
expected_failure_modes:
  - base_rate_omission
  - narrative_overreach
  - shrinkage_failure
  - overconfident_forecast
discriminative_dimensions:
  - baseline_awareness
  - uncertainty_honesty
  - probability_calibration_quality
prompt: |
  Question: Will DataFlow Inc. be acquired by a major tech company within 12 months?

  Resolution rule: Resolves YES if a binding acquisition agreement is publicly
  announced within 12 months of the question opening date.

  Available information:
  - DataFlow is a Series C startup with $50M ARR and 40% YoY growth
  - CEO recently said "we are focused on building, not selling"
  - Three board members have ties to Google and Microsoft
  - Industry context: Only ~2% of Series C startups are acquired within any given 12-month period
  - Recent rumors: TechCrunch reported "multiple large tech companies have expressed interest"
  - DataFlow recently hired a new CFO with M&A experience at Goldman Sachs

  Provide your forecast decision with probability, reasoning, and key drivers.
context: |
  Tests whether the agent anchors on the compelling narrative (board ties, M&A CFO,
  rumors) or properly starts from the 2% base rate and adjusts upward with evidence.
  Even with strong signals, the base rate should prevent extreme forecasts.
expected_answer: null
reference_solution: |
  Base rate: ~2% of Series C startups get acquired in any 12-month window.
  Positive signals justify upward adjustment:
  - Board ties to potential acquirers (moderate signal)
  - M&A-experienced CFO hire (moderate signal)
  - Media rumors of interest (weak signal — TechCrunch rumors are common)
  Negative signals:
  - CEO publicly stated "not selling" (strong signal against)
  - Company is growing 40% YoY — less pressure to sell
  A calibrated forecast would adjust from 2% base to perhaps 8-20%.
  Going above 30% would require ignoring the base rate.
  Going above 50% would be narrative-driven overconfidence.
base_rate: 0.02
resolution_rule: "Resolves YES if binding acquisition agreement publicly announced within 12 months"
correct_decision: forecast
expected_probability_range: [0.05, 0.25]
key_insights:
  - keyword: "base rate"
    variants: ["2%", "prior probability", "historical rate"]
    functional_descriptions:
      - "only 2% of comparable startups are acquired per year"
  - keyword: "CEO statement"
    variants: ["not selling", "focused on building"]
    functional_descriptions:
      - "CEO public statement against acquisition"
  - keyword: "adjustment"
    variants: ["update", "Bayesian", "shrinkage"]
    functional_descriptions:
      - "start from base rate and adjust with evidence"
common_errors:
  - ignoring the 2% base rate entirely
  - treating rumors as strong evidence
  - forecasting >40% based on narrative
evaluator_notes: "The critical test is whether the agent starts from the 2% base rate or constructs a narrative estimate from scratch."
