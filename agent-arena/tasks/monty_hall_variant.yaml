id: monty-hall-variant-001
title: "Monty Hall Variant: The Lazy Host"
domain: probability
difficulty: hard
task_type: closed_with_reasoning
task_family: conditional_probability
trap_type: pattern_match_trap
ambiguity_level: medium
expected_failure_modes:
  - surface_pattern_match
  - shallow_reasoning
  - unjustified_confidence
discriminative_dimensions:
  - correctness
  - alternative_hypothesis_awareness
  - self_verification_quality
prompt: |
  You are on a game show with 3 doors. Behind one door is a car; behind the other two are goats.
  You pick door 1. The host, who knows what's behind each door, MUST open a door with a goat.
  However, unlike the classic Monty Hall problem, the host is lazy:

  - If the car is behind door 1 (your pick), the host randomly opens door 2 or door 3 (50/50).
  - If the car is behind door 2, the host opens door 3.
  - If the car is behind door 3, the host opens door 2.

  The host opens door 3 and reveals a goat.

  What is the probability the car is behind door 2 if you switch?
  What should you do: switch or stay?
context: |
  This is a variant of the Monty Hall problem that looks identical on the surface but requires
  careful conditional probability reasoning. The lazy host's behavior gives additional information.
  Shallow pattern matching ("always switch") will get a correct recommendation but may get
  the exact probability wrong.
expected_answer: "2/3"
reference_solution: |
  P(Car=1) = P(Car=2) = P(Car=3) = 1/3.
  P(Host opens 3 | Car=1) = 1/2 (lazy host picks randomly)
  P(Host opens 3 | Car=2) = 1 (must open 3, only goat door)
  P(Host opens 3 | Car=3) = 0 (can't open door with car)

  By Bayes:
  P(Host opens 3) = 1/3 * 1/2 + 1/3 * 1 + 1/3 * 0 = 1/6 + 1/3 = 1/2

  P(Car=2 | Host opens 3) = (1/3 * 1) / (1/2) = 2/3
  P(Car=1 | Host opens 3) = (1/3 * 1/2) / (1/2) = 1/3

  You should switch. The probability the car is behind door 2 is 2/3.
evaluation:
  method: auto
  answer_match: contains
  tolerance: 0.02
output_schema: structured
key_insights:
  - keyword: "conditional probability"
    variants: ["conditional", "given that", "conditioned on"]
    functional_descriptions:
      - "the probability changes based on what the host did"
      - "we need to condition on the host opening door 3"
  - keyword: "bayes"
    variants: ["bayes' theorem", "bayesian", "posterior"]
    functional_descriptions:
      - "updating door probabilities given the host's action"
  - keyword: "host behavior"
    variants: ["host's strategy", "host's choice", "lazy host"]
    functional_descriptions:
      - "the host's random vs forced choice gives information"
      - "when the host must open a specific door vs choosing randomly"
  - keyword: "asymmetric"
    variants: ["different probabilities", "not equal", "1/2 vs 1"]
    functional_descriptions:
      - "the host opens door 3 with probability 1/2 if car is behind door 1 but probability 1 if car is behind door 2"
common_errors:
  - answering 1/2 (assuming equal probability)
  - applying standard Monty Hall without considering host behavior
  - ignoring that host's random choice provides information
diagnostic_focus: "Does the agent recognize that the lazy host's behavior changes the conditional probabilities?"
expected_mechanism_terms:
  - "conditional"
  - "bayes"
  - "host"
  - "random"
fragile_points:
  - "agent may apply standard Monty Hall logic and get 2/3 by luck without recognizing the asymmetry"
  - "agent may not distinguish between P(host opens 3 | car=1) and P(host opens 3 | car=2)"
likely_shortcuts:
  - "always switch in Monty Hall is a well-known heuristic that gives the right recommendation but wrong probability reasoning"
evaluator_notes: "Hard task. Correct answer is 2/3 but the reasoning must account for the lazy host's asymmetric behavior."
