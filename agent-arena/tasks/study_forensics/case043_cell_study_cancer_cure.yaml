id: study-forensics-043
title: 'Study Forensics: In-vitro compound kills cancer cells, framed as a cancer treatment'
domain: study_forensics
difficulty: hard
task_type: study_forensics
task_family: overclaim
trap_type: cell_to_human_overreach
ambiguity_level: high
origin: synthetic_fixture
prompt: |
  A press summary reports that Compound X, a plant-derived molecule, killed up to 90% of cultured human tumour cells in a petri dish within 48 hours. The write-up concludes that Compound X 'treats cancer' and could become a natural alternative to chemotherapy. No animal or human data are described.
context: |
  Strong in-vitro (cell-culture) signal, but the leap to a human 'treatment' skips animal models, pharmacokinetics, toxicity, and clinical trials. The text also actively sells a clinical benefit ('treats cancer', 'natural alternative to chemotherapy') as fact rather than hypothesis, so the primary forensic finding is rhetorical inflation (overclaim) layered on an evidence-tier gap.
expected_answer: overclaim
reference_solution: |
  The evidence tier is in-vitro cell culture. The conclusion tier is human therapeutic benefit. Many substances kill cells in a dish (including bleach); that says nothing about safety, delivery, dose, or efficacy in a living human. Because the text states 'treats cancer' as fact and markets a 'natural alternative to chemotherapy', it actively sells clinical benefit — the priority rule makes overclaim the primary finding, with the cell-to-human tier gap (mechanism_vs_evidence) as the secondary, defensible reading.
gold_label: overclaim
gold_confidence: medium
gold_case_type: borderline
gold_justification: |
  Both an evidence-tier gap (in-vitro cytotoxicity to human treatment) and rhetorical inflation are present. Applying the project priority rule: the text actively sells clinical benefit using promotional language stated as fact ('treats cancer', 'natural alternative to chemotherapy'), not hedged speculation, so overclaim is the primary finding and the tier gap is secondary. This differs from the canonical mechanism_vs_evidence cases (case024/028/044), which hedge with 'could' / 'suggested'.
  Precedence explanation (added Phase 5.05e): under the taxonomy precedence rule a specific label (mechanism_vs_evidence) outranks generic overclaim ONLY when its trigger genuinely captures the core error. Here the core error is unhedged promotional assertion of a clinical outcome stated as fact; the mechanism/tier-gap reading is genuinely plausible (the evidence originates in a dish, not a patient) but does NOT outrank the gold, because there is no hedged mechanism narrative — the text asserts the benefit rather than proposing it. The mechanism_vs_evidence reading is therefore retained as the documented secondary. This is a true boundary case: independent human review is REQUESTED and has NOT yet been performed; gold label unchanged pending that review.
gold_alternative_reading: |
  A defensible alternative labels this mechanism_vs_evidence: the deep problem is WHERE the evidence comes from (a petri dish, not a patient), i.e. an unbridged cell-to-human tier gap, and one could read 'treats cancer' as shorthand for the implied conclusion rather than active marketing. Under that reading mechanism_not_demonstrated is primary. The case is borderline; a live multi-run probe (Opus 4.5, 3/3, confidence 0.94) consistently chose overclaim, consistent with the priority rule.
gold_summary: |
  Compound X killed tumour cells in vitro; the text sells it as a cancer 'treatment' and 'natural alternative to chemotherapy' with no in-vivo or clinical evidence. Primary: overclaim (active selling of clinical benefit as fact); secondary/defensible: mechanism_vs_evidence (cell-to-human tier gap).
curator_notes: |
  Canonical cell-to-human overreach. Pairs with case024 (gene therapy) and case028 (NAD mice). Discrimination: hard / borderline — separates the tier-gap reading from the active-selling reading.
  GOLD REVIEW (Phase 4 live stability probe): originally gold_label mechanism_vs_evidence (clear/high). Opus 4.5 labelled it overclaim in 3/3 runs at 0.94 confidence. On review, the flat factual 'treats cancer' + 'natural alternative to chemotherapy' framing meets the prompt priority rule for overclaim, so the primary label was changed to overclaim and the case marked borderline with the mechanism_vs_evidence reading preserved as the alternative.
  SYNTHETIC FIXTURE: inspired by a common claim pattern; not a real citation or product.
  Phase 5.05e (v0.8.5 curator decision): this case is HOLDOUT-INELIGIBLE until an
  independent human review of the overclaim-vs-mechanism_vs_evidence boundary is
  completed. The review request is prepared under
  analysis/phase5_05e_targeted_curation/human_review/ and is blind (no gold, no model
  votes). No independent human review has occurred yet. Gold label retained (overclaim).
expected_findings:
- finding: conclusion_exceeds_results
  severity: major
  confidence: high
- finding: mechanism_not_demonstrated
  severity: moderate
  confidence: high
gold_evidence_spans:
- span: Compound X 'treats cancer' and could become a natural alternative to chemotherapy
  why_it_matters: Actively sells a clinical benefit as fact with no in-vivo or clinical support — the overclaim.
  supports_finding: conclusion_exceeds_results
- span: killed up to 90% of cultured human tumour cells in a petri dish
  why_it_matters: In-vitro cytotoxicity is the actual evidence tier — a dish, not a patient (the underlying tier gap).
  supports_finding: mechanism_not_demonstrated
evaluation:
  method: auto
  answer_match: contains
key_insights:
- keyword: in-vitro
  variants:
  - petri dish
  - cell culture
  - cultured cells
  functional_descriptions:
  - evidence is cell-culture only, not human
- keyword: no human evidence
  variants:
  - no clinical
  - no animal
  - no in-vivo
  functional_descriptions:
  - therapeutic claim lacks in-vivo/clinical support
common_errors:
- treating cytotoxicity as proof of a cure
- ignoring the missing toxicity/delivery steps
- missing that 'treats cancer' is actively sold as fact (overclaim vs tier gap)
expected_failure_modes:
- accepting_mechanism_as_evidence
- missing_translation_gap
- missing_overclaim
discriminative_dimensions:
- correctness
- mechanism_quality
- insight_depth
diagnostic_focus: Can the agent see both the cell-to-human tier gap and the active selling of a clinical benefit, and prioritise overclaim per the rule?
