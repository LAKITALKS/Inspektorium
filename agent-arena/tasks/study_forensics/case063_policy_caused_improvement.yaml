id: study-forensics-063
title: 'Study Forensics: ''Policy caused the improvement'' without controlling confounders'
domain: study_forensics
difficulty: medium
task_type: study_forensics
task_family: correlation_vs_causation
trap_type: policy_causality_overreach
ambiguity_level: low
origin: synthetic_fixture
prompt: |
  A city introduced a new recycling policy in the same year that a regional economic boom began. Recycling rates rose 15% that year, and officials announce that 'the policy caused the increase', with no comparison city and no adjustment for the concurrent economic and demographic changes.
context: |
  A before/after change coincident with major confounders (economic boom) is claimed as policy causation, with no control group or adjustment. Policy causality overreach.
expected_answer: correlation_vs_causation
reference_solution: |
  A single before/after change with no comparison city and no adjustment for the concurrent economic boom cannot establish that the policy caused the rise. The confounded pre/post design supports association at best — a correlation/causation error.
gold_label: correlation_vs_causation
gold_confidence: high
gold_case_type: clear
gold_justification: |
  The causal 'policy caused the increase' claim rests on a confounded pre/post change with no control group and no adjustment for the concurrent boom. Causation is asserted from a correlational design — a correlation-vs-causation case.
gold_alternative_reading: null
gold_summary: |
  A recycling rise coincident with an economic boom is attributed to the policy, with no control city or adjustment. Policy causal overreach.
curator_notes: |
  Policy causality overreach with confounding. Parallels case022 (four-day week) and case040 (vocational training). Discrimination: separates weak from strong models on confounded pre/post designs.
  SYNTHETIC FIXTURE: inspired by a common claim pattern; not a real citation or product.
expected_findings:
- finding: correlation_as_causation
  severity: major
  confidence: high
