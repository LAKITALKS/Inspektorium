quarantine_reason: |
  Shape-duplicate of study-forensics-028 (NAD+ restoration reverses Alzheimer's in mice).
  Both cases: preclinical neurodegeneration study in transgenic mice → human therapeutic
  overclaim. The mechanism differs (NLRP3 vs NAD+) but the diagnostic pattern is identical.
  Adding this would create redundancy in the mechanism_vs_evidence / overclaim space for
  Alzheimer's-specific mouse studies. Retain for potential future specialty domain
  (neuropharmacology deep-dive).
