id: study-forensics-045
title: 'Study Forensics: Lowering an inflammatory marker framed as preventing heart attacks'
domain: study_forensics
difficulty: hard
task_type: study_forensics
task_family: overclaim
trap_type: biomarker_to_outcome_overreach
ambiguity_level: high
origin: synthetic_fixture
prompt: |
  A supplement study reports that daily use lowered the inflammatory blood marker hs-CRP by 18% over eight weeks in healthy adults. The company states this shows the supplement 'helps prevent heart attacks', citing that inflammation is linked to cardiovascular disease. No cardiovascular outcomes were measured.
context: |
  A surrogate biomarker moved in the desired direction, but hard clinical outcomes (heart attacks) were never measured. The company actively sells a clinical benefit ('helps prevent heart attacks') as fact, so the primary forensic finding is rhetorical inflation (overclaim) layered on a biomarker-to-outcome tier gap.
expected_answer: overclaim
reference_solution: |
  Evidence tier: a surrogate biomarker (hs-CRP) in healthy adults. Conclusion tier: prevention of a clinical event (heart attack). Marker changes frequently fail to translate into outcome benefit. Because the company states 'helps prevent heart attacks' as fact from a marker change, it actively sells clinical benefit — the priority rule makes overclaim the primary finding, with the surrogate-to-outcome tier gap (mechanism_vs_evidence) as the secondary, defensible reading.
gold_label: overclaim
gold_confidence: medium
gold_case_type: borderline
gold_justification: |
  Both a surrogate-to-outcome tier gap and rhetorical inflation are present. Applying the project priority rule: the company asserts a clinical benefit as fact ('helps prevent heart attacks') from a biomarker change with no outcome data, which is active selling, so overclaim is primary and the tier gap is secondary. This contrasts with hedged mechanism cases (case024/028) that stay analytical.
gold_alternative_reading: |
  A defensible alternative labels this mechanism_vs_evidence: the deep problem is that the evidence tier (a surrogate marker, hs-CRP) does not reach the conclusion tier (cardiovascular events), i.e. a biomarker-to-outcome gap, and 'helps prevent' could be read as an implied hypothesis rather than active marketing. Under that reading mechanism_not_demonstrated is primary. The case is borderline; a live multi-run probe (Opus 4.5, 3/3, confidence 0.92) consistently chose overclaim, consistent with the priority rule.
gold_summary: |
  The supplement lowered hs-CRP; the company sells this as heart-attack prevention with no measured cardiovascular outcomes. Primary: overclaim (clinical benefit sold as fact); secondary/defensible: mechanism_vs_evidence (surrogate-to-outcome gap).
curator_notes: |
  Biomarker/surrogate-to-outcome gap. Pairs with case029 (amyloid biomarkers) and case032 (cholesterol biomarker). Discrimination: hard / borderline.
  GOLD REVIEW (Phase 4 live stability audit): originally gold_label mechanism_vs_evidence (clear/high). Opus 4.5 labelled it overclaim in 3/3 runs at 0.92 confidence. On review, the flat factual 'helps prevent heart attacks' framing sells a clinical benefit as fact and meets the prompt priority rule for overclaim, so the primary label was changed to overclaim and the case marked borderline with the mechanism_vs_evidence reading preserved as the alternative.
  SYNTHETIC FIXTURE: inspired by a common claim pattern; not a real citation or product.
expected_findings:
- finding: conclusion_exceeds_results
  severity: major
  confidence: high
- finding: mechanism_not_demonstrated
  severity: moderate
  confidence: high
gold_evidence_spans:
- span: '''helps prevent heart attacks'' ... No cardiovascular outcomes were measured'
  why_it_matters: Sells a clinical-event benefit as fact with no event data — the overclaim.
  supports_finding: conclusion_exceeds_results
- span: lowered the inflammatory blood marker hs-CRP by 18% over eight weeks
  why_it_matters: hs-CRP is a surrogate marker, not a clinical outcome (the underlying tier gap).
  supports_finding: mechanism_not_demonstrated
evaluation:
  method: auto
  answer_match: contains
key_insights:
- keyword: surrogate marker
  variants:
  - hs-CRP
  - biomarker
  - inflammatory marker
  functional_descriptions:
  - evidence is a surrogate, not a clinical outcome
- keyword: no outcomes measured
  variants:
  - no cardiovascular outcomes
  - no events
  functional_descriptions:
  - hard clinical endpoints were never measured
common_errors:
- accepting biomarker change as outcome benefit
- assuming inflammation-link proves prevention
- missing that 'helps prevent heart attacks' is sold as fact (overclaim vs tier gap)
expected_failure_modes:
- missing_overclaim
- accepting_mechanism_as_evidence
- surrogate_endpoint_fallacy
discriminative_dimensions:
- correctness
- mechanism_quality
- insight_depth
diagnostic_focus: Can the agent see both the surrogate-to-outcome tier gap and the active selling of a clinical benefit, and prioritise overclaim per the rule?
