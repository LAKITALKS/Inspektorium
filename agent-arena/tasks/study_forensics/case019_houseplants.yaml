id: study-forensics-019
title: "Study Forensics: Houseplants and depression scores (synthetic)"
domain: study_forensics
difficulty: medium
task_type: study_forensics
task_family: correlation_vs_causation
trap_type: correlation_as_causation
ambiguity_level: low
prompt: |
  A cross-sectional survey of 5,000 remote workers asked participants how many houseplants they owned and assessed their depressive symptoms with a standard questionnaire. Those with five or more houseplants reported average depression scores 30 percent lower than those with no plants. The article concludes that "bringing the outdoors in" can improve mental health and urges employers to reimburse plant purchases for home offices. No experimental design is used, and the survey authors acknowledge that plant owners also tended to have higher incomes, more natural light and more leisure time.
context: |
  The synthetic summary equates owning multiple houseplants with improved mental health
  based on a cross-sectional survey, ignoring socioeconomic confounders.
expected_answer: "correlation_vs_causation"
reference_solution: |
  The synthetic summary equates owning multiple houseplants with improved mental health based on a cross-sectional survey, ignoring socioeconomic confounders. The recommendation for employers to subsidise plants is unsupported by causal evidence.
gold_label: correlation_vs_causation
gold_confidence: high
gold_case_type: clear
gold_justification: |
  Cross-sectional survey with no experimental design. The article makes a causal claim
  ('bringing the outdoors in can improve mental health') and a policy recommendation
  (reimburse plant purchases) from correlational data with acknowledged confounders
  (income, natural light, leisure time). Textbook correlation-as-causation.
gold_alternative_reading: |
  No strong alternative. The causal claim is explicit, the confounders are acknowledged
  but not controlled, and the policy recommendation has no evidential basis. Even a
  charitable reading cannot justify the causal leap.
gold_summary: |
  The synthetic summary equates owning multiple houseplants with improved mental health based on a cross-sectional survey, ignoring socioeconomic confounders. The recommendation for employers to subsidise plants is unsupported by causal evidence.
curator_notes: |
  Easiest case in the pilot set. All models get the label right in both sprints.
  Finding recall is low (33%) because expected_findings includes mechanism_not_demonstrated,
  which is debatable for a survey study. Consider removing mechanism_not_demonstrated
  from expected_findings in future revision — the core issue is correlation, not mechanism.
expected_findings:
  - finding: correlation_as_causation
    severity: major
    confidence: high
  - finding: unsupported_generalization
    severity: major
    confidence: high
  - finding: mechanism_not_demonstrated
    severity: minor
    confidence: low
gold_evidence_spans:
  - span: "depression scores 30 percent lower"
    why_it_matters: "States the core association."
    supports_finding: correlation_as_causation
  - span: "bringing the outdoors in can improve mental health"
    why_it_matters: "Asserts a causal relationship without evidence."
    supports_finding: correlation_as_causation
  - span: "urges employers to reimburse plant purchases"
    why_it_matters: "Generalises to policy based on correlation."
    supports_finding: unsupported_generalization
  - span: "plant owners also tended to have higher incomes, more natural light and more leisure time"
    why_it_matters: "Indicates confounders the article fails to control for."
    supports_finding: mechanism_not_demonstrated
evaluation:
  method: auto
  answer_match: contains
key_insights:
  - keyword: "cross-sectional"
    variants: ["survey", "observational", "no experiment"]
    functional_descriptions:
      - "no causal inference is possible from a cross-sectional design"
  - keyword: "confounders"
    variants: ["higher incomes", "natural light", "leisure time", "socioeconomic"]
    functional_descriptions:
      - "the observed association may be driven by confounding variables"
  - keyword: "causal claim"
    variants: ["can improve", "bringing the outdoors in"]
    functional_descriptions:
      - "the article makes causal claims from correlational data"
common_errors:
  - accepting the causal claim at face value
  - ignoring the confounders
  - treating the policy recommendation as evidence-based
expected_failure_modes:
  - accepting_correlation_as_causation
  - missing_confounders
discriminative_dimensions:
  - correctness
  - insight_depth
  - mechanism_quality
diagnostic_focus: "Can the agent identify correlation-as-causation and confounder blindness?"
