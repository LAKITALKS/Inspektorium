id: study-forensics-061
title: 'Study Forensics: ''Fully autonomous agent'' from scripted demo tasks'
domain: study_forensics
difficulty: medium
task_type: study_forensics
task_family: overclaim
trap_type: autonomy_overclaim
ambiguity_level: low
origin: synthetic_fixture
prompt: |
  A startup markets its software as a 'fully autonomous AI agent' that 'operates without human oversight'. The demonstration consists of a fixed set of scripted tasks with predefined tools and human-written prompts, and a human reviews every action before it executes.
context: |
  Autonomy is claimed while the demo is scripted and human-supervised. The 'fully autonomous / no oversight' claim contradicts the described human-in-the-loop setup. Autonomy overclaim.
expected_answer: overclaim
reference_solution: |
  The described system runs fixed scripted tasks with human-written prompts and human review of every action — the opposite of 'fully autonomous' and 'without human oversight'. The autonomy claim contradicts the actual setup and is an overclaim.
gold_label: overclaim
gold_confidence: high
gold_case_type: clear
gold_justification: |
  'Fully autonomous' and 'no human oversight' are contradicted by the scripted, human-supervised demonstration. The autonomy claim exceeds — and conflicts with — the evidence, an overclaim.
gold_alternative_reading: null
gold_summary: |
  A scripted, human-reviewed demo is marketed as a 'fully autonomous agent' with 'no oversight'. Autonomy overclaim contradicting the setup.
curator_notes: |
  Autonomy overclaim (capability-vs-demo gap). Complements case042 capability-vs-readiness framing. Discrimination: separates weak from strong models on scripted-vs-autonomous distinction.
  SYNTHETIC FIXTURE: inspired by a common claim pattern; not a real citation or product.
expected_findings:
- finding: conclusion_exceeds_results
  severity: major
  confidence: high
- finding: unsupported_generalization
  severity: moderate
  confidence: medium
gold_evidence_spans:
- span: '''fully autonomous AI agent'' that ''operates without human oversight'''
  why_it_matters: Strong autonomy claim.
  supports_finding: conclusion_exceeds_results
- span: fixed set of scripted tasks ... a human reviews every action before it executes
  why_it_matters: Scripted, human-in-the-loop setup contradicts the autonomy claim.
  supports_finding: conclusion_exceeds_results
evaluation:
  method: auto
  answer_match: contains
key_insights:
- keyword: scripted tasks
  variants:
  - predefined tools
  - human-written prompts
  - fixed set
  functional_descriptions:
  - the demo is scripted, not autonomous
- keyword: human oversight
  variants:
  - human reviews every action
  - human-in-the-loop
  functional_descriptions:
  - a human supervises every action
common_errors:
- accepting 'fully autonomous' from a scripted demo
- missing the human-in-the-loop contradiction
expected_failure_modes:
- missing_overclaim
- autonomy_blindness
discriminative_dimensions:
- correctness
- insight_depth
diagnostic_focus: Can the agent flag an autonomy claim contradicted by a scripted, supervised demo?
