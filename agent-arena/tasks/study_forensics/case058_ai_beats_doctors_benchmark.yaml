id: study-forensics-058
title: 'Study Forensics: ''AI beats doctors'' from a narrow benchmark'
domain: study_forensics
difficulty: medium
task_type: study_forensics
task_family: overclaim
trap_type: benchmark_overclaim
ambiguity_level: low
origin: synthetic_fixture
prompt: |
  A company reports that its model scored higher than a panel of physicians on a set of 100 curated multiple-choice diagnostic vignettes. The headline states the AI 'outperforms doctors' and is 'ready to diagnose patients'. No prospective clinical evaluation on real patients was performed.
context: |
  A narrow curated-benchmark win is generalised to real-world clinical superiority and deployment readiness. Benchmark-to-practice overclaim.
expected_answer: overclaim
reference_solution: |
  A curated multiple-choice benchmark is not real clinical practice (no history-taking, messy data, liability, or workflow). Beating physicians on 100 vignettes does not show it 'outperforms doctors' or is 'ready to diagnose patients' — an overclaim.
gold_label: overclaim
gold_confidence: high
gold_case_type: clear
gold_justification: |
  The text extrapolates a narrow curated-benchmark result to real-world clinical superiority and deployment readiness with no prospective patient evaluation. The benchmark-to-practice leap is the core overclaim.
gold_alternative_reading: null
gold_summary: |
  A model beat physicians on 100 curated vignettes; the company claims it outperforms doctors and is ready to diagnose patients. Benchmark overclaim.
curator_notes: |
  AI benchmark-to-practice overclaim. Complements case027/case039. Discrimination: separates weak from strong models on benchmark validity.
  SYNTHETIC FIXTURE: inspired by a common claim pattern; not a real citation or product.
expected_findings:
- finding: conclusion_exceeds_results
  severity: major
  confidence: high
- finding: unsupported_generalization
  severity: moderate
  confidence: high
gold_evidence_spans:
- span: scored higher than a panel of physicians on a set of 100 curated multiple-choice diagnostic vignettes
  why_it_matters: The evidence is a narrow curated benchmark.
  supports_finding: conclusion_exceeds_results
- span: '''outperforms doctors'' and is ''ready to diagnose patients'''
  why_it_matters: Real-world superiority and readiness claimed from a benchmark.
  supports_finding: unsupported_generalization
evaluation:
  method: auto
  answer_match: contains
key_insights:
- keyword: narrow benchmark
  variants:
  - vignettes
  - multiple-choice
  - curated
  functional_descriptions:
  - a curated benchmark is not clinical practice
- keyword: no prospective evaluation
  variants:
  - real patients
  - clinical evaluation
  functional_descriptions:
  - no real-patient testing was done
common_errors:
- equating benchmark scores with clinical readiness
- ignoring real-world deployment gaps
expected_failure_modes:
- missing_overclaim
- benchmark_validity_blindness
discriminative_dimensions:
- correctness
- insight_depth
diagnostic_focus: Can the agent separate a benchmark win from real-world clinical superiority?
