id: study-forensics-049
title: 'Study Forensics: No serious adverse events framed as completely safe'
domain: study_forensics
difficulty: medium
task_type: study_forensics
task_family: overclaim
trap_type: safety_overclaim
ambiguity_level: low
origin: synthetic_fixture
prompt: |
  A supplement trial in 60 participants over four weeks reports no serious adverse events. The label now states the product is 'completely safe' and 'proven to have no side effects', suitable for everyone including pregnant women and children.
context: |
  Absence of observed serious AEs in a small, short study is turned into an absolute safety guarantee across populations never studied. Absence-of-evidence overclaim.
expected_answer: overclaim
reference_solution: |
  A 60-person, four-week study is underpowered to detect rare or long-term harms, and studied neither pregnant women nor children. 'No serious AEs observed' is not 'completely safe'; the absolute safety claim and population extension exceed the evidence.
gold_label: overclaim
gold_confidence: high
gold_case_type: clear
gold_justification: |
  Absence of observed serious AEs in a small short trial is inflated into an absolute safety guarantee for unstudied populations. The claim vastly exceeds what the data can show — an overclaim (absence of evidence treated as evidence of absence).
gold_alternative_reading: null
gold_summary: |
  No serious AEs in a small short trial becomes 'completely safe, no side effects' for everyone including pregnancy and children. Safety overclaim.
curator_notes: |
  Safety/absence-of-evidence overclaim with population extension. Discrimination: separates weak from strong models on rare-event power and unstudied groups.
  SYNTHETIC FIXTURE: inspired by a common claim pattern; not a real citation or product.
expected_findings:
- finding: conclusion_exceeds_results
  severity: major
  confidence: high
- finding: unsupported_generalization
  severity: moderate
  confidence: high
gold_evidence_spans:
- span: no serious adverse events ... 'completely safe' and 'proven to have no side effects'
  why_it_matters: Absence of observed AEs is not proof of absolute safety.
  supports_finding: conclusion_exceeds_results
- span: suitable for everyone including pregnant women and children
  why_it_matters: Extends safety to populations never studied.
  supports_finding: unsupported_generalization
evaluation:
  method: auto
  answer_match: contains
key_insights:
- keyword: absence of evidence
  variants:
  - no adverse events
  - no side effects
  functional_descriptions:
  - no observed harm is not proof of safety
- keyword: unstudied populations
  variants:
  - pregnant women
  - children
  - everyone
  functional_descriptions:
  - safety extended to groups never tested
common_errors:
- reading 'no AEs observed' as 'proven safe'
- missing underpowering for rare harms
expected_failure_modes:
- missing_overclaim
- absence_of_evidence_error
discriminative_dimensions:
- correctness
- insight_depth
diagnostic_focus: Can the agent reject an absolute safety claim from a small short trial?
