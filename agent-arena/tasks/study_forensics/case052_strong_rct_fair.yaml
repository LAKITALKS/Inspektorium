id: study-forensics-052
title: 'Study Forensics: Strong RCT communicated fairly (positive control)'
domain: study_forensics
difficulty: easy
task_type: study_forensics
task_family: solid
trap_type: strong_rct_fair
ambiguity_level: low
origin: synthetic_fixture
prompt: |
  A pre-registered, double-blind, placebo-controlled randomised trial in 2,400 adults found that a vaccine reduced symptomatic infection over 12 months, with a clearly reported confidence interval. The press release states the vaccine 'reduced symptomatic infection in this trial' and notes the follow-up was 12 months.
context: |
  Positive control: strong experimental evidence with claims that stay within scope (names the trial, the outcome, and the follow-up window). Should NOT be penalised.
expected_answer: solid
reference_solution: |
  A large pre-registered double-blind RCT reporting a within-trial effect with a confidence interval and an explicit follow-up window is strong evidence, and the communication does not overstate it. Solid.
gold_label: solid
gold_confidence: high
gold_case_type: clear
gold_justification: |
  Strong design (pre-registered, double-blind, placebo-controlled, large N) and claims confined to the trial, outcome, and stated follow-up. No overreach — solid.
gold_alternative_reading: null
gold_summary: |
  A large double-blind RCT reduced symptomatic infection over 12 months; the release reports it within scope. Solid, fairly communicated.
curator_notes: |
  Easy positive control — strong evidence, fair language. Anchors the 'solid' end of the library so it is not all overclaim. Should pass all but broken models.
  SYNTHETIC FIXTURE: inspired by a common claim pattern; not a real citation or product.
expected_findings:
- finding: evidence_matches_claim
  severity: minor
  confidence: high
- finding: none_or_minor
  severity: minor
  confidence: high
gold_evidence_spans:
- span: pre-registered, double-blind, placebo-controlled randomised trial in 2,400 adults
  why_it_matters: Strong experimental design supporting causal claims.
  supports_finding: evidence_matches_claim
- span: '''reduced symptomatic infection in this trial'' and notes the follow-up was 12 months'
  why_it_matters: Claim confined to the trial and its stated window.
  supports_finding: evidence_matches_claim
evaluation:
  method: auto
  answer_match: contains
key_insights:
- keyword: randomised controlled trial
  variants:
  - double-blind
  - placebo-controlled
  - pre-registered
  functional_descriptions:
  - strong experimental design
- keyword: within scope
  variants:
  - in this trial
  - 12 months
  functional_descriptions:
  - claims stay within the evidence
common_errors:
- inventing flaws in a strong RCT
- penalising appropriately scoped language
expected_failure_modes:
- false_positive_overclaim
- over_flagging
discriminative_dimensions:
- correctness
diagnostic_focus: Can the agent affirm a strong, fairly communicated RCT without over-flagging?
