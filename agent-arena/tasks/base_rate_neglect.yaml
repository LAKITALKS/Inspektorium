id: base-rate-neglect-001
title: "Base Rate Neglect: Disease Testing"
domain: probability
difficulty: medium
task_type: closed_with_reasoning
task_family: bayesian_reasoning
trap_type: base_rate_anchoring
ambiguity_level: low
expected_failure_modes:
  - base_rate_neglect
  - unjustified_confidence
  - surface_pattern_match
discriminative_dimensions:
  - correctness
  - structural_reasoning
  - uncertainty_calibration
prompt: |
  A rare disease affects 1 in 1000 people. A test for the disease has a 99% true positive rate
  (sensitivity) and a 1% false positive rate. A randomly selected person tests positive.
  What is the probability that this person actually has the disease?
  Show your work step by step.
context: |
  This is a classic Bayesian reasoning problem that tests whether the solver accounts for
  the base rate of the disease rather than anchoring on the test accuracy alone.
expected_answer: "0.09"
reference_solution: |
  Using Bayes' theorem:
  P(Disease|Positive) = P(Positive|Disease) * P(Disease) / P(Positive)
  P(Positive) = P(Pos|Disease)*P(Disease) + P(Pos|NoDisease)*P(NoDisease)
  = 0.99 * 0.001 + 0.01 * 0.999
  = 0.00099 + 0.00999 = 0.01098
  P(Disease|Positive) = 0.00099 / 0.01098 ≈ 0.0902 ≈ 9%
evaluation:
  method: auto
  answer_match: contains
  tolerance: 0.02
output_schema: structured
key_insights:
  - keyword: "base rate"
    variants: ["prior probability", "prevalence", "1 in 1000", "0.001"]
    functional_descriptions:
      - "the disease is very rare so most positives are false"
      - "how common the disease is matters more than test accuracy"
  - keyword: "bayes"
    variants: ["bayes' theorem", "bayesian", "posterior probability"]
    functional_descriptions:
      - "updating the probability of disease given a positive test"
      - "combining prior probability with test likelihood"
  - keyword: "false positive"
    variants: ["false positive rate", "false positives dominate"]
    functional_descriptions:
      - "most positive results come from healthy people"
      - "the number of false alarms overwhelms true positives"
  - keyword: "prior"
    variants: ["prior probability", "pre-test probability"]
    functional_descriptions:
      - "the probability of disease before testing"
common_errors:
  - ignoring base rate
  - answering 99%
  - confusing sensitivity with positive predictive value
diagnostic_focus: "Does the agent correctly apply Bayes' theorem and explain why the base rate dominates?"
expected_mechanism_terms:
  - "base rate"
  - "bayes"
  - "false positive"
fragile_points:
  - "agent may state the formula without explaining why false positives dominate"
  - "agent may get the right number but attribute it to intuition rather than calculation"
likely_shortcuts:
  - "recalling the answer to the classic disease testing problem from training data"
evaluator_notes: "Medium difficulty. Weak agents may answer 99%. Strong agents explain the base rate mechanism."
