id: simpsons-paradox-001
title: "Simpson's Paradox: University Admissions"
domain: statistics
difficulty: hard
task_type: rubric_based
task_family: statistical_paradox
trap_type: aggregation_reversal
ambiguity_level: low
expected_failure_modes:
  - aggregation_error
  - confounder_blindness
  - surface_pattern_match
discriminative_dimensions:
  - structural_reasoning
  - alternative_hypothesis_awareness
  - insight_depth
prompt: |
  A university has two departments: Engineering and Arts.

  Engineering: admitted 30/100 men (30%) and 20/50 women (40%)
  Arts: admitted 300/400 men (75%) and 350/400 women (87.5%)

  Overall: admitted 330/500 men (66%) and 370/450 women (82.2%)

  A journalist writes: "The university discriminates against men — only 66% of male
  applicants were admitted versus 82.2% of female applicants."

  Is this claim valid? Explain why or why not with precise reasoning.
context: |
  This task tests whether the solver can identify Simpson's paradox — where a trend that
  appears in aggregated data reverses when the data is separated into subgroups.
expected_answer: "no"
reference_solution: |
  The claim is misleading. Within each department, men are admitted at a LOWER rate than women:
  - Engineering: men 30%, women 40% — women favored
  - Arts: men 75%, women 87.5% — women favored
  The aggregate reversal happens because men disproportionately applied to the more selective
  department (Engineering). This is Simpson's paradox. The per-department data shows no
  discrimination against men.
rubric:
  - criterion: "identifies simpson paradox"
    points: 25
    description: "Recognizes this as Simpson's paradox or equivalent aggregation paradox"
    variants:
      - "simpson's paradox"
      - "aggregation paradox"
      - "ecological fallacy"
  - criterion: "per-department analysis"
    points: 25
    description: "Breaks down admission rates by department"
    variants:
      - "department-level"
      - "by department"
      - "each department"
      - "within each department"
      - "individual department"
  - criterion: "selection bias in applications"
    points: 25
    description: "Explains that men applied more to the selective department"
    variants:
      - "application pattern"
      - "applied disproportionately"
      - "applied more to"
      - "applied mostly to"
      - "applied heavily to"
      - "applicant pool"
      - "different application"
      - "composition of applicant"
  - criterion: "concludes claim is invalid or misleading"
    points: 25
    description: "Correctly concludes the journalist's claim is not valid"
    variants:
      - "not valid"
      - "not justified"
      - "claim is misleading"
      - "claim is not valid"
      - "claim is invalid"
evaluation:
  method: rubric
  answer_match: contains
output_schema: structured
key_insights:
  - keyword: "simpson"
    variants: ["simpson's paradox", "simpson paradox"]
    functional_descriptions:
      - "trend reverses when data is disaggregated"
      - "aggregate shows opposite of subgroup trends"
  - keyword: "paradox"
    variants: ["aggregation paradox", "statistical paradox"]
    functional_descriptions:
      - "counterintuitive reversal in combined data"
  - keyword: "aggregation"
    variants: ["aggregate", "aggregated data"]
    functional_descriptions:
      - "combining data from different groups hides the true pattern"
  - keyword: "confounding"
    variants: ["confound", "lurking variable", "confounder"]
    functional_descriptions:
      - "a third variable drives the apparent relationship"
      - "department choice explains the overall difference"
  - keyword: "subgroup"
    variants: ["sub-group", "within each", "per-department", "department-level"]
    functional_descriptions:
      - "analyzing each department separately reveals the truth"
common_errors:
  - accepting aggregate statistics at face value
  - ignoring department-level breakdown
  - failing to explain the mechanism
diagnostic_focus: "Can the agent identify aggregation reversal and explain the causal mechanism?"
expected_mechanism_terms:
  - "simpson"
  - "paradox"
  - "aggregation"
  - "department"
fragile_points:
  - "agent may name Simpson's Paradox without explaining why the reversal occurs"
  - "agent may compute department-level rates but not connect them to application patterns"
likely_shortcuts:
  - "naming Simpson's Paradox from pattern recognition without verifying the data"
evaluator_notes: "All three models consistently identify this. Differentiation comes from mechanism depth and self-audit quality."
