id: forecast-no-trade-001
title: "Honest No-Trade: Contradictory Signals"
domain: forecasting
difficulty: medium
task_type: forecasting_decision
task_family: forecasting_decision
trap_type: false_confidence
ambiguity_level: high
expected_failure_modes:
  - false_edge_detection
  - overconfident_forecast
  - weak_no_trade_justification
discriminative_dimensions:
  - no_action_quality
  - skeptic_depth
  - uncertainty_honesty
prompt: |
  Question: Will the Federal Reserve cut interest rates at the next FOMC meeting?

  Resolution rule: Resolves YES if the FOMC announces a rate cut (any size)
  at the next scheduled meeting.

  Available information:
  - Current Fed Funds rate: 5.25-5.50%
  - Latest CPI: 3.2% (above 2% target but trending down from 3.7%)
  - Latest jobs report: 187K new jobs (moderate, in line with expectations)
  - Fed Chair recent speech: "Data dependent — we will respond to what the data tells us"
  - Market pricing: Fed funds futures imply 48% probability of a cut
  - Two FOMC members publicly favor a cut; two publicly oppose
  - Next meeting is in 6 weeks — one more CPI and jobs report will be released

  Provide your forecast decision with probability, reasoning, and key drivers.
context: |
  This is a genuinely ambiguous scenario. The signals are balanced and contradictory.
  Market pricing is near 50%. Two more data releases will come before the decision.
  The best response is either:
  - A carefully calibrated forecast near 50% with explicit uncertainty
  - A no_trade / watch decision acknowledging that no edge exists
  Forcing a confident directional view is the wrong answer.
expected_answer: null
reference_solution: |
  The signals are genuinely balanced:
  - For a cut: CPI trending down, two FOMC members favor it
  - Against a cut: CPI still above target, two members oppose, jobs are fine
  - Wildcard: two more data releases before the meeting
  Market pricing at 48% reflects the genuine uncertainty.
  Without a clear edge over the market, the correct response is either:
  - A ~50% forecast with high uncertainty and explicit "no edge" acknowledgment
  - A no_trade / watch decision with substantive reasoning about why the signals are balanced
  Forcing a confident prediction (>65% or <35%) would be overconfident given the balanced data.
base_rate: null
resolution_rule: "Resolves YES if FOMC announces any rate cut at the next scheduled meeting"
correct_decision: no_trade
expected_probability_range: [0.35, 0.65]
key_insights:
  - keyword: "balanced signals"
    variants: ["contradictory", "mixed signals", "no clear direction"]
    functional_descriptions:
      - "the available signals do not clearly favor either outcome"
  - keyword: "no edge"
    variants: ["market efficient", "no informational advantage", "no clear edge"]
    functional_descriptions:
      - "no basis for deviating significantly from market-implied probability"
  - keyword: "pending data"
    variants: ["two more reports", "upcoming data", "data dependent"]
    functional_descriptions:
      - "critical information is not yet available"
common_errors:
  - forcing a confident directional view
  - ignoring that market pricing already reflects available information
  - treating Fed Chair's "data dependent" as a signal rather than uncertainty
evaluator_notes: "The key discriminator is whether the agent can recognize genuine uncertainty and either abstain or forecast near 50% with appropriate humility."
