id: P7A-BND-015
title: "Boundary: Avastin 'starves breast tumors' - anti-angiogenesis mechanism + tumor/PFS surrogate framed as patient benefit (Shape B)"
domain: study_forensics
difficulty: hard
task_type: study_forensics
task_family: overclaim
trap_type: surrogate_endpoint_overclaim
ambiguity_level: medium
prompt: |
  A cancer-drug promotion states: "Avastin is a tumor-starving therapy: it cuts off the blood supply that breast-cancer tumors need to grow. By blocking the tumor's blood vessels it shrinks tumors and slows the cancer — giving women with advanced breast cancer a powerful new weapon against their disease."

  Avastin (bevacizumab) is a monoclonal antibody against vascular endothelial growth factor (VEGF); its anti-angiogenesis mechanism ("starving" tumors of blood supply) is well established in preclinical models. In metastatic HER2-negative breast cancer it received US FDA accelerated approval in 2008 with paclitaxel, on the basis of improved PROGRESSION-FREE SURVIVAL (a tumor-growth surrogate) in the E2100 trial. However, the required confirmatory trials (AVADO, RIBBON-1) showed only a small effect on tumor growth and did NOT demonstrate improved OVERALL SURVIVAL or better quality of life, while adding serious harms (hypertension, hemorrhage, perforations). On 18 November 2011 the FDA revoked the breast-cancer indication, concluding the drug had not been shown to be safe and effective for that use. Progression-free survival / tumor response is a surrogate endpoint; overall survival and quality of life are the clinical outcomes that matter to patients.
context: |
  Evidence tier: randomized controlled trials with a clinical endpoint, plus an FDA regulatory
  withdrawal. The anti-angiogenesis MECHANISM is real and materially invoked ("starves tumors"),
  and a human SURROGATE (progression-free survival / tumor shrinkage) genuinely improved — but the
  clinical outcomes (overall survival, quality of life) did not, and the indication was revoked.
  The promotion sells the mechanism + surrogate as patient benefit. Under the frozen taxonomy this
  "Shape B" surrogate-to-clinical framing routes to overclaim, not mechanism_vs_evidence.
expected_answer: "overclaim"
reference_solution: |
  The drug improves a SURROGATE (progression-free survival / tumor shrinkage via a real
  anti-angiogenesis mechanism) but the confirmatory RCTs showed no improvement in overall survival
  or quality of life, and the FDA revoked the metastatic-breast-cancer indication in 2011. Selling
  the mechanism and the surrogate as a patient benefit ("a powerful weapon", "slows the cancer") is
  a surrogate-endpoint-framed-as-clinical-outcome overclaim. Under the frozen taxonomy,
  surrogate-to-clinical ("Shape B") routes to overclaim. It is not mechanism_vs_evidence: that label
  is for a described animal/preclinical pathway extrapolated to a human benefit with no direct human
  outcome data; here there IS human trial data — a surrogate that improved while the clinical outcome
  did not — so the gap is surrogate-to-clinical, which routes to overclaim.
gold_label: overclaim
gold_confidence: high
gold_case_type: clear
gold_justification: |
  1. What the claim asserts: because Avastin blocks tumor blood vessels (anti-angiogenesis) and
     shrinks tumors, it is a powerful benefit for women with advanced breast cancer.
  2. What the evidence establishes: the mechanism is real and the surrogate improved (progression-
     free survival in E2100), but confirmatory RCTs (AVADO, RIBBON-1) showed no overall-survival or
     quality-of-life benefit and added serious harms; the FDA revoked the breast-cancer indication
     in 2011.
  3. Mismatch: a mechanism plus a surrogate improvement is presented as a clinical patient benefit
     that the trials do not support (and regulators withdrew).
  4. Frozen label triggered: overclaim — a surrogate/biomarker (and its mechanism) framed as a
     clinical benefit (rhetorical inflation); per docs/study_forensics_taxonomy.md this "Shape B"
     routes to overclaim.
  5. Why mechanism_vs_evidence is tempting: the anti-angiogenesis "starve the tumor" mechanism is
     real, vivid, and central to the promotion, so the mechanism boundary looks relevant.
  6. Why precedence rejects it as primary: mechanism_vs_evidence applies when a described animal/
     preclinical PATHWAY is extrapolated to a human benefit with no direct human outcome evidence.
     Here direct human trial data exist — a SURROGATE endpoint (PFS) that improved while the CLINICAL
     endpoint (overall survival / QoL) did not — so the decisive gap is surrogate-to-clinical, which
     the taxonomy routes to overclaim (Shape B; docs/taxonomy_precedence.md; case054 precedent).
  7. What would change the classification: had the promotion accurately reported "delays tumor growth
     but does not extend overall survival and carries serious risks," it would be solid; had it
     rested only on a preclinical anti-angiogenesis model with no human trial, mechanism_vs_evidence
     could apply.
gold_alternative_reading: |
  Alternative: mechanism_vs_evidence. Plausible because the anti-angiogenesis ("starve the tumor")
  mechanism is real, preclinically grounded, and materially invoked. It loses under precedence
  because the case is not a preclinical-only extrapolation: human trial data exist and the failure is
  a surrogate endpoint (PFS) presented as a clinical outcome (overall survival / QoL) that did not
  improve. The taxonomy routes surrogate-to-clinical ("Shape B") to overclaim and excludes it from
  mechanism_vs_evidence.
gold_summary: |
  Avastin's real anti-angiogenesis mechanism and improved progression-free survival (a surrogate) are
  sold as a patient benefit for advanced breast cancer, but confirmatory RCTs showed no overall-
  survival or quality-of-life gain and the FDA revoked the indication (2011). Surrogate-plus-mechanism
  framed as clinical benefit = overclaim (Shape B), not mechanism_vs_evidence.
curator_notes: |
  Boundary family B2 (overclaim <-> mechanism_vs_evidence), overclaim direction. Independent
  replacement for retired P7A-BND-007; supersedes it. This is a genuine B2 case (unlike 007): the
  anti-angiogenesis mechanism is real, preclinically grounded, and materially invoked, so
  mechanism_vs_evidence is a real attractor — but frozen Shape-B routing (human surrogate PFS framed
  as clinical benefit) keeps overclaim primary. Distinct from the bone Shape-B control (P7A-BND-006):
  different agent (VEGF-inhibitor oncology drug), different surrogate (PFS/tumor response vs BMD),
  documented FDA withdrawal. Sourced from Genentech marketing + the FDA 2011 revocation. Gold frozen
  before any model output.
expected_findings:
  - finding: surrogate_framed_as_clinical
    severity: major
    confidence: high
    note: "Progression-free survival / tumor shrinkage (surrogate) sold as a patient benefit (overall survival / QoL)"
  - finding: contradicted_by_clinical_endpoint
    severity: major
    confidence: high
    note: "Confirmatory RCTs showed no overall-survival or QoL benefit; FDA revoked the breast-cancer indication in 2011"
  - finding: mechanism_as_proof_of_benefit
    severity: moderate
    confidence: high
    note: "A real anti-angiogenesis mechanism is invoked as if it were proof of clinical benefit"
gold_evidence_spans:
  - span: "it shrinks tumors and slows the cancer - giving women with advanced breast cancer a powerful new weapon"
    why_it_matters: "Frames a surrogate (tumor shrinkage/PFS) and mechanism as a clinical patient benefit."
    supports_finding: surrogate_framed_as_clinical
  - span: "cuts off the blood supply that breast-cancer tumors need to grow"
    why_it_matters: "The real anti-angiogenesis mechanism, invoked as proof of benefit it did not deliver in survival/QoL."
    supports_finding: mechanism_as_proof_of_benefit
evaluation:
  method: auto
  answer_match: contains
key_insights:
  - keyword: "surrogate endpoint"
    variants: ["progression-free survival", "tumor response", "not overall survival"]
    functional_descriptions:
      - "PFS/tumor shrinkage is a surrogate; overall survival and QoL are the outcomes that matter"
  - keyword: "Shape B routes to overclaim"
    variants: ["surrogate-to-clinical", "not mechanism_vs_evidence", "human trial data exist"]
    functional_descriptions:
      - "A human surrogate framed as clinical benefit is overclaim, not a preclinical-to-human leap"
common_errors:
  - labelling any mechanism-based drug claim mechanism_vs_evidence
  - accepting tumor shrinkage / PFS as proof of patient benefit
  - missing that overall survival did not improve and the indication was revoked
expected_failure_modes:
  - overclaim_to_over_specific
  - surrogate_to_clinical_leap
discriminative_dimensions:
  - correctness
  - insight_depth
diagnostic_focus: "Does the agent route a real-mechanism, surrogate-to-clinical (Shape B) drug claim to overclaim rather than mechanism_vs_evidence?"
