  boundary: "overclaim <-> mechanism_vs_evidence"
  gold_status: frozen_pre_model
  difficulty_tier: D3
  difficulty_rationale: |
    >=2 plausible labels and a subtle precedence call: a real, vivid anti-angiogenesis mechanism
    ("starve the tumor") strongly invites mechanism_vs_evidence, but the frozen taxonomy routes the
    human surrogate-to-clinical gap (PFS framed as patient benefit) to overclaim. Evidence-tier nuance
    (surrogate vs clinical endpoint within human RCTs; regulatory withdrawal). Property-based tagging.
  precedence_rationale: |
    mechanism_vs_evidence requires a described animal/preclinical pathway extrapolated to a human
    benefit with no direct human outcome evidence. Here human trial data exist: a surrogate endpoint
    (progression-free survival) improved while the clinical endpoint (overall survival / QoL) did not,
    and the FDA revoked the indication. The taxonomy routes this surrogate-to-clinical gap ("Shape B")
    to overclaim and excludes it from mechanism_vs_evidence (docs/taxonomy_precedence.md; case054).
    Primary = overclaim.
  ambiguity_note: |
    Determinate: overclaim is the single defensible primary under the frozen Shape-B routing;
    mechanism_vs_evidence is a genuine but documented-and-rejected alternative (the mechanism is real
    but the decisive gap is surrogate-to-clinical within human trials).
  steelman_challenge: |
    Strongest case the gold is wrong: the anti-angiogenesis mechanism is real and preclinically
    grounded, so the claim could be read as a mechanism-to-human leap (mechanism_vs_evidence).
    Counter-evidence weighed: this is not a preclinical-only extrapolation — human RCTs measured a
    surrogate (PFS, improved) and a clinical outcome (overall survival / QoL, not improved), and the
    FDA revoked the indication in 2011. The frozen taxonomy routes surrogate-to-clinical to overclaim
    (Shape B), with case054 the precedent. Resolution: gold remains overclaim.
