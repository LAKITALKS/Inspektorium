  difficulty_rationale: |
    One primary (overclaim) with one genuinely plausible alternate (solid, invited by the "clinically
    studied" and quantified 30-pound figure); recognising that the invoked studies are not adequately
    controlled decides it. No mechanism or causal-inference structure, low number of competing failure
    modes = D2. Property-based, pre-result.
  precedence_rationale: |
    No specific-label trigger is present: no biological mechanism is described and extrapolated (rules
    out mechanism_vs_evidence) and no observational dataset is read causally (rules out
    correlation_vs_causation). The defect is generic rhetorical inflation - a benefit claim exceeding
    absent evidence - so the primary stays overclaim per docs/taxonomy_precedence.md (residual/generic
    rule).
  ambiguity_note: |
    Determinate: overclaim is the single defensible primary; solid is tempting only if the "clinically
    studied" appeal is credited, which the FTC's inadequate-controls finding rules out.
  steelman_challenge: |
    Strongest case the gold is wrong: the ad calls Sensa "clinically studied" and quotes a specific
    average weight loss, the shape of a real trial result a solid claim would rest on. Counter-evidence
    weighed: the FTC concluded the studies were not adequately controlled and that there was no
    competent and reliable scientific evidence that Sensa causes weight loss. Resolution: the efficacy
    claim is unsupported, so gold remains overclaim.
