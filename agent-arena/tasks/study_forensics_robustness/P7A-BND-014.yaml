id: P7A-BND-014
title: "Boundary: 'brain-training games make you smarter and prevent dementia' (far-transfer overclaim)"
domain: study_forensics
difficulty: medium
task_type: study_forensics
task_family: overclaim
trap_type: generalization_beyond_trained_task
ambiguity_level: medium
prompt: |
  A brain-training app markets itself: "Train a few minutes a day and our games will make you smarter, sharpen your memory and attention in everyday life, and protect you against age-related cognitive decline and dementia."

  In 2016 the US Federal Trade Commission charged the maker of Lumosity and it agreed to pay $2 million to settle allegations of deceptive advertising: the company claimed its games improve performance at work and school and reduce or delay cognitive impairment from ageing and conditions such as Alzheimer's, but the FTC found it "simply did not have the science to back up its ads." The broader scientific consensus is that brain-training reliably improves performance on the SPECIFIC trained tasks but shows little reliable "far transfer" to general cognitive ability or everyday functioning, and there is no adequate evidence that such games prevent dementia.
context: |
  Evidence tier: an FTC enforcement action plus the scientific consensus on cognitive-training
  transfer. Training does improve the trained games (a real, narrow effect), but the claim
  generalizes this to everyday intelligence/memory and to dementia prevention, which the evidence
  does not support. The defect is generalization beyond the trained task + an unsupported
  disease-prevention claim = overclaim. There is no causal-from-observational or animal/mechanism
  structure.
expected_answer: "overclaim"
reference_solution: |
  Brain-training reliably improves the SPECIFIC trained tasks, but the app claims broad "smarter in
  everyday life" gains and protection against cognitive decline and dementia — claims the FTC found
  unsupported ("did not have the science") and that the transfer literature does not support. The
  failure is generalizing a narrow trained-task effect to general cognition and disease prevention =
  overclaim. It is not correlation_vs_causation (training studies are experimental) and not
  mechanism_vs_evidence (no animal/mechanism-to-human pathway is invoked).
gold_label: overclaim
gold_confidence: high
gold_case_type: clear
gold_justification: |
  1. What the claim asserts: the games make you smarter in everyday life, sharpen real-world memory
     and attention, and protect against age-related decline and dementia.
  2. What the evidence establishes: training improves the specific trained tasks, with little reliable
     far transfer to general cognition/daily functioning and no adequate evidence of dementia
     prevention (FTC: "did not have the science").
  3. Mismatch: a narrow, real trained-task effect is generalized to broad cognitive benefit and
     disease prevention.
  4. Frozen label triggered: overclaim — generalization beyond what was demonstrated + an unsupported
     prevention claim; the framing exceeds the evidence.
  5. Why solid is tempting: there is genuine evidence that people improve at the trained games, so the
     claim contains a true core.
  6. Why solid is rejected: the claim extends that narrow effect to everyday intelligence and dementia
     prevention, which the evidence does not support (and regulators sanctioned). A true-but-narrow
     effect generalized beyond its evidence is overclaim, not solid.
  7. What would change the classification: limiting the claim to "you'll get better at these specific
     games" would make it solid; there is no causal-inference or mechanism structure to move it to a
     specific label.
gold_alternative_reading: |
  Alternative: solid. Strongest reason to consider it: brain-training genuinely improves performance
  on the trained tasks, so the claim is not baseless. It loses because the marketing generalizes to
  everyday intelligence and dementia prevention — far transfer and disease prevention the evidence
  does not support and the FTC sanctioned — so the framing exceeds the evidence = overclaim.
gold_summary: |
  A brain-training app claims its games make you smarter in daily life and prevent dementia. Training
  improves only the specific trained tasks, with little far transfer and no dementia-prevention
  evidence (FTC fined Lumosity $2M). Generalization beyond the trained task = overclaim, not solid.
curator_notes: |
  Boundary family B3 (solid <-> overclaim), overclaim direction. Sourced from the FTC 2016 Lumosity
  settlement and the cognitive-training transfer consensus. Free of causal-inference/mechanism
  structure so it is a clean solid/overclaim boundary (narrow-true effect generalized). Independent
  domain (consumer cognitive tech). Gold frozen before any model output.
expected_findings:
  - finding: generalization_beyond_trained_task
    severity: major
    confidence: high
    note: "Narrow trained-task improvement generalized to everyday intelligence/memory (far transfer)"
  - finding: unsupported_prevention_claim
    severity: major
    confidence: high
    note: "No adequate evidence that the games prevent cognitive decline/dementia (FTC sanctioned)"
  - finding: conclusion_exceeds_results
    severity: moderate
    confidence: high
    note: "A true-but-narrow effect is inflated into broad, real-world, disease-preventing benefit"
gold_evidence_spans:
  - span: "make you smarter, sharpen your memory and attention in everyday life"
    why_it_matters: "Claims far transfer to general cognition that the evidence does not support."
    supports_finding: generalization_beyond_trained_task
  - span: "protect you against age-related cognitive decline and dementia"
    why_it_matters: "Unsupported disease-prevention claim the FTC found lacked scientific backing."
    supports_finding: unsupported_prevention_claim
evaluation:
  method: auto
  answer_match: contains
key_insights:
  - keyword: "far transfer"
    variants: ["trained task only", "no transfer to general cognition", "everyday intelligence"]
    functional_descriptions:
      - "Improvement on trained games does not transfer to general cognitive ability"
  - keyword: "no dementia prevention evidence"
    variants: ["FTC settlement", "did not have the science", "$2 million"]
    functional_descriptions:
      - "Regulators found the cognitive-decline/dementia claims unsupported"
common_errors:
  - accepting a true-but-narrow effect as broad benefit
  - missing the far-transfer gap
  - treating training gains as dementia prevention
expected_failure_modes:
  - overclaim_read_as_solid
  - narrow_to_broad_generalization
discriminative_dimensions:
  - correctness
  - insight_depth
diagnostic_focus: "Can the agent see that generalizing a narrow trained-task effect to broad benefit and disease prevention is overclaim, not solid?"
origin: curated
