  boundary: "solid <-> overclaim"
  gold_status: frozen_pre_model
  difficulty_tier: D2
  difficulty_rationale: |
    One primary (overclaim) with a plausible alternate (solid, invited by the real trained-task
    effect); the fidelity check (far transfer? disease prevention?) decides. Moderate claim-evidence
    distance; low evidence-tier conflict. Property-based tagging.
  precedence_rationale: |
    No specific-label trigger applies (training studies are experimental -> not correlation_vs_causation;
    no animal/mechanism pathway -> not mechanism_vs_evidence). The failure is generic: a narrow true
    effect generalized to broad benefit and disease prevention = overclaim vs the tempting solid.
  ambiguity_note: |
    Determinate: overclaim is the single defensible primary; solid is tempting only because a narrow
    trained-task effect is real.
  steelman_challenge: |
    Strongest case the gold is wrong: people really do improve at the trained games, so a reviewer
    might call it solid. Counter-evidence weighed: the claim generalizes to everyday intelligence and
    dementia prevention, which lacks far-transfer evidence and was FTC-sanctioned; the framing exceeds
    the evidence. Resolution: gold remains overclaim.
