  boundary: "overclaim <-> correlation_vs_causation"
  gold_status: frozen_pre_model
  difficulty_tier: D3
  difficulty_rationale: |
    >=2 plausible labels (overclaim vs correlation_vs_causation); resolving it requires seeing that
    the cigarette equivalence is a long-term-average premature-death-RISK heuristic being misapplied
    to acute exposure and total smoking harm, and knowing that IARC already established air-pollution
    causation (so correlation is a real but defeated attractor). Property-based, no model performance.
  precedence_rationale: |
    overclaim is the generic/residual label (magnitude / risk-metric inflation). correlation_vs_
    causation outranks it ONLY if a causal claim is drawn from a non-causal/confounded design. Here
    causation is the ESTABLISHED IARC judgment (Group 1, 2013) with mechanistic support, not an
    inference from a confounded design, so the specific trigger is absent and the primary stays
    overclaim (docs/taxonomy_precedence.md rule 2).
  ambiguity_note: |
    Difficult but not indeterminate: only overclaim is defensible as primary; correlation_vs_causation
    is a documented-but-rejected alternative because the causal step is established, not the disputed
    one.
  steelman_challenge: |
    Strongest case the gold is wrong: air-pollution mortality estimates come from observational
    epidemiology, so a reviewer could call the whole claim correlation_vs_causation. Counter-evidence
    weighed: IARC classified outdoor air pollution and PM as Group 1 carcinogens (causation
    established) and the cardiorespiratory-mortality link is mechanistically supported, so asserting
    harm is correct, not a causal fallacy; the only thing exceeding the evidence is the per-day,
    total-harm smoking equivalence (magnitude / risk-metric misapplication). No material evidence
    supports correlation_vs_causation as the CENTRAL failure. Resolution: gold remains overclaim.
