id: P7A-BND-017
title: "Boundary: 'breathing Delhi's air is like smoking 44 cigarettes a day' (risk-metric magnitude overreach)"
domain: study_forensics
difficulty: hard
task_type: study_forensics
task_family: overclaim
trap_type: risk_metric_magnitude_conflation
ambiguity_level: medium
prompt: |
  A widely shared article warns: "Breathing the air in Delhi is like smoking 44 cigarettes a day. Just going outside is as deadly as a pack-a-day smoking habit — every day you spend in the city is literally smoking your lungs away."

  The "44 cigarettes" figure comes from Berkeley Earth's cigarette-equivalence rule of thumb, in which a long-term average fine-particulate (PM2.5) exposure of about 22 micrograms per cubic metre carries roughly the same long-term premature-death risk as smoking one cigarette a day; at a peak PM2.5 of ~950-1,000 that scales to about 44 cigarettes/day. Outdoor air pollution and particulate matter are classified by the International Agency for Research on Cancer (IARC) as Group 1 carcinogens (2013), and air pollution's causal contribution to cardiovascular and respiratory mortality is well established. But the Berkeley Earth equivalence is explicitly a LONG-TERM, population-average premature-mortality-RISK conversion, not a literal statement that one day of city air equals the total harm of a 44-cigarette-a-day habit (which also carries decades of addiction, tar, and dose).
context: |
  Evidence tier: an authoritative carcinogen classification (IARC Group 1) plus a published risk-
  equivalence heuristic (Berkeley Earth). Causation is ESTABLISHED (air pollution causes cancer and
  cardiovascular/respiratory death), so this is not a causal-inference error. The public claim's
  defect is taking a long-term, population-average premature-death-RISK conversion and inflating it
  into a literal per-day, total-harm equivalence with a pack-a-day smoking habit - a magnitude /
  risk-metric-misapplication overreach, not a causal claim from a non-causal design.
reference_solution: |
  Berkeley Earth's cigarette equivalence is a long-term, population-average premature-death-RISK
  heuristic (≈22 µg/m3 PM2.5 ≈ one cigarette/day), and IARC classifies outdoor air pollution as a
  Group 1 carcinogen, so the causal link is established. The claim overreaches by (a) applying an
  annual-average RISK conversion to a single day's exposure, (b) equating that risk with the TOTAL
  harm of an actual 44-cigarette-a-day habit (decades of addiction, tar, far larger cumulative dose),
  and (c) certainty/absolutism ("literally smoking your lungs away"). This is magnitude / risk-metric
  overreach of a real, established hazard = overclaim. It is not correlation_vs_causation: air
  pollution's causal role is established (IARC Group 1), so the claim does not misinfer causation from
  a non-causal design; the defect is inflating the size/framing of a real risk.
gold_label: overclaim
gold_confidence: high
gold_case_type: clear
gold_justification: |
  1. What the claim asserts: breathing Delhi's air for a day is "like smoking 44 cigarettes," "as
     deadly as a pack-a-day habit," and is "literally smoking your lungs away" - a literal per-day,
     total-harm equivalence with heavy smoking.
  2. What the evidence establishes: a Berkeley Earth heuristic converting LONG-TERM AVERAGE PM2.5 to
     an equivalent long-term premature-death RISK (≈22 µg/m3 ≈ 1 cigarette/day), and IARC's Group 1
     classification (causation established) - i.e., a real, established hazard with a bounded
     risk-equivalence metric.
  3. Mismatch: an annual-average premature-death-RISK conversion is inflated into a literal per-day,
     total-harm equivalence with an actual smoking habit, with absolutist framing.
  4. Frozen label triggered: overclaim - the framing exceeds what the metric supports (magnitude /
     risk-metric-misapplication inflation), the generic/residual failure.
  5. Why correlation_vs_causation is tempting: air-pollution health effects are studied through
     observational epidemiology, the surface most associated with the correlation/causation boundary.
  6. Why precedence rejects it as primary: correlation_vs_causation requires a causal claim drawn
     from a NON-CAUSAL / confounded design. Here causation is exactly what IARC judged ESTABLISHED
     (Group 1, 2013) and is mechanistically supported; the claim does not misinfer causation from an
     uncontrolled design. The specific trigger is absent, so under docs/taxonomy_precedence.md the
     primary stays the generic overclaim.
  7. What would change the classification: had the article inferred "the smog gave me cancer" from a
     single confounded correlation while ignoring the established causal evidence, correlation_vs_
     causation could be present; had it said "long-term exposure to this PM2.5 carries a premature-
     death risk comparable to light smoking," it would be solid.
gold_alternative_reading: |
  Alternative: correlation_vs_causation. Plausible because air-pollution health effects are studied
  through observational epidemiology, and readers often attack such claims on causal-inference
  grounds. It loses under precedence because the causal relationship is not the disputed step - IARC
  classified outdoor air pollution as a Group 1 carcinogen (causation established) and the
  cardiorespiratory-mortality link is mechanistically supported. Nothing in the claim infers
  causation from a non-causal design; the defect is magnitude / risk-metric inflation. A
  causal-inference critique would misdiagnose the failure.
gold_summary: |
  An article turns Berkeley Earth's LONG-TERM-average PM2.5-to-cigarette RISK heuristic and IARC's
  Group 1 classification of air pollution into "one day in Delhi = smoking 44 cigarettes / as deadly
  as a pack-a-day habit." Causation is established, so this is not correlation_vs_causation; the
  defect is inflating a long-term risk metric into a literal per-day total-harm equivalence =
  overclaim.
curator_notes: |
  Boundary family B1 (overclaim <-> correlation_vs_causation), overclaim direction. Independent
  replacement for retired P7A-BND-003; supersedes it. Genuine B1 tension: air-pollution epidemiology
  is observational, so correlation_vs_causation is a real attractor, but IARC Group 1 (2013)
  establishes causation, so it loses and overclaim (magnitude / risk-metric misapplication) is
  primary. Shares the established-causation-plus-magnitude architecture with P7A-BND-001 but is a
  DISTINCT proposition: different agent (ambient PM2.5 vs processed meat), different evidence (IARC
  air-pollution monograph + Berkeley Earth PM2.5->cigarette risk conversion vs the IARC meat
  monograph), and a different forensic error (misapplying a long-term-average RISK metric to acute
  exposure and to total smoking harm, vs 001's hazard-category-vs-risk-magnitude conflation). Sourced
  from the widely reported Berkeley Earth cigarette-equivalence claim. Gold frozen before any model
  output.
expected_findings:
  - finding: magnitude_inflation
    severity: major
    confidence: high
    note: "'One day = 44 cigarettes / a pack-a-day habit' inflates a long-term-average risk conversion into a literal per-day, total-harm equivalence"
  - finding: risk_metric_misapplication
    severity: major
    confidence: high
    note: "Berkeley Earth's equivalence is a long-term, population-average premature-death-RISK heuristic, not a per-day total-harm equivalence"
  - finding: certainty_absolutism
    severity: moderate
    confidence: medium
    note: "'Literally smoking your lungs away' overstates the framing of a real but probabilistic risk"
gold_evidence_spans:
  - span: "Just going outside is as deadly as a pack-a-day smoking habit"
    why_it_matters: "Equates a long-term-average risk conversion with the total harm of an actual smoking habit - the core magnitude overreach."
    supports_finding: magnitude_inflation
  - span: "a long-term average fine-particulate (PM2.5) exposure of about 22 micrograms per cubic metre carries roughly the same long-term premature-death risk as smoking one cigarette a day"
    why_it_matters: "States the metric's actual meaning (long-term average premature-death risk), which the claim misapplies."
    supports_finding: risk_metric_misapplication
