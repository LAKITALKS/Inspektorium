    variants: ["long-term average", "premature-death risk", "not per-day total harm"]
    functional_descriptions:
      - "The cigarette equivalence is a long-term average premature-death-risk heuristic, not a per-day total-harm equivalence"
  - keyword: "causation established"
    variants: ["IARC Group 1", "air pollution carcinogen", "not a causal-inference error"]
    functional_descriptions:
      - "IARC established air pollution as a Group 1 carcinogen, so causation is not the disputed step"
common_errors:
  - reading an air-pollution health claim as automatically correlation_vs_causation
  - accepting a long-term-average risk conversion as a literal per-day equivalence
  - missing that IARC already judged air-pollution causation established
expected_failure_modes:
  - overclaim_to_over_specific
  - risk_metric_conflation
discriminative_dimensions:
  - correctness
  - insight_depth
diagnostic_focus: "Can the agent see that a magnitude-inflated equivalence built on an established causal hazard is overclaim, not a causal-inference error?"
