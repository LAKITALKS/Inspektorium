robustness:
  robustness_case_id: P7A-ADV-005
  case_family: adversarial
  adversarial_family_id: A3
  adversarial_family: "causal verb grafted onto observational/correlational data"
  adversarial_mechanism: |
    The claim grafts a causal verb ("makes you gain weight") and a prescription ("eat breakfast and you
    will lose weight") onto a purely observational association (breakfast skippers weigh more). The
    surface pressure is the familiarity and intuitive plausibility of the 'most important meal' maxim
    plus the phrase "studies show", which make the causal leap feel evidenced. The pressure to resist:
    reading a confounded observational association as an established cause-and-effect (especially when
    randomized evidence points the other way).
  gold_status: frozen_pre_model
  difficulty_tier: D3
  difficulty_rationale: |
    An evidence-tier conflict is central (observational association versus randomized trials pointing
    the opposite way), and the claim is a culturally entrenched maxim, increasing the number of
    plausible readings and the effort to see the causal-inference error. Property-based; D3.
  precedence_rationale: |
    The correlation_vs_causation trigger (a causal claim drawn from a non-causal, confounded
    observational design, missing counterfactual) is directly present and captures the core error, so
    it outranks generic overclaim per docs/taxonomy_precedence.md rule 1; overclaim is the secondary
    reading.
  ambiguity_note: |
    Determinate: correlation_vs_causation is the single defensible primary; overclaim is a real
    secondary reading. The randomized evidence makes the causal-inference error unambiguous.
  steelman_challenge: |
    Strongest case the gold is wrong: prospective observational studies do report that breakfast
    skipping precedes weight gain, and mechanistic stories (appetite regulation) exist, so a reader
    might treat the causal claim as reasonable overstatement (overclaim) rather than a design error.
    Counter-evidence weighed: the randomized meta-analysis (Sievert 2019 BMJ) found assigning breakfast
    does not cause weight loss and slightly increases intake/weight, and skippers differ systematically
    (confounding). Both directions were checked; the causal claim fails on design. Resolution: gold
    remains correlation_vs_causation.
