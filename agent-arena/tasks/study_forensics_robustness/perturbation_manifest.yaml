five_perturbation_families:
- id: P1
  family: claim paraphrase
  invariance: true
  allowed_transformation: Re-express the same scientific proposition in different wording/syntax.
  forbidden_semantic_changes: May not change population, comparator, endpoint, magnitude, causal/mechanistic/clinical-benefit force, certainty, temporal scope, superiority, evidence tier, or scientific meaning; may not repair or introduce a defect.
  certification_criteria: The decisive proposition and every §12 dimension are materially unchanged; only surface wording differs.
- id: P2
  family: hedging variation (neutral)
  invariance: true
  allowed_transformation: Add/adjust a superficial (attributional/discourse) hedge in how the claim is framed.
  forbidden_semantic_changes: The superficial hedge may not change the substantive proposition or its force; specifically it may not soften an overclaim, weaken a causal/mechanistic claim, downgrade certainty, or otherwise repair the original defect (a hedge that materially weakens the claim is INVALID, §13).
  certification_criteria: The asserted force/certainty and all §12 dimensions are unchanged; the hedge is packaging only.
- id: P3
  family: order (claim/evidence context)
  invariance: true
  allowed_transformation: 'Reorder sentences / evidence items (here: present the evidence/context before the claim) while preserving semantic content.'
  forbidden_semantic_changes: May not add, drop, or edit any claim or evidence content; only sequence changes.
  certification_criteria: The perturbed prompt is a pure reordering of the base content; no decisive term added/removed.
- id: P4
  family: distractor context
  invariance: true
  allowed_transformation: Add irrelevant-but-plausible material that does not bear on the claim.
  forbidden_semantic_changes: The added material may not bear on the claim, add or alter scientific evidence, or change any §12 dimension (no new comparator/endpoint/evidence, §23).
  certification_criteria: The claim and its evidence set are unchanged; the added text is demonstrably irrelevant to the forensic judgment.
- id: P5
  family: formatting
  invariance: true
  allowed_transformation: Re-render the same content in a different format (prose <-> bullets, section ordering, metadata/label placement).
  forbidden_semantic_changes: May not add, drop, or alter any claim, evidence item, or decisive term; format only.
  certification_criteria: Every claim and evidence item is preserved; only presentation/format differs.
