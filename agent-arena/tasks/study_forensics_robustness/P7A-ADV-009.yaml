robustness:
  robustness_case_id: P7A-ADV-009
  case_family: adversarial
  adversarial_family_id: A5
  adversarial_family: "surrogate endpoint -> clinical benefit (Shape B)"
  adversarial_mechanism: |
    A human surrogate endpoint (amyloid-beta plaque reduction on imaging) is framed as an established
    clinical outcome (treating Alzheimer's), dressed in mechanistic amyloid-hypothesis language and an
    FDA accelerated approval. The surface pressure is that clearing "a defining pathology" sounds
    mechanistic and evidence-backed, pulling toward mechanism_vs_evidence or solid. The pressure to
    resist: mistaking a surrogate-to-clinical gap (Shape B) for demonstrated clinical benefit, or
    routing it to mechanism_vs_evidence when the taxonomy routes Shape B to overclaim.
  gold_status: frozen_pre_model
  difficulty_tier: D3
  difficulty_rationale: |
    Two plausible failure modes compete (mechanism_vs_evidence via the amyloid mechanism vs overclaim
    via Shape B), an FDA approval creates evidence-tier tension (approved yet clinical benefit
    unproven), and the precedence routing (Shape B -> overclaim) is subtle. Property-based; D3.
  precedence_rationale: |
    Amyloid-plaque reduction is a human SURROGATE endpoint framed as clinical benefit. The taxonomy
    (study_forensics_taxonomy.md; docs/taxonomy_precedence.md) explicitly excludes the
    surrogate/biomarker-to-clinical gap (Shape B) from mechanism_vs_evidence and routes surrogate
    endpoints framed as clinical outcomes to overclaim. No animal-preclinical-mechanism-to-human leap is
    present, so mechanism_vs_evidence is a documented but rejected alternative and overclaim is primary.
  ambiguity_note: |
    Determinate: overclaim is the single defensible primary under the frozen Shape-B routing rule;
    mechanism_vs_evidence is the strongest but rejected alternative (excluded by taxonomy).
  steelman_challenge: |
    Strongest case the gold is wrong: aducanumab genuinely engages the amyloid hypothesis and one phase
    3 trial (EMERGE) suggested a possible high-dose signal, and the FDA did approve it - so a reader
    might call it solid or route the amyloid mechanism to mechanism_vs_evidence. Counter-evidence
    weighed: both phase 3 trials were halted for futility with conflicting cognition results, the
    advisory committee voted against approval, approval rested on the amyloid SURROGATE, and the drug was
    withdrawn; the taxonomy routes Shape B to overclaim. Resolution: gold remains overclaim.
