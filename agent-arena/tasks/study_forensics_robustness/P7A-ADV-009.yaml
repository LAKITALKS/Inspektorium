id: P7A-ADV-009
title: "Adversarial A5: aducanumab (Aduhelm) 'reduces amyloid plaques, so treats Alzheimer's' (surrogate endpoint framed as clinical benefit - Shape B)"
domain: study_forensics
difficulty: hard
task_type: study_forensics
task_family: overclaim
trap_type: surrogate_endpoint_as_clinical_benefit
ambiguity_level: low
prompt: |
  Marketing for the Alzheimer's drug aducanumab (Aduhelm) states: "Aduhelm is the first treatment to address a defining pathology of Alzheimer's disease by clearing the amyloid-beta plaques that build up in the brain — a breakthrough that treats Alzheimer's."

  Aducanumab received FDA accelerated approval (June 2021) on the basis of a SURROGATE endpoint — reduction of amyloid-beta plaques on brain imaging — which the FDA judged "reasonably likely" to predict clinical benefit. It did not rest on established clinical benefit: the two phase 3 trials (EMERGE and ENGAGE) were halted for futility and gave conflicting results on cognition, the FDA advisory committee voted overwhelmingly against approval, and no clear cognitive benefit was demonstrated. Biogen withdrew the drug from the market in early 2024.
context: |
  Evidence tier: an FDA accelerated approval on a surrogate biomarker (amyloid PET) whose link to
  clinical benefit was unproven, against conflicting/futility-halted phase 3 cognition trials. The claim
  frames a surrogate (amyloid-plaque reduction) as an established clinical outcome ("treats
  Alzheimer's"). Per the taxonomy, a surrogate endpoint framed as clinical benefit (Shape B) routes to
  overclaim, not mechanism_vs_evidence, even when dressed in mechanistic (amyloid-hypothesis) language.
expected_answer: "overclaim"
reference_solution: |
  Aducanumab clears amyloid plaques (a surrogate biomarker), and the marketing frames that as treating
  Alzheimer's. But amyloid reduction is a surrogate whose clinical benefit was not established: the
  phase 3 trials were halted for futility with conflicting cognition results, the advisory committee
  voted against approval, and the drug was later withdrawn. A surrogate endpoint framed as clinical
  benefit is overclaim (Shape B, routed to overclaim by the taxonomy). It is not mechanism_vs_evidence:
  Shape B (biomarker-to-clinical gap) is explicitly excluded from that category.
gold_label: overclaim
gold_confidence: high
gold_case_type: clear
gold_justification: |
  1. Exact proposition: Aduhelm treats Alzheimer's disease by clearing amyloid-beta plaques.
  2. What the strongest evidence establishes: the drug reduces amyloid plaques (a surrogate on imaging);
     clinical (cognitive) benefit was not established - phase 3 trials halted for futility with
     conflicting results, advisory committee against, later market withdrawal.
  3. Adversarial surface feature: the amyloid hypothesis and an FDA approval make "clears a defining
     pathology" sound like a mechanistic, evidence-backed cure.
  4. Actual forensic mismatch: clearing amyloid is a surrogate; it is framed as the clinical outcome
     (treating the disease), which was not demonstrated.
  5. Primary frozen label: overclaim - a surrogate endpoint framed as clinical benefit (Shape B).
  6. Why precedence routes here: the taxonomy explicitly EXCLUDES the biomarker/surrogate-to-clinical
     gap (Shape B) from mechanism_vs_evidence and routes it to overclaim (docs/taxonomy_precedence.md;
     study_forensics_taxonomy.md).
  7. Strongest competing label: mechanism_vs_evidence - amyloid clearance is a biological "mechanism",
     tempting that category.
  8. Why it loses: no animal/preclinical-mechanism-to-human leap is the structure; the defect is a
     human surrogate (amyloid PET) framed as a clinical outcome, which is Shape B -> overclaim, not
     mechanism_vs_evidence.
  9. What would change the verdict: trials showing a clear cognitive/functional benefit would make the
     claim solid; if the basis were an animal mechanism extrapolated to humans it would be
     mechanism_vs_evidence.
gold_alternative_reading: |
  Alternative: mechanism_vs_evidence. Plausible because amyloid clearance is a described biological
  mechanism, so a reviewer might route it there. It loses because the taxonomy explicitly excludes the
  surrogate/biomarker-to-clinical gap (Shape B) from mechanism_vs_evidence and routes surrogate
  endpoints framed as clinical outcomes to overclaim; the defect here is a human surrogate (amyloid PET)
  sold as clinical benefit, not an animal-mechanism-to-human leap.
gold_summary: |
  Aduhelm clears amyloid plaques (a surrogate) and is marketed as treating Alzheimer's, but clinical
  benefit was not established (futility-halted phase 3, advisory committee against, later withdrawn). A
  surrogate framed as clinical benefit (Shape B) = overclaim (mechanism_vs_evidence is the excluded
  competitor).
curator_notes: |
  Adversarial family A5 (surrogate endpoint -> clinical benefit, 'Shape B'; positive control that
  Shape-B routing to overclaim holds under mechanistic dressing). Real public claim: Biogen's Aduhelm
  amyloid-clearance marketing; FDA accelerated approval on the amyloid surrogate. Distinct from A5
  antibacterial soap (P7A-ADV-010) and from Boundary Shape-B cases (Avastin 015, ginkgo 016, calcium+D
  018). Gold frozen before any model output.
