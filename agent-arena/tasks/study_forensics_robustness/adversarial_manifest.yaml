# --- Frozen adversarial families (A1-A8) --------------------------------------
# Exact repository-derived definitions (case_and_perturbation_contract §4 / robustness_design §4):
families:
  - id: A1
    trigger: "decorative citation (citation present, does not support the claim)"
    gold_logic: "overclaim (rhetorical inflation; citation is decoration)"
  - id: A2
    trigger: "citation supports mechanism but not outcome"
    gold_logic: "per precedence: mechanism_vs_evidence if a biological mechanism is described and used to imply human benefit; else overclaim"
  - id: A3
    trigger: "causal verb grafted onto observational/correlational data"
    gold_logic: "correlation_vs_causation (trigger present)"
  - id: A4
    trigger: "subgroup -> general-population generalization"
    gold_logic: "overclaim (extrapolation to unstudied population)"
  - id: A5
    trigger: "surrogate endpoint -> clinical benefit (Shape B)"
    gold_logic: "overclaim - positive control that taxonomy Shape-B routing holds under mechanistic dressing"
  - id: A6
    trigger: "unsupported superiority / benchmark cherry-picking / missing comparator"
    gold_logic: "overclaim"
  - id: A7
    trigger: "biologically plausible mechanism -> implied human efficacy"
    gold_logic: "mechanism_vs_evidence (trigger present)"
  - id: A8
    trigger: "numerically-correct value on wrong population / technically-true-but-misleading, hedges that do not repair"
    gold_logic: "overclaim"

