id: P7A-BND-008
title: "Boundary: 'vitamin C prevents colds' (claim contradicted by human RCT evidence)"
domain: study_forensics
difficulty: medium
task_type: study_forensics
task_family: overclaim
trap_type: claim_exceeds_human_evidence
ambiguity_level: medium
prompt: |
  A marketing page claims: "Take vitamin C every day to boost your immunity and prevent colds — it stops you getting sick."

  The best available human evidence is a Cochrane systematic review (Hemila & Chalker, 2013) pooling randomized trials. In the general population, regular vitamin C supplementation had NO effect on the INCIDENCE of the common cold (29 trial comparisons, 11,306 participants). It did modestly reduce the DURATION of colds — by about 8% in adults and 14% in children — when taken regularly, but taking vitamin C only after symptoms began showed no consistent benefit. (A protective effect on cold incidence appeared only in a small subgroup under extreme physical stress, e.g. marathon runners and soldiers.)
context: |
  Evidence tier: Cochrane systematic review of randomized controlled trials — the strongest human
  evidence. It directly contradicts the prevention claim (no effect on cold incidence in the general
  population) and supports only a modest duration reduction. The claim's error is asserting
  prevention that the human trials do not support = overclaim. mechanism_vs_evidence does not apply
  because the case is not a mechanism-only extrapolation — direct human RCT evidence exists (and is
  contradicted).
expected_answer: "overclaim"
reference_solution: |
  Randomized human trials (Cochrane) show regular vitamin C does NOT prevent colds in the general
  population; it only modestly shortens duration. The claim ("prevent colds ... stops you getting
  sick") asserts a benefit the human evidence contradicts = overclaim (claim exceeds evidence). This
  is not mechanism_vs_evidence: that label is for a described animal/preclinical pathway used to
  imply UNDEMONSTRATED human benefit; here the human benefit HAS been tested directly (in RCTs) and
  found absent for prevention, so the failure is inflation against existing human data, not a
  mechanism-to-human leap.
gold_label: overclaim
gold_confidence: high
gold_case_type: clear
gold_justification: |
  1. What the claim asserts: daily vitamin C prevents colds and "stops you getting sick" (an immune
     prevention claim).
  2. What the evidence establishes: in RCTs (Cochrane), regular vitamin C has no effect on cold
     incidence in the general population; it modestly reduces duration (~8% adults, ~14% children).
  3. Mismatch: the prevention claim is directly contradicted by randomized human evidence.
  4. Frozen label triggered: overclaim — the claim's framing exceeds (indeed contradicts) the human
     evidence; generic rhetorical inflation.
  5. Why mechanism_vs_evidence is tempting: vitamin C carries an antioxidant/immune "mechanism"
     narrative, so a reviewer may reach for that specific label.
  6. Why precedence rejects it as primary: mechanism_vs_evidence applies when a described animal/
     preclinical PATHWAY is used to imply a human benefit that has NOT been demonstrated. Here the
     human benefit has been tested head-on in RCTs (and prevention is absent); the failure is
     inflation against existing human data, not a mechanism-to-human extrapolation. Primary stays
     overclaim (docs/taxonomy_precedence.md rule 2).
  7. What would change the classification: if the claim rested on a described immune-pathway animal
     study to promise human protection with no human trials, mechanism_vs_evidence could apply; if it
     accurately reported "may slightly shorten colds but does not prevent them," it would be solid.
gold_alternative_reading: |
  Alternative: mechanism_vs_evidence. Plausible via the antioxidant/immune mechanism narrative. It
  loses under precedence because direct human RCT evidence exists and contradicts the prevention
  claim; there is no mechanism-to-human extrapolation gap to adjudicate — the defect is inflation
  against human data = overclaim.
gold_summary: |
  A page says daily vitamin C "prevents colds." Cochrane RCT evidence shows no effect on cold
  incidence in the general population, only modest duration reduction. Claim contradicts human
  evidence = overclaim; not mechanism_vs_evidence because the human benefit was tested directly.
curator_notes: |
  Boundary family B2 (overclaim <-> mechanism_vs_evidence), overclaim direction. Sourced from the
  Cochrane vitamin C / common cold review (Hemila & Chalker 2013). Chosen because human RCT evidence
  exists and is contradicted, which cleanly defeats the mechanism_vs_evidence reading (no
  mechanism-to-human gap). Independent proposition (Class-A has no vitamin C / cold case). Gold
  frozen before any model output.
expected_findings:
  - finding: claim_contradicted_by_rct
    severity: major
    confidence: high
    note: "RCT evidence shows no prevention of colds in the general population"
  - finding: conclusion_exceeds_results
    severity: major
    confidence: high
    note: "'Prevent colds / stops you getting sick' inflates a modest duration effect into prevention"
  - finding: human_evidence_present
    severity: moderate
    confidence: high
    note: "Direct human RCTs exist, so mechanism_vs_evidence (a mechanism-to-human leap) does not apply"
gold_evidence_spans:
  - span: "prevent colds - it stops you getting sick"
    why_it_matters: "Prevention claim directly contradicted by randomized human evidence."
    supports_finding: claim_contradicted_by_rct
  - span: "NO effect on the INCIDENCE of the common cold"
    why_it_matters: "The RCT finding that defeats the prevention claim and rules out a mechanism-gap reading."
    supports_finding: human_evidence_present
evaluation:
  method: auto
  answer_match: contains
key_insights:
  - keyword: "no effect on incidence"
    variants: ["does not prevent", "duration only", "Cochrane RCT"]
    functional_descriptions:
      - "Regular vitamin C does not reduce cold incidence in the general population"
  - keyword: "human evidence exists"
    variants: ["RCT tested directly", "not a mechanism leap", "contradicted"]
    functional_descriptions:
      - "Direct human trials rule out a mechanism-to-human extrapolation reading"
common_errors:
  - labelling an antioxidant/immune claim mechanism_vs_evidence
  - accepting 'prevents colds' as evidence-based
  - conflating duration reduction with prevention
expected_failure_modes:
  - overclaim_to_over_specific
  - mechanism_narrative_despite_human_rct
discriminative_dimensions:
  - correctness
  - insight_depth
diagnostic_focus: "Can the agent classify a claim contradicted by human RCTs as overclaim rather than a mechanism-to-human leap?"
