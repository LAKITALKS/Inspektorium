robustness:
  robustness_case_id: P7A-BND-008
  case_family: boundary
  boundary_family_id: B2
  boundary: "overclaim <-> mechanism_vs_evidence"
  gold_status: frozen_pre_model
  difficulty_tier: D2
  difficulty_rationale: |
    One primary (overclaim) plus one plausible alternate (mechanism_vs_evidence, invited by the
    antioxidant/immune narrative); precedence decides. Low evidence-tier conflict — Cochrane RCT
    evidence is clear. Property-based tagging.
  precedence_rationale: |
    mechanism_vs_evidence is for a described animal/preclinical pathway implying an undemonstrated
    human benefit. Here human RCT evidence exists and contradicts the prevention claim, so there is
    no mechanism-to-human gap; the failure is inflation against human data = overclaim
    (docs/taxonomy_precedence.md rule 2).
  ambiguity_note: |
    Determinate: overclaim is the single defensible primary; the mechanism narrative is tempting but
    the direct human RCT evidence removes any mechanism-gap reading.
  steelman_challenge: |
    Strongest case the gold is wrong: vitamin C has real immune/antioxidant biology, so one might
    read a mechanism-to-human leap. Counter-evidence weighed: the human benefit was tested directly
    in RCTs and prevention is absent; mechanism_vs_evidence requires an UNDEMONSTRATED human benefit
    extrapolated from a pathway, which is not the situation. Resolution: gold remains overclaim.
