id: P7A-BND-005
title: "Boundary: 'get a dog to live longer' (dog ownership and mortality, unadjusted confounding)"
domain: study_forensics
task_type: study_forensics
difficulty: medium
task_family: correlation_vs_causation
trap_type: confounded_causal_claim
ambiguity_level: low
prompt: |
  A news article reports: "Owning a dog reduces your risk of death by 24% — so if you want to live longer, get a dog. The science proves that dogs make their owners healthier."

  The source is a 2019 systematic review and meta-analysis (Kramer et al., Circulation: Cardiovascular Quality and Outcomes) of 10 observational studies covering more than 3.8 million people (mean follow-up ~10 years). Dog ownership was associated with a 24% lower relative risk of all-cause mortality (and a 31% lower risk of cardiovascular death). The authors explicitly caution: "these non-randomized studies cannot 'prove' that adopting or owning a dog directly leads to reduced mortality," and note that their analyses "did not account for confounders such as better fitness or an overall healthier lifestyle that could be associated with dog ownership."
context: |
  Evidence tier: meta-analysis of observational (non-randomized) cohort studies. Dog owners differ
  systematically from non-owners (more physical activity, wealth, fewer disabilities), and the
  authors state these confounders were not adjusted for. The public claim converts the confounded
  association into a causal, prescriptive recommendation ("get a dog to live longer / dogs make
  owners healthier"). The correlation_vs_causation trigger is central.
expected_answer: "correlation_vs_causation"
reference_solution: |
  The article draws a causal, prescriptive conclusion ("get a dog to live longer," "dogs make their
  owners healthier," "the science proves") from a meta-analysis of NON-RANDOMIZED studies whose own
  authors say cannot prove causation and did not adjust for lifestyle confounders. The central defect
  is causal inference from a confounded observational design — correlation_vs_causation — with a
  behavioural recommendation attached. An overclaim reading ("proves") coexists but is secondary; the
  structural causal error is the core failure.
gold_label: correlation_vs_causation
gold_confidence: high
gold_case_type: clear
gold_justification: |
  1. What the claim asserts: a causal, prescriptive conclusion — owning a dog reduces your risk of
     death, so get a dog to live longer; dogs make owners healthier; "the science proves" it.
  2. What the evidence establishes: an observational association (24% lower all-cause mortality, 31%
     lower CV death) from non-randomized studies whose authors state causation is not proven and that
     lifestyle confounders (fitness, healthier living, wealth) were not adjusted for.
  3. Mismatch: a confounded association is treated as an established causal effect and turned into a
     recommendation to acquire a dog.
  4. Frozen label triggered: correlation_vs_causation — a causal claim (with behaviour advice) from a
     non-causal, confounded design; the specific trigger is present and central.
  5. Why overclaim is tempting: "the science proves" and "dogs make owners healthier" are also
     rhetorical inflation, giving a generic overclaim reading.
  6. Why precedence keeps the specific label primary: the decisive failure is structural — causation
     inferred from a confounded observational design (self-selection into dog ownership), exactly the
     correlation_vs_causation trigger, which outranks generic overclaim when present and central
     (docs/taxonomy_precedence.md rule 1). overclaim is the secondary reading.
  7. What would change the classification: a randomized trial of dog adoption showing reduced
     mortality would support causation (solid); a purely descriptive statement ("dog owners tend to
     live longer") without the causal/prescriptive leap would not cross the boundary.
gold_alternative_reading: |
  Alternative: overclaim. Plausible because "the science proves" / "dogs make owners healthier"
  overstate certainty. It is secondary; it loses as PRIMARY because the central, structural defect is
  causal inference from a confounded, self-selected observational design — the correlation_vs_causation
  trigger — which captures the core error.
gold_summary: |
  A news article says "get a dog to live longer" from a meta-analysis of non-randomized studies whose
  authors state causation is unproven and confounders (fitness, lifestyle) were unadjusted. Causal,
  prescriptive claim from a confounded design = correlation_vs_causation (overclaim secondary).
curator_notes: |
  Boundary family B1 (overclaim <-> correlation_vs_causation), correlation_vs_causation direction —
  a second counter-directional anchor. Sourced from Kramer et al. 2019 (Circulation: Cardiovascular
  Quality and Outcomes); the authors' own no-causation/confounding caveat is decisive counter-context.
  Independent of the alcohol case (different exposure, design detail, and endpoint emphasis). Gold
  frozen before any model output.
expected_findings:
  - finding: correlation_as_causation
    severity: major
    confidence: high
    note: "Causal, prescriptive claim from non-randomized studies"
  - finding: unadjusted_confounding
    severity: major
    confidence: high
    note: "Authors state fitness/lifestyle confounders were not accounted for and causation is unproven"
  - finding: certainty_inflation
    severity: moderate
    confidence: medium
    note: "'The science proves' overstates observational evidence (secondary overclaim reading)"
gold_evidence_spans:
  - span: "if you want to live longer, get a dog"
    why_it_matters: "Behavioural recommendation built on a confounded association — the causal boundary crossing."
    supports_finding: correlation_as_causation
  - span: "The science proves that dogs make their owners healthier"
    why_it_matters: "Asserts proven causation the observational design cannot support (authors say so)."
    supports_finding: unadjusted_confounding
evaluation:
  method: auto
  answer_match: contains
key_insights:
  - keyword: "self-selection into ownership"
    variants: ["confounders", "healthier lifestyle", "fitness"]
    functional_descriptions:
      - "Dog owners differ systematically from non-owners; association is not a causal effect"
  - keyword: "authors' own caveat"
    variants: ["cannot prove", "non-randomized", "did not account for confounders"]
    functional_descriptions:
      - "The study team explicitly denies causation; the claim ignores this"
common_errors:
  - defaulting to overclaim because of the inflated 'proves' wording
  - accepting the 24% as a causal effect of dogs
  - ignoring self-selection confounding
expected_failure_modes:
  - specific_to_overclaim
  - missing_confounders
discriminative_dimensions:
  - correctness
  - insight_depth
diagnostic_focus: "Can the agent keep correlation_vs_causation primary for a confounded association turned into a prescriptive causal claim?"
