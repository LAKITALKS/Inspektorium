id: P7A-ADV-010
title: "Adversarial A5: antibacterial soap 'kills 99.9% of germs, so protects your family from illness' (germ-killing surrogate framed as clinical benefit - Shape B)"
domain: study_forensics
difficulty: hard
task_type: study_forensics
task_family: overclaim
trap_type: surrogate_endpoint_as_clinical_benefit
ambiguity_level: low
prompt: |
  An antibacterial hand soap is advertised: "Kills 99.9% of germs. Protect your family from illness and infection — switch to antibacterial soap for a healthier home."

  The "kills 99.9% of germs" figure refers to a laboratory measure of bacterial reduction. Whether that translates into fewer illnesses is a separate, clinical question. The US Food and Drug Administration issued a final rule (2016) banning 19 antibacterial wash ingredients (including triclosan and triclocarban) from consumer soaps, concluding that manufacturers had not demonstrated these ingredients are more effective than plain soap and water at preventing illness or reducing infection — and not shown to be safe for long-term daily use.
context: |
  Evidence tier: an FDA final rule assessing whether a laboratory surrogate (germ-killing) delivers a
  clinical outcome (fewer illnesses/infections). The claim frames the surrogate (kills 99.9% of germs)
  as the clinical benefit (protects your family from illness). The FDA found the surrogate was not shown
  to translate into illness prevention over plain soap. A surrogate endpoint framed as a clinical
  outcome (Shape B) routes to overclaim.
expected_answer: "overclaim"
reference_solution: |
  "Kills 99.9% of germs" is a laboratory surrogate; "protects your family from illness" is a clinical
  outcome. The FDA (2016) found antibacterial wash ingredients were not shown to be more effective than
  plain soap at preventing illness (and not shown safe for long-term use), and banned 19 of them. A
  surrogate (germ reduction) framed as a clinical benefit (illness prevention) is overclaim (Shape B). It
  is not mechanism_vs_evidence (no animal/preclinical mechanism is extrapolated to humans) or
  correlation_vs_causation (no observational-to-causal design error is central).
gold_label: overclaim
gold_confidence: high
gold_case_type: clear
gold_justification: |
  1. Exact proposition: antibacterial soap protects your family from illness and infection because it
     kills 99.9% of germs.
  2. What the strongest evidence establishes: the germ-killing figure is a laboratory surrogate; the
     FDA found no demonstration that these ingredients prevent illness better than plain soap, and
     banned 19 of them (also not shown safe long-term).
  3. Adversarial surface feature: a concrete, quantitative lab claim ("99.9%") reads as strong proof of
     the health benefit.
  4. Actual forensic mismatch: reducing bacteria in a lab test is a surrogate; it is framed as the
     clinical outcome (fewer illnesses), which was not demonstrated.
  5. Primary frozen label: overclaim - a surrogate endpoint framed as clinical benefit (Shape B).
  6. Why precedence routes here: the taxonomy routes surrogate-endpoints-framed-as-clinical-outcomes to
     overclaim; there is no mechanism-to-human leap and no observational-design error.
  7. Strongest competing label: solid - germs are real and the soap really does kill them, so the claim
     seems evidence-based.
  8. Why it loses: killing germs in vitro is not the same as preventing illness in people, which the
     FDA found unproven; the surrogate is framed as the clinical outcome = overclaim.
  9. What would change the verdict: trials showing antibacterial soap prevents illness better than plain
     soap would make the claim solid.
gold_alternative_reading: |
  Alternative: solid. Strongest good-faith version: the soap genuinely does kill ~99.9% of bacteria in
  lab tests, so the claim looks quantitatively evidenced. It loses because killing germs is a surrogate
  that the FDA found was not shown to translate into fewer illnesses over plain soap; framing the
  surrogate as the clinical benefit is overclaim.
gold_summary: |
  Antibacterial soap 'kills 99.9% of germs' (a lab surrogate) and is sold as protecting your family from
  illness; the FDA (2016) found no demonstrated illness-prevention benefit over plain soap and banned 19
  ingredients. Surrogate framed as clinical benefit (Shape B) = overclaim (solid tempting).
curator_notes: |
  Adversarial family A5 (surrogate endpoint -> clinical benefit, 'Shape B'). Real public claim: ubiquitous
  'kills 99.9% of germs / protects from illness' antibacterial-soap advertising. Evidence: FDA 2016 final
  rule. Distinct from A5 Aduhelm (P7A-ADV-009; pharma amyloid surrogate) - here the surrogate is
  laboratory germ-killing in a consumer product. Distinct from Boundary Shape-B cases. Gold frozen before
  any model output.
