robustness:
  robustness_case_id: P7A-ADV-010
  case_family: adversarial
  adversarial_family_id: A5
  adversarial_family: "surrogate endpoint -> clinical benefit (Shape B)"
  adversarial_mechanism: |
    A laboratory surrogate (kills 99.9% of germs) is framed as a clinical outcome (protects your family
    from illness). The surface pressure is the concrete, quantitative "99.9%" figure, which reads as
    strong, evidenced proof of the health benefit, and the surrogate is genuinely true in vitro. The
    pressure to resist: treating a surrogate germ-reduction measure as demonstrated illness prevention.
  gold_status: frozen_pre_model
  difficulty_tier: D2
  difficulty_rationale: |
    One primary (overclaim, Shape B) with one genuinely plausible alternate (solid, because the germ-kill
    surrogate is quantitatively real); recognising the surrogate-to-clinical gap decides it. A single
    dominant defect and a simple surrogate structure keep it at D2. Property-based.
  precedence_rationale: |
    "Kills 99.9% of germs" is a laboratory SURROGATE; "protects from illness" is the clinical outcome.
    The taxonomy routes surrogate-endpoints-framed-as-clinical-outcomes to overclaim, and there is no
    animal-preclinical-mechanism-to-human leap (rules out mechanism_vs_evidence) and no observational
    design read causally (rules out correlation_vs_causation). Primary stays overclaim.
  ambiguity_note: |
    Determinate: overclaim is the single defensible primary; solid is tempting only because the surrogate
    germ-killing is quantitatively real, but it is not the clinical outcome claimed.
  steelman_challenge: |
    Strongest case the gold is wrong: the "99.9%" germ-kill is a genuine, reproducible laboratory result,
    and reducing pathogens plausibly could reduce illness, so a reader might call the claim solid.
    Counter-evidence weighed: the FDA (2016) reviewed the evidence and found manufacturers had not shown
    these ingredients prevent illness better than plain soap (and not shown safe for long-term use),
    banning 19 of them; the germ-kill figure is a surrogate. Resolution: the surrogate framed as the
    clinical benefit is overclaim.
