id: P7A-ADV-017
title: "Adversarial A7: nattokinase 'a clot-dissolving enzyme, so it prevents heart attacks and strokes' (plausible fibrinolytic mechanism to implied human clinical outcome)"
domain: study_forensics
difficulty: hard
task_type: study_forensics
task_family: mechanism_vs_evidence
trap_type: mechanism_plausibility_to_human_efficacy
ambiguity_level: low
prompt: |
  A supplement is marketed: "Nattokinase is a natural clot-dissolving enzyme. It breaks down fibrin — the protein that forms dangerous blood clots — just like your body's own clot-busters. So take nattokinase daily to dissolve clots, keep your arteries clear, and prevent heart attacks and strokes."

  The fibrinolytic mechanism is real: nattokinase, an enzyme from fermented soybean (natto), was shown in 1987 to digest fibrin and dissolve a clot in vitro, and small human studies report short-term changes in fibrinolytic/coagulation markers (surrogates). However, no randomized trial has shown that nattokinase reduces heart attacks, strokes, cardiovascular death, or all-cause mortality; a systematic review of randomized trials found effects only on surrogate cardiovascular risk factors (e.g., blood pressure), with no clinical-outcome trials. The claimed human benefit — preventing heart attacks and strokes — has not been demonstrated.
context: |
  Evidence tier: a real, preclinically-demonstrated enzymatic mechanism (in-vitro fibrinolysis) plus
  small human surrogate-marker studies, used to imply a human clinical OUTCOME (preventing heart attacks
  and strokes) that has not been demonstrated in any outcome trial. The claim rests on the clot-dissolving
  mechanism, not on evidence that the supplement prevents cardiovascular events. A described biological
  mechanism used to imply an undemonstrated human clinical benefit is the mechanism_vs_evidence trigger
  (Shape C: preclinical pathway -> therapeutic promise).
expected_answer: "mechanism_vs_evidence"
reference_solution: |
  Nattokinase genuinely dissolves fibrin/clots in vitro (a real enzymatic mechanism) and shifts some
  human fibrinolytic markers (surrogates), and the claim extrapolates this to preventing heart attacks
  and strokes. No randomized trial shows nattokinase reduces those clinical events (a systematic review
  found only surrogate-risk-factor effects, no outcome trials). A preclinically-demonstrated mechanism
  used to imply an undemonstrated human clinical outcome is mechanism_vs_evidence (Shape C). Generic
  overclaim also fits, but the decisive structure is the mechanism-to-clinical-outcome leap; and it is
  not Shape-B overclaim, because the claim leans on the enzymatic clot-dissolving MECHANISM rather than
  selling a specific measured human biomarker as the outcome.
gold_label: mechanism_vs_evidence
gold_confidence: high
gold_case_type: clear
gold_justification: |
  1. Exact proposition: taking nattokinase daily dissolves clots and prevents heart attacks and strokes
     in people.
  2. What the strongest evidence establishes: nattokinase digests fibrin/dissolves clots in vitro (Sumi
     1987) and changes some human fibrinolytic markers (surrogates); no randomized trial shows it reduces
     heart attacks, strokes, cardiovascular death, or mortality (systematic review: surrogate risk
     factors only, no outcome trials).
  3. Adversarial surface feature: a specific, real, mechanistically-vivid action ("dissolves clots in a
     petri dish", "like your body's own clot-busters") makes the clinical benefit sound inevitable.
  4. Actual forensic mismatch: a preclinical/enzymatic mechanism (and human surrogate markers) is
     extrapolated to a human clinical outcome (preventing cardiovascular events) that has not been shown.
  5. Primary frozen label: mechanism_vs_evidence - a described (preclinical) biological mechanism used to
     imply an undemonstrated human clinical benefit (Shape C).
  6. Why precedence keeps it primary: the mechanism-to-clinical-outcome structure is genuinely present
     and central, so it outranks generic overclaim (docs/taxonomy_precedence.md rule 1). It is not
     routed to overclaim as Shape B, because the load-bearing move is the enzymatic clot-dissolving
     MECHANISM, not a specific measured human biomarker sold as the clinical outcome.
  7. Strongest competing label: overclaim - "prevent heart attacks and strokes" is inflated, and small
     human surrogate studies exist, so one might call it overstatement.
  8. Why it loses: unlike a case that exaggerates existing human OUTCOME data, there is NO human outcome
     evidence for the claimed benefit; the claim's basis is the mechanism, so the core error is the
     mechanism-to-clinical-outcome leap = mechanism_vs_evidence, with overclaim secondary.
  9. What would change the verdict: a randomized outcome trial showing nattokinase reduces heart attacks
     or strokes would support the claim; if the claim instead sold a specific measured human biomarker
     (e.g. "lowers your D-dimer, so you are protected") as the clinical benefit, it would route to
     overclaim (Shape B).
gold_alternative_reading: |
  Alternative: overclaim. Plausible because the marketing is inflated and small human surrogate-marker
  studies exist, so a reviewer could call it overstatement of weak human data. It loses as primary
  because there is no human outcome evidence for the claimed benefit (preventing heart attacks/strokes),
  and the load-bearing move is extrapolating the enzymatic clot-dissolving mechanism to that undemonstrated
  outcome - the mechanism_vs_evidence trigger (Shape C).
gold_summary: |
  A supplement says nattokinase 'dissolves clots' (a real in-vitro enzymatic mechanism) so it prevents
  heart attacks and strokes; no outcome trial shows that benefit (only surrogate-risk-factor effects). A
  preclinical mechanism extrapolated to an undemonstrated human clinical outcome = mechanism_vs_evidence
  (overclaim secondary).
curator_notes: |
  Adversarial family A7 (biologically plausible mechanism -> implied human efficacy). REPLACEMENT for the
  retired P7A-ADV-014 (psychobiotic), created in the WP-2 blocker-only gold review. Chosen because the
  claimed human CLINICAL OUTCOME (prevent heart attacks/strokes) has NO human outcome trials, so
  mechanism_vs_evidence is uniquely defensible (unlike probiotics-for-depression, where direct human
  RCTs on the claimed outcome exist and route it to overclaim). Mechanism verified: Sumi 1987 (Experientia,
  in-vitro fibrinolysis); clinical-evidence gap verified: systematic review/meta-analysis of RCTs found
  surrogate-risk-factor effects only, no outcome trials. Distinct from A7 red light (P7A-ADV-013;
  mitochondria/ATP) and from A2 metformin/spermidine (which foreground a specific outcome-citation).
  Independent of all Boundary/Class-A cases. Gold frozen before any model output.
