  adversarial_mechanism: |
    A genuine, vivid enzymatic mechanism (nattokinase digests fibrin and dissolves clots, shown in vitro
    since 1987, and shifts some human fibrinolytic markers) is extrapolated to a human clinical outcome
    (preventing heart attacks and strokes). The surface pressure is that the clot-dissolving action is
    real, specific, and intuitively linked to cardiovascular events, making the benefit sound inevitable.
    The pressure to resist: accepting a preclinically-demonstrated mechanism (plus human surrogate
    markers) as proof of an undemonstrated human clinical outcome.
  gold_status: frozen_pre_model
  difficulty_tier: D3
  difficulty_rationale: |
    An evidence-tier conflict is central: a real in-vitro mechanism and small human surrogate-marker
    studies exist, tempting a reviewer to call it overstatement of weak human data (overclaim) or to
    route it to Shape-B; separating the mechanism-to-clinical-outcome leap (with no outcome trial) from
    those readings requires care. Property-based; D3.
  precedence_rationale: |
    A described biological mechanism (fibrinolysis), demonstrated preclinically (in vitro) and used to
    imply an undemonstrated human clinical benefit (preventing cardiovascular events), is the
    mechanism_vs_evidence trigger (Shape C). It is present and central and outranks generic overclaim
    (docs/taxonomy_precedence.md rule 1). It is NOT Shape B: the claim leans on the enzymatic
    clot-dissolving MECHANISM rather than selling a specific measured human biomarker as the clinical
    outcome; and the human surrogate studies are on markers, not the claimed events, so they neither
    establish the claim (not solid) nor make the core error a biomarker-sold-as-outcome.
  ambiguity_note: |
    Determinate: mechanism_vs_evidence is the single defensible primary. overclaim is a real secondary
    reading; unlike a case exaggerating existing human OUTCOME data, there is no human outcome evidence
    for the claimed benefit, so the mechanism-to-outcome leap is the core error. Human surrogate-marker
    studies do not establish the claim (not solid).
  steelman_challenge: |
    Strongest case the gold is wrong: nattokinase has a real, well-characterized fibrinolytic mechanism,
    small human trials show it shifts fibrinolytic/coagulation markers and blood pressure, and a
    systematic review rated study quality high - so a reviewer might call the claim overstatement of real
    human data (overclaim) or borderline solid. Counter-evidence weighed: those human trials are on
    SURROGATE risk factors, not the claimed clinical events; no randomized trial shows nattokinase reduces
    heart attacks, strokes, cardiovascular death, or mortality; and the load-bearing basis of the claim is
    the enzymatic clot-dissolving mechanism, not the surrogates. Both directions checked. Resolution: the
    mechanism-to-clinical-outcome leap is the core error; gold remains mechanism_vs_evidence.
