  original_claim: 'A weight-loss product is marketed as follows: "Sprinkle Sensa on everything you eat and watch the pounds come off - no dieting, no exercise, no calorie counting. In our studies, Sensa users lost an average of 30 pounds. It''s the revolutionary, clinically studied way to lose weight."


