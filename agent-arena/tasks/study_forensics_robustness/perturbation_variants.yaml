  original_claim: 'A widely shared article warns: "Breathing the air in Delhi is like smoking 44 cigarettes a day. Just going outside is as deadly as a pack-a-day smoking habit — every day you spend in the city is literally smoking your lungs away."


    The "44 cigarettes" figure comes from Berkeley Earth''s cigarette-equivalence rule of thumb, in which a long-term average fine-particulate (PM2.5) exposure of about 22 micrograms per cubic metre carries roughly the same long-term premature-death risk as smoking one cigarette a day; at a peak PM2.5 of ~950-1,000 that scales to about 44 cigarettes/day. Outdoor air pollution and particulate matter are classified by the International Agency for Research on Cancer (IARC) as Group 1 carcinogens (2013), and air pollution''s causal contribution to cardiovascular and respiratory mortality is well established. But the Berkeley Earth equivalence is explicitly a LONG-TERM, population-average premature-mortality-RISK conversion, not a literal statement that one day of city air equals the total harm of a 44-cigarette-a-day habit (which also carries decades of addiction, tar, and dose).

    '
