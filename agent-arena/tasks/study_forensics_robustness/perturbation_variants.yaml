  original_claim: 'A widely shared health article warns: "Coffee causes cancer. Studies found that people who drink coffee have higher rates of bladder cancer, so drinking coffee raises your cancer risk - cut out coffee to protect yourself."


    The claim draws on older observational studies that reported an association between coffee drinking and bladder cancer. But coffee drinkers were also, on average, much more likely to be cigarette smokers, and smoking is a strong established cause of bladder cancer. When the International Agency for Research on Cancer (IARC) re-evaluated the evidence in 2016 (Monographs Volume 116), it concluded that coffee is "not classifiable as to its carcinogenicity to humans" (Group 3) and that the earlier associations were attributable to inadequate control for smoking and other confounders rather than to coffee itself; IARC removed coffee from the "possibly carcinogenic" category it had held since 1991.

