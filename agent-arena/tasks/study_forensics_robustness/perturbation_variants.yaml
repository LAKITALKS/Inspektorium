  original_claim: 'A public-health guidance page advises: "Taking a folic acid supplement before conception and during the first weeks of pregnancy substantially reduces the risk of neural tube defects such as spina bifida and anencephaly. All women who could become pregnant are advised to take 400 micrograms of folic acid a day."


    The recommendation rests on the Medical Research Council (MRC) Vitamin Study, a randomised, double-blind, placebo-controlled trial published in the Lancet in 1991, in which periconceptional folic acid supplementation reduced the recurrence of neural tube defects by about 72% in women at high risk. The finding has since been supported by a further primary-prevention randomised trial (Czeizal & Dudas 1992), by large observational studies, and by population-wide mandatory folic-acid food fortification programmes that have been followed by marked declines in neural-tube-defect prevalence; the US Preventive Services Task Force gives periconceptional folic acid supplementation its highest (Grade A) recommendation. The guidance names the intervention (folic acid), the timing (before conception and early pregnancy), the outcome (neural tube defects), and the direction of effect, without extending the claim to unrelated benefits or to untested populations.

