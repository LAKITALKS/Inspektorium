  original_claim: 'A public health summary states: "In the phase 3 ZOE-50 randomized controlled trial of adults aged 50 and older, the recombinant shingles vaccine (Shingrix) reduced the incidence of shingles by 97.2% compared with placebo over a mean follow-up of about three years."


