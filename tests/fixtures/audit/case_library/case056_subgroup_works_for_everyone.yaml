id: study-forensics-056
title: 'Study Forensics: Subgroup result generalised to everyone'
domain: study_forensics
difficulty: medium
task_type: study_forensics
task_family: overclaim
trap_type: subgroup_overreach
ambiguity_level: low
origin: synthetic_fixture
prompt: |
  A trial's overall result was not significant, but a post-hoc subgroup of women under 40 showed improvement. The company advertises that the product 'works for everyone', citing the trial, without noting the primary result was null or that the subgroup was exploratory.
context: |
  A null primary result with a post-hoc subgroup finding is generalised to 'works for everyone'. Subgroup overreach plus omission of the null primary.
expected_answer: overclaim
reference_solution: |
  The primary outcome was null; the positive signal is a post-hoc (exploratory) subgroup, which is hypothesis-generating and prone to false positives. Claiming it 'works for everyone' inverts the actual result — an overclaim.
gold_label: overclaim
gold_confidence: high
gold_case_type: clear
gold_justification: |
  A null primary outcome is hidden while a post-hoc subgroup is generalised to the whole population. The 'works for everyone' claim exceeds and even contradicts the evidence — an overclaim via subgroup overreach.
gold_alternative_reading: null
gold_summary: |
  A null trial with a post-hoc subgroup (women under 40) is marketed as 'works for everyone'. Subgroup overreach hiding the null primary.
curator_notes: |
  Subgroup overclaim with suppressed null primary. Discrimination: separates weak from strong models on post-hoc subgroup reasoning.
  SYNTHETIC FIXTURE: inspired by a common claim pattern; not a real citation or product.
expected_findings:
- finding: unsupported_generalization
  severity: major
  confidence: high
- finding: conclusion_exceeds_results
  severity: moderate
  confidence: high
gold_evidence_spans:
- span: overall result was not significant, but a post-hoc subgroup of women under 40 showed improvement
  why_it_matters: The primary was null; the subgroup is exploratory.
  supports_finding: conclusion_exceeds_results
- span: advertises that the product 'works for everyone'
  why_it_matters: Generalises an exploratory subgroup to the whole population.
  supports_finding: unsupported_generalization
evaluation:
  method: auto
  answer_match: contains
key_insights:
- keyword: post-hoc subgroup
  variants:
  - subgroup
  - exploratory
  - women under 40
  functional_descriptions:
  - a post-hoc subgroup is hypothesis-generating
- keyword: null primary
  variants:
  - not significant
  - overall result
  functional_descriptions:
  - the primary outcome was null and omitted
common_errors:
- treating a subgroup as the main result
- missing the suppressed null primary
expected_failure_modes:
- missing_overclaim
- subgroup_blindness
discriminative_dimensions:
- correctness
- insight_depth
diagnostic_focus: Can the agent flag generalisation from a post-hoc subgroup over a null primary?
