id: study-forensics-022
title: "Study Forensics: Four-day workweek trial improves well-being"
domain: study_forensics
difficulty: medium
task_type: study_forensics
task_family: solid
trap_type: borderline_solid_with_caveats
ambiguity_level: medium
prompt: |
  A six-month experiment across 141 companies in six countries tested whether cutting the work week from five days to four while maintaining pay could improve employee well-being. Companies volunteered to restructure their workflows so that productivity would not decline with fewer hours. Nearly 2,900 participants completed surveys before and after the trial. After six months, workers reported lower stress and burnout, higher job satisfaction, and no perceived drop in performance. More than 90 percent of participating companies chose to continue the four-day schedule. The researchers cautioned that because companies self-selected into the trial and outcomes were self-reported, further randomised evaluations are needed.
context: |
  A large multi-company trial with positive results but important methodological
  limitations (self-selection, self-report). The researchers acknowledge limitations openly.
expected_answer: "solid"
reference_solution: |
  The summary reports results from a large multi-company trial showing improvements in employee well-being without apparent productivity loss. It notes limitations such as voluntary participation and self-reported outcomes. Although the study design has weaknesses, the claims are restrained to measured outcomes and the need for further research is acknowledged.
gold_label: solid
gold_confidence: medium
gold_case_type: borderline
gold_justification: |
  Although the study was not randomised and relies on self-report, the summary accurately
  conveys the evidence and includes caveats. The claims are restrained to the measured
  outcomes, and the need for further research is acknowledged. The self-selection bias
  weakens the evidence but the authors are transparent about it. We label this solid
  because the reporting matches the evidence quality — no overclaim is made.
gold_alternative_reading: |
  Some may argue that self-selection (only enthusiastic companies participated) and
  self-reported outcomes (workers may overstate satisfaction) limit the evidence quality
  enough to warrant an overclaim label. The 90% continuation rate may reflect commitment
  bias rather than objective success. A reasonable analyst could mark this as borderline
  overclaim due to the design limitations.
gold_summary: |
  The summary reports results from a large multi-company trial of a four-day workweek showing improvements in well-being without productivity loss. It notes limitations such as voluntary participation and self-reported outcomes.
curator_notes: |
  Key borderline case. The evidence is real but methodologically limited. The reporting
  is honest and restrained. Tests whether agents can distinguish "weak evidence honestly
  reported" (solid) from "strong evidence dishonestly reported" (overclaim). The gold
  label is solid because the claims match the evidence quality, even though that quality
  has limitations. Expect model disagreement on this case.
expected_findings:
  - finding: evidence_matches_claim
    severity: minor
    confidence: medium
  - finding: cautious_scope_control
    severity: minor
    confidence: medium
gold_evidence_spans:
  - span: "workers reported lower stress and burnout, higher job satisfaction, and no perceived drop in performance"
    why_it_matters: "Directly supports the claim that the four-day schedule improved well-being."
    supports_finding: evidence_matches_claim
  - span: "researchers cautioned that because companies self-selected into the trial and outcomes were self-reported, further randomised evaluations are needed"
    why_it_matters: "Explicit acknowledgement of methodological limitations represents honest uncertainty."
    supports_finding: cautious_scope_control
evaluation:
  method: auto
  answer_match: contains
key_insights:
  - keyword: "self-selection"
    variants: ["companies volunteered", "self-selected", "volunteered to restructure"]
    functional_descriptions:
      - "companies that chose to participate may differ from those that did not"
  - keyword: "self-reported"
    variants: ["surveys", "reported lower stress", "perceived drop"]
    functional_descriptions:
      - "outcomes depend on subjective reporting, not objective measures"
common_errors:
  - overflagging because of self-selection and self-report limitations
  - missing the honest caveating as a strength
expected_failure_modes:
  - overclaiming
  - false_positive_flagging
discriminative_dimensions:
  - correctness
  - insight_depth
diagnostic_focus: "Can the agent recognise honest reporting of limited evidence without overflagging?"
