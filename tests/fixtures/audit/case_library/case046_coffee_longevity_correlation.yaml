id: study-forensics-046
title: 'Study Forensics: Coffee drinkers live longer, framed as coffee causing longevity'
domain: study_forensics
difficulty: medium
task_type: study_forensics
task_family: correlation_vs_causation
trap_type: correlation_causation_conflation
ambiguity_level: low
origin: synthetic_fixture
prompt: |
  A large observational cohort finds that people who drink 2–3 cups of coffee daily have a 12% lower risk of death over ten years than non-drinkers. A news article concludes that 'coffee makes you live longer' and advises non-drinkers to start drinking coffee for health.
context: |
  Observational association reported as causation with an actionable recommendation. Coffee drinkers differ systematically (income, smoking, health) — confounding.
expected_answer: correlation_vs_causation
reference_solution: |
  This is a cross-sectional/observational association. Coffee drinkers differ from non-drinkers on many confounders (socioeconomic status, smoking, baseline health). The design cannot support a causal 'makes you live longer' claim or a start-drinking recommendation.
gold_label: correlation_vs_causation
gold_confidence: high
gold_case_type: clear
gold_justification: |
  An observational association is converted into a causal claim plus behaviour advice. No randomisation, confounders unaddressed; the correlation-to-causation leap is the core issue.
gold_alternative_reading: null
gold_summary: |
  A cohort links coffee to lower mortality; the article claims coffee causes longevity and tells non-drinkers to start. Association, not causation.
curator_notes: |
  Classic observational-to-causal case with a recommendation. Parallel to case023 (green space) and public_001 (exercise). Discrimination: separates weak from strong models on the recommendation overreach.
  SYNTHETIC FIXTURE: inspired by a common claim pattern; not a real citation or product.
expected_findings:
- finding: correlation_as_causation
  severity: major
  confidence: high
- finding: unsupported_generalization
  severity: moderate
  confidence: medium
gold_evidence_spans:
- span: people who drink 2–3 cups of coffee daily have a 12% lower risk of death
  why_it_matters: An observational association, subject to confounding.
  supports_finding: correlation_as_causation
- span: '''coffee makes you live longer'' and advises non-drinkers to start drinking coffee'
  why_it_matters: Causal claim plus behaviour advice from a correlational design.
  supports_finding: unsupported_generalization
evaluation:
  method: auto
  answer_match: contains
key_insights:
- keyword: observational
  variants:
  - cohort
  - association
  - correlation
  functional_descriptions:
  - design is observational, not experimental
- keyword: confounders
  variants:
  - confounding
  - differ systematically
  functional_descriptions:
  - coffee drinkers differ on unmeasured factors
common_errors:
- reading association as causation
- endorsing the start-drinking recommendation
expected_failure_modes:
- missing_confounders
- causal_overreach
discriminative_dimensions:
- correctness
- insight_depth
diagnostic_focus: Can the agent hold the correlation/causation line and flag the recommendation?
