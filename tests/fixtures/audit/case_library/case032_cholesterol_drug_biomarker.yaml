id: study-forensics-032
title: "Study Forensics: Novel cholesterol drug dramatically lowers LDL but cardiovascular outcomes unknown"
domain: study_forensics
difficulty: medium
task_type: study_forensics
task_family: overclaim
trap_type: surrogate_endpoint_overclaim
ambiguity_level: low
prompt: |
  A pharmaceutical company announced results from its Phase 2 trial of a new injectable cholesterol-lowering agent. The drug reduced LDL cholesterol by 65 percent in patients with familial hypercholesterolaemia who were already on maximum statin therapy. Company executives described the results as a major breakthrough in cardiovascular protection and said the drug would transform outcomes for patients at high risk of heart attack and stroke. They announced plans for an accelerated approval pathway based on the LDL reduction data. The trial measured only lipid levels and liver safety over twelve weeks; no cardiovascular events were tracked and no outcomes trial is expected to report for at least four more years.
context: |
  A pharmaceutical trial showing dramatic improvement in a surrogate biomarker
  (LDL cholesterol) with the company actively framing the biomarker success as
  cardiovascular protection. No clinical outcomes data exist. The rhetorical
  leap from biomarker to clinical benefit is explicit and central.
expected_answer: "overclaim"
reference_solution: |
  The summary describes a drug that dramatically lowers LDL cholesterol (a biomarker) but has not been tested for cardiovascular outcomes (heart attacks, strokes). Despite this, the company actively frames the LDL reduction as "cardiovascular protection" and a "breakthrough" that will "transform outcomes." The claims about clinical benefit are unsupported by the trial data, which measured only lipid levels.
gold_label: overclaim
gold_confidence: high
gold_case_type: clear
gold_justification: |
  v0.6.5 relabel from mechanism_vs_evidence to overclaim. All three models
  (Haiku, Sonnet, Opus) independently classified this as overclaim in the
  Mechanism Calibration Sprint 2, with strong reasoning: the company claims
  "major breakthrough in cardiovascular protection" and that the drug will
  "transform outcomes for patients at high risk of heart attack and stroke"
  based solely on 12-week LDL reduction data with no cardiovascular events
  tracked. This is textbook overclaim — the conclusion (cardiovascular
  protection) goes far beyond the results (lipid lowering). The empirical
  finding from multiple sprints confirms: when biomarker success is actively
  sold as clinical benefit, models correctly see overclaim, not a
  mechanism-evidence gap. The mechanism-vs-evidence framing requires that
  the gap between mechanism and evidence is the central issue; here, the
  central issue is the rhetorical inflation of claims beyond data.
gold_alternative_reading: |
  One could argue this is mechanism_vs_evidence because the underlying issue
  is a surrogate-to-clinical-outcome gap. However, the active rhetorical
  selling ("breakthrough in cardiovascular protection", "transform outcomes")
  makes overclaim the more precise label. The mechanism-evidence gap is
  present but secondary to the overclaim.
gold_summary: |
  Pharmaceutical company actively frames surrogate biomarker improvement (65% LDL reduction) as cardiovascular protection despite no outcomes data. Relabeled from mechanism_vs_evidence to overclaim after calibration sprint confirmed the active rhetorical selling is the primary issue.
curator_notes: |
  v0.6.5 RELABELED. Originally designed as Shape B of mechanism_vs_evidence
  (biomarker success sold as clinical benefit). After Mechanism Calibration
  Sprint 2, all 3 models (Haiku, Sonnet, Opus) independently classified as
  overclaim. Key insight: the Biomarker-to-Clinical shape does NOT produce
  mechanism_vs_evidence when the framing is actively promotional. It produces
  overclaim. This is now a clean overclaim case that tests whether models
  identify surrogate-endpoint inflation. The mechanism_vs_evidence category
  is empirically limited to animal/preclinical-to-human gaps (Shapes A, C).
expected_findings:
  - finding: conclusion_exceeds_results
    severity: major
    confidence: high
  - finding: unsupported_generalization
    severity: moderate
    confidence: medium
gold_evidence_spans:
  - span: "Company executives described the results as a major breakthrough in cardiovascular protection and said the drug would transform outcomes for patients at high risk of heart attack and stroke"
    why_it_matters: "Explicitly frames biomarker success as clinical benefit — the defining overclaim."
    supports_finding: conclusion_exceeds_results
  - span: "The trial measured only lipid levels and liver safety over twelve weeks; no cardiovascular events were tracked"
    why_it_matters: "Confirms that no clinical outcomes were measured, making the cardiovascular protection claim unsupported."
    supports_finding: conclusion_exceeds_results
  - span: "The drug reduced LDL cholesterol by 65 percent"
    why_it_matters: "Dramatic surrogate improvement that is rhetorically inflated into clinical claims."
    supports_finding: conclusion_exceeds_results
  - span: "no outcomes trial is expected to report for at least four more years"
    why_it_matters: "Evidence for clinical benefit will not exist for years, yet claims are made now."
    supports_finding: unsupported_generalization
evaluation:
  method: auto
  answer_match: contains
key_insights:
  - keyword: "surrogate endpoint"
    variants: ["LDL cholesterol", "lipid levels", "biomarker"]
    functional_descriptions:
      - "LDL reduction is a surrogate marker, not a clinical outcome"
  - keyword: "rhetorical overclaim"
    variants: ["breakthrough in cardiovascular protection", "transform outcomes", "accelerated approval"]
    functional_descriptions:
      - "company frames biomarker success as proven clinical benefit"
common_errors:
  - accepting LDL reduction as sufficient evidence of cardiovascular protection
  - missing the surrogate-to-clinical gap
expected_failure_modes:
  - accepting_surrogate_as_clinical
discriminative_dimensions:
  - correctness
  - insight_depth
diagnostic_focus: "Can the agent identify that a dramatic surrogate biomarker improvement framed as cardiovascular protection is overclaim?"
