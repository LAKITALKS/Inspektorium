id: study-forensics-013
title: "Study Forensics: Gut microbes and anxiety"
domain: study_forensics
difficulty: medium
task_type: study_forensics
task_family: mechanism_vs_evidence
trap_type: animal_to_human_overreach
ambiguity_level: medium
prompt: |
  Neuroscientists studying mice found that microbial metabolites known as indoles modulate activity in the basolateral amygdala, affecting anxiety-like behaviour. Germ-free mice exhibited heightened anxiety, which was reduced when they were colonised with normal microbiota or given indoles. The researchers propose that indole-producing probiotics could one day be used to treat anxiety disorders. They caution that human trials are needed to confirm safety and efficacy.
context: |
  The animal study convincingly demonstrates that microbial indoles influence anxiety in mice
  but then speculates about probiotic therapies for humans. The mechanistic finding is solid
  within rodents, yet the translation to humans is unproven.
expected_answer: "mechanism_vs_evidence"
reference_solution: |
  The animal study convincingly demonstrates that microbial indoles influence anxiety in mice but then speculates about probiotic therapies for humans. The mechanistic finding is solid within rodents, yet the translation to humans is unproven, and the causal pathway in people remains undemonstrated.
gold_label: mechanism_vs_evidence
gold_confidence: high
gold_case_type: clear
gold_justification: |
  Strong causal evidence in animal model (germ-free mice, colonisation reversal). But the
  leap to 'indole-producing probiotics for anxiety disorders' in humans is speculative.
  The core issue is mechanism vs evidence: the mechanism is demonstrated in mice, not humans.
  This is distinct from simple overclaim because the animal evidence is genuinely strong.
gold_alternative_reading: |
  Could be read as overclaim (speculative therapy claim). But the defining feature is the
  species-translation gap, not simple claim inflation. The 'human trials needed' caveat
  shows the authors know the limitation — the issue is the gap itself, not deception.
  A correlation_vs_causation reading is incorrect because the animal evidence IS causal.
gold_summary: |
  The animal study convincingly demonstrates that microbial indoles influence anxiety in mice but then speculates about probiotic therapies for humans. The mechanistic finding is solid within rodents, yet the translation to humans is unproven, and the causal pathway in people remains undemonstrated.
curator_notes: |
  Tricky label. Haiku confused this with correlation_vs_causation in Sprint 2 (the animal
  evidence IS causal, so that label is wrong). Opus classified as 'solid' in both sprints
  — too charitable with 'human trials needed' as sufficient caveat. Sonnet is the only
  model that consistently gets this right. Good discriminative case for mechanism reasoning.
expected_findings:
  - finding: mechanism_not_demonstrated
    severity: moderate
    confidence: medium
  - finding: unsupported_generalization
    severity: moderate
    confidence: medium
  - finding: cautious_scope_control
    severity: minor
    confidence: high
gold_evidence_spans:
  - span: "indoles modulate activity in the basolateral amygdala ... affecting anxiety-like behaviour"
    why_it_matters: "Describes a mechanistic result in mice."
    supports_finding: mechanism_not_demonstrated
  - span: "germ-free mice exhibited heightened anxiety ... reduced when colonised or given indoles"
    why_it_matters: "Shows the effect is causally tied to microbiota in animals."
    supports_finding: mechanism_not_demonstrated
  - span: "indole-producing probiotics could one day be used to treat anxiety disorders"
    why_it_matters: "Moves from animal mechanistic insight to speculative human therapy."
    supports_finding: unsupported_generalization
  - span: "human trials are needed"
    why_it_matters: "Acknowledges that evidence is preclinical."
    supports_finding: cautious_scope_control
evaluation:
  method: auto
  answer_match: contains
key_insights:
  - keyword: "animal model"
    variants: ["mice", "rodent", "preclinical", "germ-free"]
    functional_descriptions:
      - "findings are from an animal model, not humans"
  - keyword: "mechanism not demonstrated in humans"
    variants: ["translation gap", "animal to human", "preclinical only"]
    functional_descriptions:
      - "the mechanism is shown in mice but not demonstrated in people"
  - keyword: "speculative therapy"
    variants: ["could one day", "probiotics", "potential treatment"]
    functional_descriptions:
      - "therapeutic claims go beyond the available preclinical evidence"
common_errors:
  - treating animal mechanism as proven in humans
  - missing the translation gap
  - accepting the caution as sufficient
expected_failure_modes:
  - accepting_mechanism_as_evidence
  - missing_translation_gap
discriminative_dimensions:
  - correctness
  - mechanism_quality
  - insight_depth
diagnostic_focus: "Can the agent distinguish between solid preclinical mechanism and speculative human application?"
