id: study-forensics-051
title: 'Study Forensics: Fairly communicated observational finding (positive control)'
domain: study_forensics
difficulty: medium
task_type: study_forensics
task_family: solid
trap_type: cautious_fair_communication
ambiguity_level: low
origin: synthetic_fixture
prompt: |
  A cohort study reports that higher fibre intake is associated with modestly lower colorectal cancer risk. The authors write that the study is observational, that residual confounding cannot be excluded, that the association does not prove causation, and that randomised trials would be needed to confirm a causal effect. Media coverage repeats these caveats.
context: |
  Positive control: an observational association communicated with correct, non-decorative caveats and no causal overreach. Should NOT be penalised.
expected_answer: solid
reference_solution: |
  The conclusions stay within the evidence tier: an association is reported as an association, causation is explicitly not claimed, confounding is acknowledged, and the need for RCTs is stated. This is fair, solid communication.
gold_label: solid
gold_confidence: high
gold_case_type: clear
gold_justification: |
  The communication matches the evidence: association framed as association, causation disclaimed, confounding and the need for trials acknowledged. No overclaim, no tier gap, no decorative hedging — a solid case.
gold_alternative_reading: null
gold_summary: |
  A fibre-cancer association is reported with correct caveats: observational, confounding possible, causation not claimed, RCTs needed. Solid.
curator_notes: |
  Positive control for over-flagging. Pairs with case033/case038. Discrimination: catches trigger-happy models that hallucinate problems in fair reporting.
  SYNTHETIC FIXTURE: inspired by a common claim pattern; not a real citation or product.
