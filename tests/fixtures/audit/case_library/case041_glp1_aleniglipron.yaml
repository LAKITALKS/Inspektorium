key_insights:
  - keyword: "cross-trial comparison"
    variants: ["indirect comparison", "head-to-head", "no comparator trial", "across trials"]
    functional_descriptions:
      - "best-in-class and injectable-comparability claims rely on cross-trial inference, not direct evidence"
  - keyword: "phase maturity"
    variants: ["Phase 2", "mid-stage", "Phase 3 needed", "not confirmed"]
    functional_descriptions:
      - "Phase 2 data cannot establish best-in-class positioning or market readiness"
  - keyword: "hedge language"
    variants: ["potentially", "potential", "may", "could"]
    functional_descriptions:
      - "hedge words are present but may be insufficient to constrain the overall framing"
  - keyword: "no plateau"
    variants: ["absence of plateau", "weight loss continued", "no leveling off"]
    functional_descriptions:
      - "lack of plateau is an observation, not a confirmed durability advantage"
