id: study-forensics-040
title: "Study Forensics: Vocational training program claims effectiveness without control group"
domain: study_forensics
difficulty: medium
task_type: study_forensics
task_family: correlation_vs_causation
trap_type: missing_counterfactual
ambiguity_level: low
prompt: |
  A regional workforce development agency evaluated its six-month vocational training program by comparing employment rates among participants before and after completing the program. Prior to enrollment, 34% of participants were employed. Twelve months after program completion, the employment rate among former participants had risen to 61%. The agency concluded that the program successfully increased employment by approximately 27 percentage points and recommended expanding the program to additional districts. The program director noted that the results confirmed the effectiveness of skills-based training as an intervention for unemployment.
context: |
  Pre-post comparison without control group or counterfactual construction. The 27-point
  gain is attributed to the program without controlling for labor market trends, selection
  bias, or macroeconomic changes.
expected_answer: "correlation_vs_causation"
reference_solution: |
  The pre-post comparison lacks any control group or counterfactual construction. Attributing the 27-point employment gain to the program infers causation from a non-experimental before/after design without controlling for secular labour-market trends, Ashenfelter's dip, self-selection, and macroeconomic changes. The core forensic problem is a causal claim drawn from a confounded, uncontrolled design — correlation treated as causation. (The 'confirmed effectiveness' plus expansion recommendation is also rhetorical inflation, the secondary overclaim reading.)
gold_label: correlation_vs_causation
gold_confidence: high
gold_case_type: clear
gold_justification: |
  The agency attributes a pre/post employment change to the program from an uncontrolled
  before/after design with no comparison arm and unaddressed confounders (secular
  labour-market trends, Ashenfelter's dip, self-selection). This is a causal claim drawn
  from a non-experimental, confounded design — correlation treated as causation — which is
  the primary and cleanest taxonomy fit (the curator note itself calls the error
  "structural, not rhetorical"). A strong model reads it this way consistently (Opus 4.5,
  3/3, confidence 0.92).
gold_alternative_reading: |
  A defensible secondary reading is overclaim: 'confirmed the effectiveness' as fact plus a
  recommendation to expand is rhetorical inflation of an uncontrolled design. This was the
  original primary label; on Phase-4 curator review the causal-inference framing
  (correlation_vs_causation) was judged the cleaner primary because the root problem is the
  missing counterfactual, not the wording. The overclaim reading remains valid as a
  secondary finding.
gold_summary: |
  A vocational program's pre/post employment gain (34%→61%) is attributed to the program from an uncontrolled before/after design with no comparison arm. Causal claim from a confounded, non-experimental design — correlation treated as causation (with a secondary overclaim reading).
curator_notes: |
  Imported from Dataset 5 (AA-NEW-004). Unique counterfactual-failure shape (uncontrolled
  pre/post) in the policy-evaluation domain. Tests whether agents recognize that pre-post
  gains require counterfactual benchmarking before any causal attribution.
  PHASE-4 CURATOR REVIEW: originally labelled overclaim (later borderline). A full 50-case
  live baseline plus a targeted 3-run re-check both showed a strong model classifying it as
  correlation_vs_causation (3/3, confidence 0.92). The curator note itself describes the
  error as "structural (absence of comparison arm), not rhetorical" — i.e. a causal-inference
  flaw. The primary label was flipped to correlation_vs_causation (clean fit), with overclaim
  preserved as the secondary/alternative reading. Kept in the library because the
  missing-counterfactual pattern is a genuinely important, distinct forensic lesson; only the
  label mapping was wrong.
expected_findings:
  - finding: correlation_as_causation
    severity: major
    confidence: high
    note: "Pre/post change attributed causally to the program from an uncontrolled, confounded design"
  - finding: conclusion_exceeds_results
    severity: moderate
    confidence: high
    note: "'Confirmed effectiveness' + expansion recommendation from an uncontrolled design"
  - finding: unsupported_generalization
    severity: moderate
    confidence: medium
    note: "No control group or counterfactual; secular trends and selection not addressed"
gold_evidence_spans:
  - span: "concluded that the program successfully increased employment by approximately 27 percentage points"
    why_it_matters: "Attributes the entire pre/post gain causally to the program with no counterfactual — correlation treated as causation."
    supports_finding: correlation_as_causation
  - span: "confirmed the effectiveness of skills-based training as an intervention for unemployment"
    why_it_matters: "Claims confirmed effectiveness from an uncontrolled pre-post design (secondary overclaim reading)."
    supports_finding: conclusion_exceeds_results
evaluation:
  method: auto
  answer_match: contains
key_insights:
  - keyword: "no control group"
    variants: ["pre-post", "before and after", "no comparison"]
    functional_descriptions:
      - "pre-post design without control group cannot establish causation"
  - keyword: "selection bias"
    variants: ["self-selection", "participants", "enrolled"]
    functional_descriptions:
      - "participants who choose to enroll may differ systematically"
  - keyword: "secular trends"
    variants: ["labor market", "macroeconomic", "regional trends"]
    functional_descriptions:
      - "employment gains may reflect broader economic trends"
common_errors:
  - accepting pre-post gains as evidence of program effectiveness
  - missing the absence of a comparison group
  - not considering Ashenfelter's dip or selection bias
expected_failure_modes:
  - causal_overreach
  - missing_counterfactual_requirement
  - missing_confounders
discriminative_dimensions:
  - correctness
  - insight_depth
diagnostic_focus: "Can the agent recognise that pre-post gains require counterfactual benchmarking?"
source_dataset: dataset_5
source_id: AA-NEW-004
