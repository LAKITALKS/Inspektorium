id: study-forensics-062
title: 'Study Forensics: ''Green product'' claim ignoring production and disposal'
domain: study_forensics
difficulty: medium
task_type: study_forensics
task_family: overclaim
trap_type: lifecycle_boundary_overreach
ambiguity_level: low
origin: synthetic_fixture
prompt: |
  A manufacturer markets a reusable product as 'carbon neutral' and 'zero impact' because it produces no emissions during use. The claim excludes the emissions from raw-material extraction, manufacturing, shipping, and end-of-life disposal.
context: |
  A use-phase-only figure is presented as full-lifecycle carbon neutrality. Excluding production, transport, and disposal is a system-boundary overclaim.
expected_answer: overclaim
reference_solution: |
  'Carbon neutral' and 'zero impact' are lifecycle claims, but only the use phase is counted. Extraction, manufacturing, shipping, and disposal emissions are excluded, so the net claim is unsupported — a boundary overclaim.
gold_label: overclaim
gold_confidence: high
gold_case_type: clear
gold_justification: |
  A use-phase-only emissions figure is generalised to full-lifecycle 'carbon neutral / zero impact'. The excluded production, transport, and disposal stages make the claim exceed the evidence — an overclaim.
gold_alternative_reading: null
gold_summary: |
  'Carbon neutral / zero impact' counts only the use phase, excluding production, shipping, and disposal. Lifecycle-boundary overclaim.
curator_notes: |
  Lifecycle-boundary overclaim (greenwashing pattern). Parallels the energy blind-spot cases (042/059). Discrimination: separates weak from strong models on system boundaries.
  SYNTHETIC FIXTURE: inspired by a common claim pattern; not a real citation or product.
expected_findings:
- finding: conclusion_exceeds_results
  severity: major
  confidence: high
- finding: unsupported_generalization
  severity: moderate
  confidence: high
gold_evidence_spans:
- span: '''carbon neutral'' and ''zero impact'' because it produces no emissions during use'
  why_it_matters: A use-phase figure presented as a full-lifecycle claim.
  supports_finding: conclusion_exceeds_results
- span: excludes the emissions from raw-material extraction, manufacturing, shipping, and end-of-life disposal
  why_it_matters: Major lifecycle stages are omitted from the accounting.
  supports_finding: unsupported_generalization
evaluation:
  method: auto
  answer_match: contains
key_insights:
- keyword: lifecycle boundary
  variants:
  - use phase
  - production
  - disposal
  - cradle-to-grave
  functional_descriptions:
  - only the use phase is counted
- keyword: carbon neutral claim
  variants:
  - zero impact
  - carbon neutral
  functional_descriptions:
  - net claim excludes major emission stages
common_errors:
- accepting use-phase-only as full lifecycle
- missing production/disposal emissions
expected_failure_modes:
- missing_overclaim
- boundary_blindness
discriminative_dimensions:
- correctness
- insight_depth
diagnostic_focus: Can the agent flag a lifecycle claim that counts only the use phase?
