id: study-forensics-031
title: "Study Forensics: Rapamycin for human longevity — promise vs proof"
domain: study_forensics
difficulty: hard
task_type: study_forensics
task_family: solid
trap_type: overflagging_cautious_early_data
ambiguity_level: medium
intake_review: retired_after_review
status: retired
excluded_from_active_metrics: true
superseded_by: none
prompt: |
  Rapamycin is an immunosuppressant that inhibits the mTOR pathway. In mice it reliably extends lifespan by about ten to twenty-five percent, and these results have been replicated across multiple laboratories. Enthusiasts now take the drug off-label to slow aging. However, the first well-designed human trial reported that rapamycin was safe but failed to reduce abdominal fat, its primary goal, and only modestly increased lean muscle in women. The study did not test whether the drug slows biological aging. Experts caution that no clinical evidence yet shows rapamycin slows aging in people, and off-label use carries risks, especially for those with conditions like active cancer.
context: |
  A longevity case juxtaposing strong, replicated preclinical evidence with
  limited human data. The first human trial was safe but missed its primary
  endpoint. The reporting is cautious and honest. The evidence tier includes
  limited human data (not purely animal), and the text does not claim human
  efficacy — it explicitly states the opposite.
expected_answer: "solid"
reference_solution: |
  The text reports both preclinical and early human evidence honestly. The human trial
  results are presented without exaggeration: safety was confirmed, but the primary
  endpoint was missed. The text explicitly states that no clinical evidence shows
  rapamycin slows aging in people. Experts caution against off-label use. The conclusions
  stay within the evidence tier — no human therapeutic benefit is implied. This is
  cautious, accurate reporting of a complex evidence landscape.
gold_label: solid
gold_confidence: medium
gold_case_type: borderline
gold_justification: |
  The evidence tier is limited_human: a human trial was conducted and its results are
  reported honestly (safe but failed primary endpoint, modest secondary effects). The
  conclusion tier matches: the text does NOT claim rapamycin slows aging in humans.
  It explicitly states "no clinical evidence yet shows rapamycin slows aging in people."
  The preclinical data is presented as context, not as proof of human efficacy. The
  reporting is cautious throughout: experts caution against off-label use, risks are
  mentioned. Because the text includes human data and its conclusions do not exceed
  that evidence, the evidence-tier bridge is not broken. This is borderline-solid:
  honest reporting of an early-stage evidence landscape.
gold_alternative_reading: |
  A mechanism_vs_evidence reading is defensible: the text juxtaposes strong mouse data
  with weak human data, and the mention of off-label use could imply that the preclinical
  promise extends to humans. Under this reading, the text creates a narrative bridge from
  animal mechanism to human application that the evidence does not support. However, the
  text explicitly closes this bridge by stating that no clinical evidence exists and by
  cautioning against off-label use. The previous gold label (mechanism_vs_evidence) was
  too strict given the text's honest, non-promotional framing.
gold_summary: |
  Borderline solid case. Honest reporting of rapamycin's preclinical promise alongside a failed human primary endpoint. Conclusions stay within the evidence tier.
curator_notes: |
  RELABELED 2026-04-08: Gold label changed from mechanism_vs_evidence to solid.

  Reason: 0/9 model runs across three validation sprints (Praxis, Full 27,
  Mechanism Retest) agree with mechanism_vs_evidence label. All 3 models
  consistently classify as solid across all runs. The key distinguishing factor
  from other mechanism cases: this text includes HUMAN trial data (limited_human
  tier, not animal tier) and explicitly states "no clinical evidence yet shows
  rapamycin slows aging in people." The conclusions do not exceed the evidence tier.

  Contrast with case013 (gut/anxiety) or case036 (antioxidant/mice) where the
  evidence is purely animal and the text implies human therapeutic benefit. In
  case031, the text reports human data honestly and does not claim efficacy.

  The previous label (mechanism_vs_evidence) treated the animal-human juxtaposition
  as a mechanism gap, but the text addresses this gap directly rather than bridging
  it with hedged claims. The borderline nature is preserved via gold_case_type.

  This case now tests: can the agent recognize that cautious reporting of a failed
  human trial alongside strong preclinical data is solid, not mechanism_vs_evidence?

  RETIREMENT (Phase 5.05e, v0.8.6 curator approval): retired from active metrics and
  excluded by default (status: retired / excluded_from_active_metrics: true), following
  the case042 retirement precedent. Reason: material source-voice and claim-isolation
  ambiguity — the item has no single claim-maker for one evaluated claim, and any
  single-claim isolation would change the evaluated object and risk destabilizing the
  historically-relabeled gold (solid). This cannot be repaired without changing what is
  evaluated. Retirement is not deletion: the gold label, public claim, evidence,
  prior rationale, and the original blind packet are all preserved unchanged.
expected_findings:
  - finding: evidence_matches_claim
    severity: minor
    confidence: medium
  - finding: cautious_scope_control
    severity: minor
    confidence: high
gold_evidence_spans:
  - span: "the first well-designed human trial reported that rapamycin was safe but failed to reduce abdominal fat, its primary goal"
    why_it_matters: "Human evidence is reported honestly — failed primary endpoint is disclosed."
    supports_finding: evidence_matches_claim
  - span: "Experts caution that no clinical evidence yet shows rapamycin slows aging in people"
    why_it_matters: "Explicitly constrains interpretation — no human efficacy claim is made."
    supports_finding: cautious_scope_control
  - span: "off-label use carries risks, especially for those with conditions like active cancer"
    why_it_matters: "Risk disclosure reinforces the cautious framing."
    supports_finding: cautious_scope_control
evaluation:
  method: auto
  answer_match: contains
key_insights:
  - keyword: "human data reported honestly"
    variants: ["failed to reduce", "modestly increased", "did not test"]
    functional_descriptions:
      - "the text includes human trial data and reports it without exaggeration"
  - keyword: "explicit no-efficacy statement"
    variants: ["no clinical evidence", "experts caution"]
    functional_descriptions:
      - "the text explicitly states that human efficacy is unproven"
  - keyword: "risk disclosure"
    variants: ["off-label use carries risks", "active cancer"]
    functional_descriptions:
      - "potential harms of premature adoption are disclosed"
common_errors:
  - flagging as mechanism_vs_evidence due to animal-human juxtaposition
  - ignoring that the text includes human data and honest negative results
  - treating preclinical context as an implicit efficacy claim
expected_failure_modes:
  - false_positive_flagging
  - mislabel_as_mechanism
discriminative_dimensions:
  - correctness
  - mechanism_quality
  - insight_depth
diagnostic_focus: "Can the agent recognize that cautious reporting of a failed human trial alongside strong preclinical data is solid, not mechanism_vs_evidence?"
relabel_history:
  - date: "2026-04-08"
    old_label: mechanism_vs_evidence
    new_label: solid
    reason: "0/9 model runs agree with mechanism_vs_evidence. Evidence tier is limited_human (not animal). Text explicitly states no clinical evidence for human efficacy."
    evidence: "Praxis + Full 27 + Mechanism Retest: 0/9 correct across Sonnet, Haiku, Opus"
