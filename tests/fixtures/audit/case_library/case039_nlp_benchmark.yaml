id: study-forensics-039
title: "Study Forensics: NLP benchmark performance with well-calibrated limitations"
domain: study_forensics
difficulty: easy
task_type: study_forensics
task_family: solid
trap_type: overflagging_solid_study
ambiguity_level: low
prompt: |
  Our language model achieved 91.3% accuracy on the standard reading comprehension benchmark in controlled evaluation. However, several important limitations should be noted. The benchmark was published prior to our training cutoff, raising the possibility that some test items appeared in pretraining data, which could inflate measured performance. The evaluation was conducted in a zero-shot setting using a single prompt formulation; performance varies with prompt phrasing by an estimated 4 to 9 percentage points across tested variants. Additionally, the benchmark was designed on English-language news and encyclopedia text; we have not evaluated generalization to conversational, technical, or multilingual input. Given these constraints, we recommend treating the reported figure as an upper-bound estimate rather than a reliable operational performance guarantee.
context: |
  Well-calibrated model evaluation with three validity threats identified and the headline
  number explicitly downgraded. The hedge is substantive, not performative. Essential
  positive anchor to prevent evaluation drift toward paranoid labeling.
expected_answer: "solid"
reference_solution: |
  Three validity threats are identified — training contamination, prompt sensitivity, distribution shift — and the headline number is explicitly downgraded to an upper-bound estimate. The hedge is substantive, changing the recommended interpretation of the result. This is a well-calibrated evaluation that should be classified as solid.
gold_label: solid
gold_confidence: high
gold_case_type: clear
gold_justification: |
  Three validity threats are identified — training contamination, prompt sensitivity,
  distribution shift — and the headline number is explicitly downgraded to an upper-bound
  estimate. The hedge is substantive, not performative: it changes the recommended
  interpretation of the result. This is a necessary positive anchor for evaluation systems
  that would otherwise flag every confident number as an overclaim.
gold_alternative_reading: |
  A strict reviewer might argue that even 'upper-bound estimate' overclaims without a
  formal contamination analysis — if contamination is severe enough, no bound can be
  established from this benchmark at all.
gold_summary: |
  Well-calibrated AI benchmark evaluation that identifies three validity threats and explicitly downgrades the headline metric. Substantive hedging, not performative.
curator_notes: |
  Imported from Dataset 5 (AA-NEW-002). Critical true-positive anchor for the solid
  category. Tests whether agents recognize genuinely well-calibrated reasoning in an AI/ML
  context. Without cases like this, evaluation drift toward paranoid flagging is likely.
  The label was originally 'solid_with_limitations' — normalized to 'solid' because the
  limitations are part of what makes it solid (honest reporting).
expected_findings:
  - finding: evidence_matches_claim
    severity: minor
    confidence: high
  - finding: cautious_scope_control
    severity: minor
    confidence: high
  - finding: none_or_minor
    severity: minor
    confidence: high
gold_evidence_spans:
  - span: "raising the possibility that some test items appeared in pretraining data, which could inflate measured performance"
    why_it_matters: "Identifies training contamination as a specific validity threat."
    supports_finding: cautious_scope_control
  - span: "we recommend treating the reported figure as an upper-bound estimate rather than a reliable operational performance guarantee"
    why_it_matters: "Explicitly downgrades the headline number — substantive, not performative hedging."
    supports_finding: evidence_matches_claim
evaluation:
  method: auto
  answer_match: contains
key_insights:
  - keyword: "contamination"
    variants: ["pretraining data", "training cutoff", "inflate"]
    functional_descriptions:
      - "benchmark contamination is acknowledged as a threat to validity"
  - keyword: "upper-bound estimate"
    variants: ["not a reliable guarantee", "constraints", "limitations"]
    functional_descriptions:
      - "the reported figure is explicitly downgraded"
  - keyword: "prompt sensitivity"
    variants: ["4 to 9 percentage points", "varies with prompt", "single prompt"]
    functional_descriptions:
      - "evaluation acknowledges measurement instability"
common_errors:
  - flagging well-calibrated limitations as evidence of overclaim
  - treating any AI performance claim as automatically suspicious
expected_failure_modes:
  - false_positive_flagging
  - overclaiming
discriminative_dimensions:
  - correctness
  - insight_depth
diagnostic_focus: "Can the agent recognise genuinely well-calibrated AI evaluation without paranoid over-flagging?"
