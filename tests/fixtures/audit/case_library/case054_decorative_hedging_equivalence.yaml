  why_it_matters: The hedge is contradicted by interchangeable framing and a switch push.
  supports_finding: decorative_uncertainty
- span: The only data are in-vitro dissolution curves; no clinical equivalence study is cited
  why_it_matters: No clinical equivalence evidence supports interchangeability.
  supports_finding: conclusion_exceeds_results
evaluation:
  method: auto
  answer_match: contains
key_insights:
- keyword: decorative hedge
  variants:
  - may be comparable
  - interchangeable
  functional_descriptions:
  - hedge does not constrain the implied equivalence
- keyword: no equivalence study
  variants:
  - dissolution
  - in-vitro
  - no clinical
  functional_descriptions:
  - clinical equivalence never demonstrated
common_errors:
- accepting the hedge at face value
- missing the interchangeable framing that voids the hedge
expected_failure_modes:
- accepting_hedged_overclaim
- decorative_uncertainty_blindness
discriminative_dimensions:
- correctness
- insight_depth
- hedge_detection
diagnostic_focus: Can the agent see through a decorative hedge that implies unproven equivalence?
