id: study-forensics-001
title: "Study Forensics: Social media use and well-being"
domain: study_forensics
difficulty: medium
task_type: study_forensics
task_family: solid
trap_type: overflagging_solid_study
ambiguity_level: low
prompt: |
  Researchers at the University of Pennsylvania randomly assigned 143 college students either to continue their usual use of Facebook, Snapchat and Instagram or to limit each platform to ten minutes per day. Over three weeks they collected objective usage data from phone screenshots and measured depression and loneliness. Students who restricted social-media use reported significant declines in depressive symptoms and loneliness compared with the control group. The authors caution that the study involved only college students and three specific platforms and that the results may not generalise to other populations.
context: |
  This is a well-designed randomized trial with honest uncertainty.
  The agent should recognize it as solid and not overflag.
expected_answer: "solid"
reference_solution: |
  Randomised experimental evidence shows that limiting use of three social-media platforms reduces depression and loneliness in college students. The paper is careful not to overgeneralise and openly acknowledges its limitations, so there are no major epistemic failures.
gold_label: solid
gold_confidence: high
gold_case_type: clear
gold_justification: |
  Randomised experimental design with objective usage verification supports causal inference.
  Authors explicitly restrict scope to college students and three platforms.
  No overclaim or unsupported generalization detected in the text.
gold_alternative_reading: |
  One could argue the sample size (n=143) is small for strong causal claims, but the
  authors acknowledge this. A 'solid with minor caveats' reading is reasonable but does
  not change the label.
gold_summary: |
  Randomised experimental evidence shows that limiting use of three social-media platforms reduces depression and loneliness in college students. The paper is careful not to overgeneralise and openly acknowledges its limitations, so there are no major epistemic failures.
curator_notes: |
  Clear solid case. Both LLM validation sprints correctly classify this across all models.
  Good calibration anchor for the 'solid' category.
expected_findings:
  - finding: evidence_matches_claim
    severity: minor
    confidence: high
  - finding: cautious_scope_control
    severity: minor
    confidence: high
  - finding: none_or_minor
    severity: minor
    confidence: high
gold_evidence_spans:
  - span: "randomly assigned 143 college students either to continue their usual use ... or to limit each platform to ten minutes per day"
    why_it_matters: "Indicates a true randomised design, supporting causal inference."
    supports_finding: evidence_matches_claim
  - span: "Students who restricted social-media use reported significant declines in depressive symptoms and loneliness"
    why_it_matters: "Direct evidence that limiting social-media use improved well-being."
    supports_finding: evidence_matches_claim
  - span: "the study involved only college students and three specific platforms"
    why_it_matters: "Authors themselves restrict the scope and urge caution."
    supports_finding: cautious_scope_control
evaluation:
  method: auto
  answer_match: contains
key_insights:
  - keyword: "randomised"
    variants: ["randomized", "RCT", "experimental design"]
    functional_descriptions:
      - "the study uses random assignment, supporting causal claims"
  - keyword: "scope limitation"
    variants: ["caution", "may not generalise", "limited population"]
    functional_descriptions:
      - "authors acknowledge the study's limited generalisability"
common_errors:
  - hallucinating major flaws in a solid study
  - flagging acknowledged limitations as if they were unacknowledged
expected_failure_modes:
  - overclaiming
  - false_positive_flagging
discriminative_dimensions:
  - correctness
  - insight_depth
diagnostic_focus: "Can the agent recognise a well-designed study without overflagging?"
