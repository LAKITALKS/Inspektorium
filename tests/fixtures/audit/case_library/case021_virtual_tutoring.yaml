id: study-forensics-021
title: "Study Forensics: Virtual tutoring boosts reading skills"
domain: study_forensics
difficulty: medium
task_type: study_forensics
task_family: solid
trap_type: overflagging_solid_study
ambiguity_level: low
prompt: |
  A randomized controlled trial tested a virtual reading tutoring program in a rural school district. The program paired live online tutors with small groups of struggling elementary students for ten-week sessions. Students who completed around forty tutoring sessions gained roughly two additional months of reading progress compared with peers in the control condition. Even those attending fewer sessions showed modest gains. Researchers emphasised that consistent participation was critical and highlighted that the program delivered results at a lower cost than typical high-dose tutoring.
context: |
  A well-designed educational RCT with cautious language and clear limitations.
  The agent should recognise this as solid without overflagging.
expected_answer: "solid"
reference_solution: |
  The summary describes a rigorously designed trial of a virtual tutoring program. It reports improved reading outcomes and notes cost effectiveness and the importance of consistent participation without overstating broader impacts.
gold_label: solid
gold_confidence: high
gold_case_type: clear
gold_justification: |
  A randomized controlled trial with clear outcome measures supports the claims.
  The summary uses cautious language ("gained roughly two additional months",
  "consistency is critical") and does not generalise beyond the study population.
  There is no obvious mechanism-evidence mismatch or causal overreach.
gold_alternative_reading: null
gold_summary: |
  The summary describes a rigorously designed trial of a virtual tutoring program. It reports improved reading outcomes and notes cost effectiveness and the importance of consistent participation without overstating broader impacts.
curator_notes: |
  Clean solid case from education domain. Tests whether agents avoid flagging
  non-problems in a well-conducted RCT with measured language. Good calibration
  anchor alongside the existing health-focused solid cases (001, 004).
expected_findings:
  - finding: evidence_matches_claim
    severity: minor
    confidence: high
  - finding: cautious_scope_control
    severity: minor
    confidence: high
gold_evidence_spans:
  - span: "Students who completed around forty tutoring sessions gained roughly two additional months of reading progress compared with peers in the control condition"
    why_it_matters: "Shows that the primary claim is directly supported by measured outcomes in the trial."
    supports_finding: evidence_matches_claim
  - span: "Researchers emphasised that consistent participation was critical and highlighted that the program delivered results at a lower cost than typical high-dose tutoring"
    why_it_matters: "Demonstrates cautious language and avoids overgeneralization by noting conditions for success."
    supports_finding: cautious_scope_control
evaluation:
  method: auto
  answer_match: contains
key_insights:
  - keyword: "RCT"
    variants: ["randomized controlled trial", "control condition", "randomly assigned"]
    functional_descriptions:
      - "the study uses random assignment, supporting causal claims"
  - keyword: "cautious language"
    variants: ["roughly", "modest gains", "consistent participation was critical"]
    functional_descriptions:
      - "authors hedge claims appropriately and note conditions for success"
common_errors:
  - hallucinating major flaws in a solid study
  - treating modest effects as evidence of overclaim
expected_failure_modes:
  - overclaiming
  - false_positive_flagging
discriminative_dimensions:
  - correctness
  - insight_depth
diagnostic_focus: "Can the agent recognise a well-designed educational RCT without overflagging?"
