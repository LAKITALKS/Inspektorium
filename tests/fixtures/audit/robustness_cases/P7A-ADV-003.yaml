  adversarial_mechanism: |
    A specific, real, prestigious citation (Martin-Montalvo 2013, Nature Communications) genuinely
    establishes the mechanism step (metformin activates AMPK and extends lifespan in mice), and the
    claim wields that citation as if it proved the human outcome (slows human aging, adds years of
    life). The surface pressure is the adjacency: the citation is relevant to the mechanism, so a
    shallow evaluator credits it for the outcome. The pressure to resist: accepting a
    mechanism/animal-outcome citation as proof of the human clinical outcome.
  gold_status: frozen_pre_model
  difficulty_tier: D2
  difficulty_rationale: |
    One primary (mechanism_vs_evidence) with one genuinely plausible alternate (overclaim, invited by
    the inflated marketing); precedence decides. The animal-to-human structure is clear (Shape A), and
    the cited study is unambiguously murine, keeping it at D2. Property-based.
  precedence_rationale: |
    A described animal/preclinical mechanism (AMPK activation and lifespan extension in mice) used to
    imply an undemonstrated human clinical benefit is the mechanism_vs_evidence trigger (Shape A). It
    is genuinely present and central, so under docs/taxonomy_precedence.md rule 1 it outranks the
    generic overclaim reading, which is retained as secondary.
  ambiguity_note: |
    Determinate: mechanism_vs_evidence is the single defensible primary; overclaim is a real secondary
    reading, not an equal competitor.
  steelman_challenge: |
    Strongest case the gold is wrong: metformin is a real drug with decades of safety data, favourable
    diabetic observational associations, and a plausible calorie-restriction-mimetic mechanism, so a
    reader might see a modest, evidence-based claim (solid) or plain marketing hype (overclaim).
    Counter-evidence weighed: the decisive citation is a mouse study; human anti-aging benefit is
    undemonstrated (TAME not yet reported) and diabetic observational data are confounded. Resolution:
    the animal-mechanism-to-human-benefit leap is the core error; gold remains mechanism_vs_evidence.
