id: P7A-ADV-003
title: "Adversarial A2: 'metformin is an anti-aging drug' cites a mouse-lifespan study (citation supports mechanism, not the human outcome)"
domain: study_forensics
difficulty: hard
task_type: study_forensics
task_family: mechanism_vs_evidence
trap_type: citation_supports_mechanism_not_outcome
ambiguity_level: low
prompt: |
  A longevity clinic promotes off-label metformin: "Metformin is an anti-aging drug. A landmark study in Nature Communications proved that metformin extends lifespan and healthspan by activating AMPK — the same pathway as calorie restriction — so taking metformin will slow your aging and add years to your life."

  The cited study (Martin-Montalvo et al., Nature Communications, 2013) found that low-dose metformin (0.1% of diet) started at middle age extended lifespan and healthspan in male MICE and increased AMPK activity (a higher 1% dose was toxic). In humans, whether metformin slows aging or extends lifespan in people without diabetes has not been demonstrated: the randomized Targeting Aging with Metformin (TAME) trial was designed to test this but its result is not yet available, and observational data from people with diabetes are confounded.
context: |
  Evidence tier: a real, specific, prestigious citation (a mouse interventional study) genuinely
  establishes the MECHANISM step (metformin activates AMPK and extends lifespan in mice). The public
  claim wields that citation for a different, downstream proposition: that metformin slows aging and
  extends lifespan in humans. The citation supports the mechanism/animal outcome but not the human
  outcome. A described animal/preclinical mechanism used to imply an undemonstrated human clinical
  benefit is the mechanism_vs_evidence trigger (Shape A: animal-to-human leap).
expected_answer: "mechanism_vs_evidence"
reference_solution: |
  The clinic cites a genuine Nature Communications mouse study that established metformin's AMPK
  mechanism and lifespan extension in mice, then uses it to claim metformin slows aging and adds years
  to human life. The citation supports the mechanism and the animal outcome, not the human clinical
  outcome (no human anti-aging/lifespan demonstration; TAME not yet reported). An animal mechanism
  extrapolated to a human clinical benefit that has not been shown is mechanism_vs_evidence (Shape A).
  A generic overclaim reading also fits (the marketing is inflated), but the decisive structure is the
  animal-mechanism-to-human-benefit leap.
gold_label: mechanism_vs_evidence
gold_confidence: high
gold_case_type: clear
gold_justification: |
  1. Exact proposition: metformin slows human aging and extends human lifespan, because a study proved
     it extends lifespan by activating AMPK.
  2. What the strongest evidence establishes: in male mice, low-dose metformin extended lifespan and
     increased AMPK activity (Martin-Montalvo 2013); no human trial has shown metformin slows aging or
     extends lifespan in non-diabetics (TAME not yet reported; diabetic observational data confounded).
  3. Adversarial surface feature: a specific, prestigious, real citation (Nature Communications) is
     invoked as if it proves the human outcome, and the AMPK mechanism sounds compelling.
  4. Actual forensic mismatch: the citation supports the mechanism and the animal outcome, not the
     claimed human clinical outcome; the human benefit is undemonstrated.
  5. Primary frozen label: mechanism_vs_evidence — a described animal/preclinical mechanism (AMPK
     activation, mouse lifespan) used to imply an undemonstrated human clinical benefit (Shape A).
  6. Why precedence keeps it primary: the decisive defect is structural (animal mechanism -> human
     benefit), exactly the mechanism_vs_evidence trigger, which outranks generic overclaim when
     genuinely present and central (docs/taxonomy_precedence.md rule 1).
  7. Strongest competing label: overclaim — the copy is inflated marketing ("add years to your life").
  8. Why it loses: overclaim is generic; the specific animal-mechanism-to-human-benefit structure is
     present and captures the core error, so it is primary and overclaim is the secondary reading.
  9. What would change the verdict: an adequately powered human RCT (e.g. a positive TAME) showing
     metformin slows aging/extends lifespan would support the claim; if the claim rested only on a
     human surrogate biomarker framed as clinical benefit it would route to overclaim (Shape B).
gold_alternative_reading: |
  Alternative: overclaim. Plausible because "add years to your life" is inflated marketing. It is the
  secondary reading; it loses as primary because the decisive, structural defect is the
  animal-mechanism-to-human-benefit leap (mouse AMPK/lifespan -> human anti-aging), which is the
  mechanism_vs_evidence trigger and captures the core error.
gold_summary: |
  A clinic cites a real Nature Communications mouse study (metformin extends lifespan via AMPK) to
  claim metformin slows human aging; human anti-aging benefit is undemonstrated (TAME not yet
  reported). Animal mechanism cited for a human outcome = mechanism_vs_evidence (overclaim secondary).
curator_notes: |
  Adversarial family A2 (citation supports mechanism but not outcome). Real public claim: the
  longevity-medicine 'metformin as an anti-aging drug' narrative, documented alongside the TAME trial.
  Cited mechanism study: Martin-Montalvo 2013 (Nature Communications, mice). Gold routes to
  mechanism_vs_evidence per the A2 primary branch (described mechanism used to imply human benefit).
  Distinct decisive study/mechanism from A2 spermidine (P7A-ADV-004: autophagy/Eisenberg 2016) and
  from Boundary senolytics/fasting cases. Gold frozen before any model output.
