  - finding: subgroup_benefit_generalized
    severity: major
    confidence: high
    note: "A benefit for classical (disease-caused) hypogonadism generalized to all symptomatic aging men"
  - finding: benefit_not_established_and_possible_harm
    severity: major
    confidence: high
    note: "FDA (2015): benefit for age-related low T not established; possible heart-attack/stroke risk"
gold_evidence_spans:
  - span: "Feeling tired, low energy, low sex drive as you get older? It could be Low T"
    why_it_matters: "Reframes normal aging symptoms as a treatable deficiency for the whole aging population."
    supports_finding: subgroup_benefit_generalized
  - span: "the benefit of testosterone therapy for 'age-related hypogonadism' ... is NOT established"
    why_it_matters: "No established benefit in the generalized population, plus possible harm."
    supports_finding: benefit_not_established_and_possible_harm
