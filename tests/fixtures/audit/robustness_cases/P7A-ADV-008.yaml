robustness:
  robustness_case_id: P7A-ADV-008
  case_family: adversarial
  adversarial_family_id: A4
  adversarial_family: "subgroup -> general-population generalization"
  adversarial_mechanism: |
    A benefit real for a disease-defined subgroup (men with classical, disease-caused hypogonadism) is
    generalized to the broad population of aging men with nonspecific symptoms ("Low T"). The surface
    pressure is that the underlying indication is genuine and the symptoms are common and relatable, so
    the generalization feels medically legitimate. The pressure to resist: extrapolating a
    disease-specific benefit to ordinary aging, where benefit is not established and harm is possible.
  gold_status: frozen_pre_model
  difficulty_tier: D2
  difficulty_rationale: |
    One primary (overclaim) with one genuinely plausible alternate (solid, invited by the real
    hypogonadism indication); the disease-vs-aging distinction decides it. A single dominant defect and
    no competing specific trigger keep it at D2. Property-based.
  precedence_rationale: |
    No specific-label trigger fires: no observational dataset is read causally (rules out
    correlation_vs_causation) and no animal/preclinical mechanism is the basis (rules out
    mechanism_vs_evidence). The defect is generalization beyond the evidenced (disease) population =
    overclaim, per docs/taxonomy_precedence.md (extrapolation to unstudied populations).
  ambiguity_note: |
    Determinate: overclaim is the single defensible primary; solid is tempting only because testosterone
    genuinely treats classical hypogonadism, not the aging population the campaign addresses.
  steelman_challenge: |
    Strongest case the gold is wrong: testosterone therapy is a real, effective, FDA-approved treatment
    for hypogonadism, and some symptomatic older men do have low testosterone, so a reader could call
    the claim solid or reasonable. Counter-evidence weighed: the FDA (2015) found benefit for
    age-related low testosterone is not established, restricted approved use to classical hypogonadism,
    and warned of possible cardiovascular harm; "Low T" marketing drove large prescribing increases.
    Resolution: the subgroup-to-general extrapolation exceeds the evidence; gold remains overclaim.
