  difficulty_tier: D3
  difficulty_rationale: |
    >=2 plausible labels and a subtle precedence call: the real, textbook calcium/vitamin-D bone
    mechanism ("building blocks of bone") strongly invites mechanism_vs_evidence, and the partial
    truth (calcium/D matter for bone) adds pull toward solid, but the frozen taxonomy routes the human
    surrogate/mechanism-to-clinical gap (BMD framed as fracture prevention, contradicted by RCTs) to
    overclaim. Property-based tagging.
  precedence_rationale: |
    mechanism_vs_evidence requires a described animal/preclinical pathway extrapolated to a human
    benefit with no direct human outcome evidence. Here the human clinical outcome (fracture
    incidence) was tested directly in randomized trials (Zhao 2017) and not supported for supplements,
    so the decisive gap is a surrogate/mechanism inflated against human clinical data. The taxonomy
    routes this surrogate-to-clinical gap ("Shape B") to overclaim (docs/taxonomy_precedence.md;
    case054). Primary = overclaim.
  ambiguity_note: |
    Determinate: overclaim is the single defensible primary under the frozen Shape-B routing;
    mechanism_vs_evidence is a genuine but documented-and-rejected alternative (the mechanism is real
    and invoked, but direct human fracture trials exist and do not support the supplement claim). The
    scoped 'solid' reading is defeated because the frozen claim is unscoped ('everyone over 50').
  steelman_challenge: |
    Strongest case the gold is wrong: calcium is literally the mineral substrate of bone and vitamin D
    is required to absorb it, so the claim could be read as a mechanism-to-human leap
    (mechanism_vs_evidence). Counter-evidence weighed: this is not a preclinical-only extrapolation —
    a large randomized-trial meta-analysis (Zhao 2017, 51,145 community-dwelling adults) tested the
    clinical outcome (fractures) directly and found no benefit for supplements, and the USPSTF (2018)
    recommends against low-dose supplementation for primary fracture prevention; the failure is a
    mechanism/surrogate inflated against human clinical data. The taxonomy routes surrogate-to-clinical
    to overclaim (Shape B; case054 precedent). Resolution: gold remains overclaim.
