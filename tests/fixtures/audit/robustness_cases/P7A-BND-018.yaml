id: P7A-BND-018
title: "Boundary: 'calcium and vitamin D build strong bones, so supplements prevent fractures' (mechanism/BMD surrogate framed as clinical benefit, Shape B)"
domain: study_forensics
difficulty: hard
task_type: study_forensics
task_family: overclaim
trap_type: surrogate_endpoint_overclaim
ambiguity_level: medium
prompt: |
  A bone-health message urges: "Calcium and vitamin D are the building blocks of bone — vitamin D helps you absorb the calcium your skeleton needs. Take a daily calcium plus vitamin D supplement to build strong bones and protect yourself from the fractures of osteoporosis. Everyone over 50 should be taking them."

  The biological rationale is real and is the basis of the message: calcium is the mineral substrate of bone and vitamin D is required for its absorption, and adequate intake supports bone mineral density (a surrogate). But the clinical outcome — whether taking calcium/vitamin D SUPPLEMENTS actually prevents fractures — has been tested directly in humans. A 2017 systematic review and meta-analysis of randomized trials (Zhao et al., JAMA; 33 trials, 51,145 community-dwelling older adults) found that calcium, vitamin D, or both, versus placebo/no treatment, was NOT associated with a lower incidence of fractures, regardless of dose, sex, fracture history, dietary calcium, or baseline vitamin D. On that basis the US Preventive Services Task Force (2018) recommends AGAINST daily supplementation with ≤400 IU vitamin D and ≤1000 mg calcium for the primary prevention of fractures in community-dwelling postmenopausal women (and found supplementation increases kidney stones). Bone mineral density is a surrogate; fracture incidence is the clinical outcome that matters.
context: |
  Evidence tier: a large meta-analysis of randomized trials with a clinical endpoint (fracture
  incidence) plus an authoritative guideline. The calcium/vitamin-D bone MECHANISM is real and
  materially invoked ("building blocks of bone"), and a SURROGATE (bone mineral density) is
  supported — but the CLINICAL outcome (fracture prevention by SUPPLEMENTS) was tested directly in
  community-dwelling adults and not supported. The message sells the mechanism + surrogate as the
  clinical benefit. Under the frozen taxonomy this "Shape B" surrogate-to-clinical framing routes to
  overclaim, not mechanism_vs_evidence.
expected_answer: "overclaim"
reference_solution: |
  Calcium/vitamin D have a real, textbook bone mechanism (mineral substrate + absorption) and support
  the surrogate (bone mineral density), but the clinical claim — that taking SUPPLEMENTS prevents
  fractures — was tested head-on in randomized trials (Zhao 2017 meta-analysis) and NOT supported in
  community-dwelling older adults; the USPSTF recommends against low-dose supplementation for primary
  fracture prevention. Selling the mechanism/surrogate as the clinical benefit, generalized to
  "everyone over 50," is a surrogate-framed-as-clinical-outcome overclaim. Under the frozen taxonomy,
  surrogate-to-clinical ("Shape B") routes to overclaim. It is not mechanism_vs_evidence: that label
  is for a described animal/preclinical pathway extrapolated to a human benefit with no direct human
  outcome data; here direct human fracture-outcome trials exist (and do not support the supplement
  claim), so the failure is inflation of a mechanism/surrogate against human clinical data = overclaim.
gold_label: overclaim
gold_confidence: high
gold_case_type: clear
gold_justification: |
  1. What the claim asserts: because calcium/vitamin D are the building blocks of bone (a mechanism)
     and support bone density, taking supplements builds strong bones and prevents osteoporotic
     fractures — for everyone over 50.
  2. What the evidence establishes: the mechanism/surrogate (bone mineral density) is real, but
     randomized trials (Zhao 2017 meta-analysis, 51,145 community-dwelling adults) show calcium/
     vitamin-D supplements do NOT lower fracture incidence, and the USPSTF recommends against low-dose
     supplementation for primary fracture prevention.
  3. Mismatch: a mechanism plus a surrogate is presented as a clinical benefit (and generalized to a
     whole population) that direct human trials do not support.
  4. Frozen label triggered: overclaim — a surrogate/mechanism framed as a clinical benefit, plus
     population over-generalization (rhetorical inflation); per docs/study_forensics_taxonomy.md this
     "Shape B" routes to overclaim.
  5. Why mechanism_vs_evidence is tempting: the calcium/vitamin-D bone mechanism ("building blocks of
     bone", vitamin-D-dependent absorption) is real, textbook, and the explicit rhetorical basis, so
     the mechanism boundary looks directly relevant.
  6. Why precedence rejects it as primary: mechanism_vs_evidence applies when a described animal/
     preclinical PATHWAY is extrapolated to a human benefit with NO direct human outcome data. Here
     the human clinical outcome (fracture incidence) has been tested directly in randomized trials and
     not supported for supplements; the decisive gap is surrogate/mechanism-to-clinical against
     existing human data, which the taxonomy routes to overclaim (Shape B; docs/taxonomy_precedence.md;
     case054 precedent).
  7. What would change the classification: had the message said "get enough calcium and vitamin D to
     support bone density; supplements have not been shown to prevent fractures in healthy adults,"
     it would be solid; had it rested only on a cell/animal bone-formation pathway with no human
     fracture trials, mechanism_vs_evidence could apply.
gold_alternative_reading: |
  Alternative: mechanism_vs_evidence. Plausible because the calcium/vitamin-D bone mechanism
  ("building blocks of bone", vitamin-D-dependent calcium absorption) is real and is the explicit
  basis of the claim. It loses under precedence because this is not a preclinical-only extrapolation:
  the human clinical outcome (fracture incidence) was tested directly in randomized trials (Zhao 2017)
  and not supported for supplements, so the failure is a mechanism/surrogate inflated against human
  clinical data. The taxonomy routes surrogate-to-clinical ("Shape B") to overclaim.
gold_summary: |
  A bone-health message sells calcium/vitamin D's real bone mechanism and surrogate (BMD) as fracture
  prevention for everyone over 50, but randomized trials (Zhao 2017; 51,145 adults) show supplements
  do NOT lower fractures and the USPSTF recommends against them for primary prevention. Mechanism +
  surrogate framed as clinical benefit = overclaim (Shape B), not mechanism_vs_evidence, because
  direct human fracture trials exist and do not support the claim.
curator_notes: |
  Boundary family B2 (overclaim <-> mechanism_vs_evidence), overclaim direction. Independent
  replacement for retired P7A-BND-006 (fluoride/BMD); supersedes it. Preserves the SAME forensic
  object (a bone-building/BMD surrogate framed as fracture prevention) but with a REAL, identifiable,
  ubiquitous public claim (calcium/vitamin-D supplement + bone-health messaging) and strong RCT/
  guideline evidence (Zhao 2017 JAMA; USPSTF 2018) — resolving 006's archetype-only claim-provenance
  gap. Genuine B2: the calcium/vitamin-D bone mechanism is real and is the explicit rhetorical basis,
  so mechanism_vs_evidence is a strong attractor, but frozen Shape-B routing keeps overclaim primary.
  Distinct from P7A-BND-015 (oncology/PFS) and P7A-BND-016 (ginkgo/blood-flow): different agent
  (nutrient supplement), different surrogate (BMD), bone domain. Gold frozen before any model output.
expected_findings:
  - finding: surrogate_framed_as_clinical
    severity: major
    confidence: high
    note: "Bone mineral density / 'building blocks of bone' (surrogate/mechanism) sold as fracture prevention (clinical outcome)"
  - finding: claim_contradicted_by_rct
    severity: major
    confidence: high
    note: "Randomized-trial meta-analysis (Zhao 2017) shows calcium/vitamin-D supplements do not lower fracture incidence in community-dwelling adults"
  - finding: population_overgeneralization
    severity: moderate
    confidence: high
    note: "'Everyone over 50 should take them' generalizes beyond any supported benefit (USPSTF recommends against for primary prevention)"
gold_evidence_spans:
  - span: "Take a daily calcium plus vitamin D supplement to build strong bones and protect yourself from the fractures of osteoporosis"
    why_it_matters: "Frames a mechanism/surrogate (bone building blocks / BMD) as a clinical benefit (fracture prevention)."
    supports_finding: surrogate_framed_as_clinical
  - span: "was NOT associated with a lower incidence of fractures"
    why_it_matters: "The direct human RCT-meta-analysis outcome that contradicts the supplement claim and rules out a preclinical-only reading."
    supports_finding: claim_contradicted_by_rct
