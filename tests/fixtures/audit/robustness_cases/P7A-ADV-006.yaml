id: P7A-ADV-006
title: "Adversarial A3: 'violent video games cause real-world violence' (causal claim from correlational data; authoritative body says attribution is not scientifically sound)"
domain: study_forensics
difficulty: hard
task_type: study_forensics
task_family: correlation_vs_causation
trap_type: causal_verb_on_observational_data
ambiguity_level: low
prompt: |
  After a mass shooting, a widely reported public statement asserts: "Violent video games are causing real-world violence. Studies link these games to aggression, so these vicious, violent games are turning our young people into killers and driving mass shootings."

  The research linking violent video games to behaviour is predominantly correlational and experimental studies of short-term AGGRESSION (e.g., mildly aggressive lab measures), not real-world criminal violence. The American Psychological Association, updating its position (2020), stated that "attributing violence to violent video gaming is not scientifically sound," noting there is insufficient research to support a causal link between violent video game use and criminal or lethal violence, and that focusing on games "draws attention away from other factors" (such as a history of violence, mental-health issues, and access to firearms).
context: |
  Evidence tier: correlational and short-term aggression studies versus a causal claim about real-world
  violence, with an authoritative scientific-body assessment. The statement converts a contested
  correlation with lab-measured aggression into a causal claim that games cause criminal/lethal
  violence and mass shootings. The APA explicitly says attributing violence to gaming is not
  scientifically sound. A causal claim about violence drawn from correlational aggression data is the
  correlation_vs_causation trigger.
expected_answer: "correlation_vs_causation"
reference_solution: |
  The statement asserts violent video games CAUSE real-world violence and mass shootings, citing
  studies that mostly measure short-term aggression and are correlational. The APA (2020) states that
  attributing violence to violent video gaming is not scientifically sound and that no causal link to
  criminal/lethal violence is established. A causal claim about violence from correlational aggression
  data is correlation_vs_causation. Generic overclaim also fits, but the specific causal-inference
  error (correlation with aggression treated as causation of violence) is the core defect.
gold_label: correlation_vs_causation
gold_confidence: high
gold_case_type: clear
gold_justification: |
  1. Exact proposition: violent video games cause real-world violence (turning young people into
     killers, driving mass shootings).
  2. What the strongest evidence establishes: the research is predominantly correlational/short-term
     aggression studies; the APA (2020) states attributing violence to gaming is not scientifically
     sound and that no causal link to criminal/lethal violence is established.
  3. Adversarial surface feature: "studies link these games to aggression" plus the emotional salience
     of a mass shooting make the causal leap to violence feel evidenced.
  4. Actual forensic mismatch: an association with lab-measured aggression (correlational, contested)
     is treated as causation of real-world violence - a different, more serious outcome not
     established by that evidence.
  5. Primary frozen label: correlation_vs_causation - a causal claim about violence drawn from
     correlational/non-causal data (missing counterfactual), which the authoritative body rejects.
  6. Why precedence keeps it primary: the causal-inference trigger is directly present and captures
     the core error, outranking generic overclaim (docs/taxonomy_precedence.md rule 1).
  7. Strongest competing label: overclaim - the statement is rhetorically inflated ("turning our young
     people into killers").
  8. Why it loses: the decisive structural defect is treating correlation (with aggression) as
     causation (of violence); overclaim is the secondary reading.
  9. What would change the verdict: rigorous evidence establishing that violent games cause real-world
     violence would support the claim; reporting only the aggression association without the causal
     violence claim would be closer to solid.
gold_alternative_reading: |
  Alternative: overclaim. Plausible because the statement is emotionally inflated and generalizes
  ("turning our young people into killers"). It loses as primary because the decisive defect is a
  specific causal-inference error - treating a correlational association with short-term aggression as
  causation of real-world violence - i.e. correlation_vs_causation.
gold_summary: |
  A post-shooting statement says violent video games cause real-world violence, citing aggression
  studies that are correlational/short-term. The APA (2020) says attributing violence to gaming is not
  scientifically sound. Causal claim from correlational data = correlation_vs_causation (overclaim secondary).
curator_notes: |
  Adversarial family A3 (causal verb grafted onto correlational data). Real public claim: the recurring
  post-mass-shooting political/media assertion that violent video games cause violence. Counter-evidence
  and documentation: APA 2020 resolution/statement. Distinct from A3 breakfast (P7A-ADV-005) - different
  domain (media/behaviour) and an authoritative-body assessment as the counterweight. Independent of all
  Boundary/Class-A cases. Gold frozen before any model output.
expected_findings:
  - finding: correlation_aggression_read_as_causation_violence
    severity: major
    confidence: high
    note: "Correlational aggression research treated as causing real-world criminal violence"
  - finding: authoritative_body_rejects_attribution
    severity: major
    confidence: high
    note: "APA (2020): attributing violence to violent video gaming is not scientifically sound"
gold_evidence_spans:
  - span: "Violent video games are causing real-world violence"
    why_it_matters: "A causal claim about violence asserted from correlational aggression data."
    supports_finding: correlation_aggression_read_as_causation_violence
  - span: "attributing violence to violent video gaming is not scientifically sound"
    why_it_matters: "Authoritative body rejects the causal attribution."
    supports_finding: authoritative_body_rejects_attribution
evaluation:
  method: auto
  answer_match: contains
key_insights:
  - keyword: "aggression vs violence"
    variants: ["correlational", "short-term", "not criminal violence"]
    functional_descriptions:
      - "A correlation with lab aggression is not causation of real-world violence"
  - keyword: "APA position"
    variants: ["2020", "not scientifically sound", "other factors"]
    functional_descriptions:
      - "The authoritative body rejects attributing violence to gaming"
common_errors:
  - conflating short-term aggression with real-world violence
  - accepting a causal claim because 'studies link' the two
expected_failure_modes:
  - correlation_read_as_causation
  - aggression_conflated_with_violence
discriminative_dimensions:
  - correctness
  - insight_depth
diagnostic_focus: "Can the agent see that a causal claim about real-world violence rests on correlational aggression data the authoritative body says cannot support it?"
origin: curated
status: active
gold_status: frozen_pre_model
robustness:
  robustness_case_id: P7A-ADV-006
  case_family: adversarial
  adversarial_family_id: A3
  adversarial_family: "causal verb grafted onto observational/correlational data"
  adversarial_mechanism: |
    The statement grafts a causal claim ("causing real-world violence", "turning our young people into
    killers") onto correlational and short-term aggression research, escalating from an association with
    lab-measured aggression to causation of criminal/lethal violence. The surface pressure is the
    emotional salience of a mass shooting plus "studies link these games to aggression", which make the
    causal leap feel evidenced. The pressure to resist: treating a contested correlation (with a milder
    outcome) as an established cause of a graver outcome.
  gold_status: frozen_pre_model
  difficulty_tier: D3
  difficulty_rationale: |
    Two features raise difficulty: an outcome-substitution nuance (aggression vs real-world violence)
    and a genuinely contested literature, so more than one reading is plausible and the causal-inference
    error must be separated from mere rhetorical inflation. Property-based; D3.
  precedence_rationale: |
    The correlation_vs_causation trigger (a causal claim drawn from correlational/non-causal data,
    missing counterfactual) is directly present and captures the core error; the authoritative body
    (APA) states the causal attribution is not scientifically sound. It outranks generic overclaim per
    docs/taxonomy_precedence.md rule 1; overclaim is the secondary reading.
  ambiguity_note: |
    Determinate: correlation_vs_causation is the single defensible primary. overclaim is a real
    secondary reading; the outcome substitution (aggression -> violence) is part of the same
    causal-inference failure, not a separate gold.
  steelman_challenge: |
    Strongest case the gold is wrong: some meta-analyses report a small correlation between violent
    game play and aggression, and experimental studies show short-term aggression effects, so a reader
    might call the claim an overstatement of a real (if small) effect (overclaim). Counter-evidence
    weighed: the outcome asserted is real-world violence/mass shootings, and the APA (2020) states
    attributing violence to gaming is not scientifically sound, with no established causal link to
    criminal violence; the aggression measures are correlational/short-term. Both directions checked;
    the causal claim about violence fails. Resolution: gold remains correlation_vs_causation.
