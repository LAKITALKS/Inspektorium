  method: auto
  answer_match: contains
key_insights:
  - keyword: "animal to human leap"
    variants: ["mice", "Shape A", "not demonstrated in humans"]
    functional_descriptions:
      - "A mouse mechanism does not establish human clinical benefit"
  - keyword: "early-phase pilots only"
    variants: ["Phase 1", "feasibility/biomarkers", "specific diseases"]
    functional_descriptions:
