id: P7A-BND-013
title: "Boundary: 'everyone over 60 should take daily aspirin' (population over-generalization + harms omission)"
domain: study_forensics
difficulty: hard
task_type: study_forensics
task_family: overclaim
trap_type: population_overgeneralization
ambiguity_level: medium
prompt: |
  A health column advises: "Everyone over 60 should take a low-dose aspirin every day — it prevents heart attacks and strokes and could save your life. There's no reason not to."

  The best evidence in this population is the ASPREE randomized trial (New England Journal of Medicine 2018), which enrolled about 19,114 community-dwelling healthy older adults (mostly 70+) WITHOUT established cardiovascular disease. Daily low-dose aspirin did NOT significantly reduce cardiovascular events (hazard ratio 0.95; 95% CI 0.83-1.08) but significantly increased major hemorrhage (hazard ratio 1.38; 95% CI 1.18-1.62) and was associated with higher all-cause mortality. On the basis of ASPREE and similar primary-prevention trials, the US Preventive Services Task Force (2022) recommends AGAINST initiating low-dose aspirin for primary prevention of cardiovascular disease in adults aged 60 and older. (Aspirin's benefit is established mainly for SECONDARY prevention — people who already have cardiovascular disease.)
context: |
  Evidence tier: a large primary-prevention RCT plus a guideline recommendation. Aspirin's genuine
  benefit is in SECONDARY prevention; the column generalizes it to ALL healthy adults over 60, where
  RCT evidence shows no net cardiovascular benefit and net harm (bleeding), and omits the harms. The
  defect is population over-generalization + harms omission + false certainty = overclaim. There is
  no causal-from-observational error (this is RCT evidence) and no animal/mechanism leap.
expected_answer: "overclaim"
reference_solution: |
  The column extends aspirin's established SECONDARY-prevention benefit to ALL healthy adults over 60,
  a primary-prevention population where the ASPREE RCT shows no significant cardiovascular benefit and
  a significant increase in major bleeding (and the USPSTF recommends against it). It also omits the
  harms and asserts false certainty ("no reason not to"). This is population over-generalization and
  harms omission — the framing exceeds the evidence = overclaim. It is not correlation_vs_causation
  (the evidence is randomized) and not mechanism_vs_evidence (no animal/mechanism leap).
gold_label: overclaim
gold_confidence: high
gold_case_type: clear
gold_justification: |
  1. What the claim asserts: every adult over 60 should take daily aspirin to prevent heart
     attacks/strokes; "no reason not to."
  2. What the evidence establishes: in healthy older adults (primary prevention), aspirin does not
     significantly reduce CV events (HR 0.95) but significantly increases major hemorrhage (HR 1.38);
     USPSTF (2022) recommends against initiating it for primary prevention at >=60. Benefit is
     established mainly for secondary prevention.
  3. Mismatch: a benefit real only in a specific (secondary-prevention) population is generalized to
     everyone over 60, and the bleeding harms are omitted.
  4. Frozen label triggered: overclaim — unsupported population generalization + harms omission +
     certainty inflation; the framing exceeds the evidence.
  5. Why solid is tempting: aspirin genuinely prevents cardiovascular events in some people
     (secondary prevention), so the claim contains a kernel of truth.
  6. Why solid is rejected: the claim's scope (everyone over 60, healthy included) and certainty
     ("no reason not to") exceed what the evidence supports for that population, where net effect is
     harmful. A partially-true claim generalized beyond its evidence is overclaim, not solid.
  7. What would change the classification: restricting the advice to people with established
     cardiovascular disease and noting bleeding risk would make it solid; there is no causal-inference
     or mechanism structure to move it to a specific label.
gold_alternative_reading: |
  Alternative: solid. Strongest reason to consider it: aspirin does prevent cardiovascular events in
  secondary-prevention patients, so the claim is not baseless. It loses because the claim
  over-generalizes that benefit to all healthy adults over 60 (where RCTs show net harm) and omits
  the bleeding risk and the guideline against it — the framing exceeds the evidence, which is
  overclaim.
gold_summary: |
  A column tells everyone over 60 to take daily aspirin with "no reason not to." In healthy older
  adults the ASPREE RCT shows no CV benefit and more major bleeding, and USPSTF recommends against
  it; benefit is mainly secondary prevention. Over-generalization + harms omission = overclaim (not
  correlation or mechanism).
curator_notes: |
  Boundary family B3 (solid <-> overclaim), overclaim direction. Sourced from ASPREE (NEJM 2018) and
  the USPSTF 2022 recommendation. Deliberately free of causal-inference or mechanism structure so the
  failure is a clean solid/overclaim boundary (population over-generalization). Direct contrast with
  P7A-BND-012 (SPRINT), which stays scoped. Gold frozen before any model output.
expected_findings:
  - finding: population_overgeneralization
    severity: major
    confidence: high
    note: "Secondary-prevention benefit generalized to all healthy adults over 60"
  - finding: harms_omitted
    severity: major
    confidence: high
    note: "Major-bleeding increase (HR 1.38) and the guideline against primary-prevention use are omitted"
  - finding: certainty_inflation
    severity: moderate
    confidence: high
    note: "'No reason not to' asserts false certainty against RCT/guideline evidence"
gold_evidence_spans:
  - span: "Everyone over 60 should take a low-dose aspirin every day"
    why_it_matters: "Generalizes a scoped benefit to a population where RCTs show net harm."
    supports_finding: population_overgeneralization
  - span: "There's no reason not to"
    why_it_matters: "Omits the significant bleeding harm and the guideline recommending against it."
    supports_finding: harms_omitted
evaluation:
  method: auto
  answer_match: contains
key_insights:
  - keyword: "primary vs secondary prevention"
    variants: ["healthy adults", "established CVD", "ASPREE"]
    functional_descriptions:
      - "Aspirin's benefit is for secondary prevention, not all healthy older adults"
  - keyword: "harms omitted"
    variants: ["major bleeding", "hemorrhage", "USPSTF against"]
    functional_descriptions:
      - "The claim omits net harm in the generalized population"
common_errors:
  - accepting a kernel-of-truth claim as solid
  - missing the primary/secondary-prevention distinction
  - ignoring omitted bleeding harms
expected_failure_modes:
  - overclaim_read_as_solid
  - population_overgeneralization
discriminative_dimensions:
  - correctness
  - insight_depth
diagnostic_focus: "Can the agent see that generalizing a scoped benefit and omitting harms is overclaim, not solid?"
