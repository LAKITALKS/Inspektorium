  boundary: "solid <-> overclaim"
  gold_status: frozen_pre_model
  difficulty_tier: D3
  difficulty_rationale: |
    Two plausible labels and a subtle discriminator: the claim contains a real kernel (secondary-
    prevention benefit), so distinguishing over-generalization (overclaim) from a defensible scoped
    claim (solid) requires the primary/secondary-prevention distinction and attention to omitted
    harms. Property-based tagging.
  precedence_rationale: |
    No specific-label trigger is present (randomized evidence rules out correlation_vs_causation; no
    animal/mechanism pathway rules out mechanism_vs_evidence). The failure is generic: framing exceeds
    the evidence via population over-generalization + harms omission = overclaim vs the tempting solid.
  ambiguity_note: |
    Determinate: overclaim is the single defensible primary; solid is tempting only because the claim
    is partially true for a different (secondary-prevention) population.
  steelman_challenge: |
    Strongest case the gold is wrong: aspirin genuinely prevents events in secondary prevention, so a
    reviewer might call the claim solid. Counter-evidence weighed: ASPREE shows no CV benefit and more
    major bleeding in healthy older adults, and USPSTF recommends against primary-prevention use at
    >=60; the claim generalizes beyond the evidence and omits harms. Resolution: gold remains overclaim.
