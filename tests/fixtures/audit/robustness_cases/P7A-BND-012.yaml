  robustness_case_id: P7A-BND-012
  case_family: boundary
  boundary_family_id: B3
  boundary: "solid <-> overclaim"
  gold_status: frozen_pre_model
  difficulty_tier: D3
  difficulty_rationale: |
    Two plausible labels and a subtle call: dramatic effect sizes plus a live clinical debate about
    BP targets pull toward overclaim, but the report is faithful and caveated. Distinguishing honest
    mixed reporting from inflation requires care. Property-based tagging.
  precedence_rationale: |
    overclaim requires framing that exceeds the evidence. Here harms, early stop, and generalizability
    limits are reported and the claim is bounded to the studied population, so no overclaim trigger
    exists; the honest-reporting definition of solid governs.
  ambiguity_note: |
    Determinate: solid is the single defensible primary; overclaim is tempting via dramatic figures
    and the BP-target debate but there is no actual claim/evidence mismatch.
  steelman_challenge: |
    Strongest case the gold is wrong: 25%/27% reductions plus a contested clinical topic could be read
    as selective/overclaimed. Counter-evidence weighed: the briefing reports the harms, the early
    termination, and the generalizability limits and stays within the trial population; nothing is
    inflated. Resolution: gold remains solid.
