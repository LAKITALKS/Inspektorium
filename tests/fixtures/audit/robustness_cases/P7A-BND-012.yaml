id: P7A-BND-012
title: "Boundary: SPRINT intensive BP control reported with population scope and harms (honest)"
domain: study_forensics
difficulty: hard
task_type: study_forensics
task_family: solid
trap_type: faithful_scoped_mixed_result
ambiguity_level: low
prompt: |
  A cardiology briefing states: "In SPRINT, a randomized trial of 9,361 adults at increased cardiovascular risk but WITHOUT diabetes or prior stroke, treating to a systolic blood-pressure target below 120 mm Hg (versus below 140) reduced major cardiovascular events by about 25% and all-cause death by about 27%. However, intensive treatment also increased the rates of hypotension, fainting, electrolyte abnormalities, and acute kidney injury, and the trial was stopped early — so the benefits must be weighed against these harms and may not generalize to people with diabetes, prior stroke, or those not represented in the trial."

  The source is the SPRINT Research Group (New England Journal of Medicine 2015). The briefing reports the population (high-risk, non-diabetic, no prior stroke), design (RCT), comparator (<140 target), endpoints (major CV events; all-cause mortality), direction and magnitude (~25% and ~27% relative reductions), the increased adverse events, the early stop, and the limits on generalizability.
context: |
  Evidence tier: a large randomized controlled trial with clinical endpoints. The briefing reports
  both the benefit AND the harms, keeps the claim within the studied population, and flags the early
  stop and generalizability limits. This is the "mixed results reported without inflating" pattern
  for solid. The temptation is to call it overclaim (the 25%/27% figures sound dramatic, or one might
  feel BP targets are contested), but the reporting is faithful and appropriately caveated.
expected_answer: "solid"
reference_solution: |
  The briefing states SPRINT's results accurately and honestly: it gives the benefit (~25% fewer
  major CV events, ~27% lower mortality), the harms (more hypotension, syncope, electrolyte
  abnormalities, acute kidney injury), the early termination, the studied population (high-risk,
  non-diabetic, no prior stroke), and the limits on generalizability. Claim strength matches evidence
  strength, with harms and scope acknowledged = solid. Because the framing does not exceed the
  evidence, it is not overclaim.
gold_label: solid
gold_confidence: high
gold_case_type: clear
gold_justification: |
  1. What the claim asserts: within a defined high-risk population, an intensive BP target reduced CV
     events (~25%) and death (~27%) but increased specific harms and was stopped early, with limited
     generalizability.
  2. What the evidence establishes: exactly this — SPRINT reported those benefits, those harms, the
     early stop, and enrolled high-risk adults without diabetes or prior stroke.
  3. Mismatch: none material — benefit, harms, population, comparator, endpoints, and uncertainty are
     all reported faithfully.
  4. Frozen label triggered: solid — honest reporting of a beneficial-but-mixed result with harms and
     scope acknowledged.
  5. Why overclaim is tempting: the 25%/27% reductions are eye-catching, and BP targets are debated,
     so a reviewer may reflex to overclaim.
  6. Why overclaim is rejected: overclaim requires the framing to exceed the evidence; here the
     briefing reports harms, the early stop, and generalizability limits, and stays within the
     studied population — nothing is inflated (docs/study_forensics_taxonomy.md 'solid').
  7. What would change the classification: dropping the harms/scope and recommending intensive
     targets for everyone (incl. diabetics/stroke patients) would make it overclaim (see the aspirin
     contrast, P7A-BND-013).
gold_alternative_reading: |
  Alternative: overclaim. Strongest reason to consider it: the ~25%/27% reductions are dramatic and
  intensive BP targeting is clinically debated, so one might suspect inflation or selective emphasis.
  It loses because the briefing explicitly reports the harms, the early stop, and generalizability
  limits and bounds the claim to the studied population — the framing does not exceed the evidence.
gold_summary: |
  A briefing reports SPRINT faithfully: ~25% fewer CV events and ~27% lower mortality from an
  intensive BP target in high-risk non-diabetic adults, WITH the added harms, early stop, and
  generalizability limits. Honest mixed reporting = solid; the dramatic figures make overclaim
  tempting but wrong.
curator_notes: |
  Boundary family B3 (solid <-> overclaim), solid direction. Sourced from the SPRINT Research Group
  (NEJM 2015). Chosen as an honest 'benefit + harms + scope' report to exercise the solid definition
  beyond mere citation presence, and to contrast directly with P7A-BND-013 (aspirin), which
  over-generalizes a scoped benefit. Gold frozen before any model output.
expected_findings:
  - finding: benefit_and_harms_reported
    severity: none
    confidence: high
    note: "Both the CV/mortality benefit and the increased adverse events are stated"
  - finding: scope_and_uncertainty_acknowledged
    severity: none
    confidence: high
    note: "Population bounded; early stop and generalizability limits flagged"
gold_evidence_spans:
  - span: "intensive treatment also increased the rates of hypotension, fainting, electrolyte abnormalities, and acute kidney injury"
    why_it_matters: "Harms are reported alongside benefit — the honest-reporting signal for solid."
    supports_finding: benefit_and_harms_reported
  - span: "may not generalize to people with diabetes, prior stroke, or those not represented in the trial"
    why_it_matters: "Scope and uncertainty acknowledged; the claim is not overextended."
    supports_finding: scope_and_uncertainty_acknowledged
evaluation:
  method: auto
  answer_match: contains
key_insights:
  - keyword: "benefit and harms both reported"
    variants: ["mixed result", "not inflated", "harms acknowledged"]
    functional_descriptions:
      - "Reporting harms alongside benefit within scope is the solid signal"
  - keyword: "generalizability bounded"
    variants: ["population defined", "early stop", "uncertainty"]
    functional_descriptions:
      - "Claim stays within the studied high-risk, non-diabetic population"
common_errors:
  - labelling dramatic-but-faithful figures overclaim
  - ignoring that harms and scope are acknowledged
  - importing a general BP-target debate into a faithful report
expected_failure_modes:
  - solid_to_overclaim
  - dramatic_number_distrust
discriminative_dimensions:
  - correctness
  - insight_depth
diagnostic_focus: "Can the agent recognize an honestly caveated, scoped mixed-result report as solid rather than overclaim?"
