    severity: major
    confidence: high
    note: "Cerebral blood flow (surrogate/mechanism) sold as memory protection and dementia prevention (clinical outcomes)"
  - finding: claim_contradicted_by_rct
    severity: major
    confidence: high
    note: "GEM (JAMA 2008) and GuidAge RCTs show no reduction in dementia/Alzheimer's incidence"
  - finding: mechanism_as_proof_of_benefit
    severity: moderate
    confidence: high
    note: "A real blood-flow mechanism is invoked as if it were proof of a cognitive/dementia benefit"
gold_evidence_spans:
  - span: "By boosting cerebral circulation it sharpens your memory and protects you against age-related cognitive decline and dementia"
    why_it_matters: "Frames a mechanism/surrogate (blood flow) as clinical benefits (memory, dementia prevention)."
    supports_finding: surrogate_framed_as_clinical
  - span: "did NOT reduce the incidence of dementia or Alzheimer's disease"
    why_it_matters: "The direct human RCT outcome that contradicts the clinical claim and rules out a preclinical-only reading."
    supports_finding: claim_contradicted_by_rct
