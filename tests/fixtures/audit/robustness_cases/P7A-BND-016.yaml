id: P7A-BND-016
title: "Boundary: ginkgo 'increases blood flow to the brain, so it protects your memory and prevents dementia' (mechanism + surrogate framed as clinical benefit)"
domain: study_forensics
task_type: study_forensics
difficulty: hard
task_family: overclaim
trap_type: surrogate_endpoint_overclaim
ambiguity_level: medium
prompt: |
  A brain-supplement label claims: "Ginkgo biloba increases blood flow to your brain, delivering the oxygen and nutrients your neurons need. By boosting cerebral circulation it sharpens your memory and protects you against age-related cognitive decline and dementia."

  Ginkgo's proposed mechanism is real and is the basis of the marketing: ginkgo extract (EGb 761) has antioxidant and platelet-activating-factor-antagonist properties and has been reported to increase cerebral blood flow (a physiological surrogate). But the clinical outcome has been tested directly in humans. The Ginkgo Evaluation of Memory (GEM) study (DeKosky et al., JAMA 2008), a randomized, double-blind, placebo-controlled trial of 3,069 adults aged 75+ followed for a median of about six years, found that ginkgo did NOT reduce the incidence of dementia or Alzheimer's disease (277 dementia cases on ginkgo vs 246 on placebo; not significant). The GuidAge trial (Lancet Neurology 2012) likewise found no reduction in Alzheimer's over five years, and reviews find ginkgo does not reliably improve memory in healthy adults. Cerebral blood flow is a surrogate; dementia incidence and everyday memory are the clinical outcomes that matter.
context: |
  Evidence tier: a large randomized, placebo-controlled trial with a clinical endpoint (incident
  dementia), plus a second prevention RCT. Ginkgo's cerebral-blood-flow / antioxidant MECHANISM is
  real and is materially invoked, and a physiological SURROGATE (blood flow) is claimed — but the
  CLINICAL outcome (dementia prevention, memory) was tested directly in humans and not supported.
  The label sells the mechanism + surrogate as the clinical benefit. Under the frozen taxonomy this
  "Shape B" surrogate-to-clinical framing routes to overclaim, not mechanism_vs_evidence.
expected_answer: "overclaim"
reference_solution: |
  Ginkgo has a real, marketed mechanism (increased cerebral blood flow, antioxidant/PAF-antagonist
  activity) and a physiological surrogate, but the clinical claim — protects memory and prevents
  dementia — was tested head-on in randomized human trials (GEM, GuidAge) and NOT supported. Selling
  the mechanism and surrogate as the clinical benefit is a surrogate-framed-as-clinical-outcome
  overclaim; the claim also directly contradicts the human RCT evidence. Under the frozen taxonomy,
  surrogate-to-clinical ("Shape B") routes to overclaim. It is not mechanism_vs_evidence: that label
  is for a described animal/preclinical pathway extrapolated to a human benefit with no direct human
  outcome data; here direct human outcome trials exist (and are contradicted), so the failure is
  inflation of a surrogate/mechanism against human clinical data = overclaim.
gold_label: overclaim
gold_confidence: high
gold_case_type: clear
gold_justification: |
  1. What the claim asserts: because ginkgo increases blood flow to the brain (a mechanism), it
     sharpens memory and prevents age-related cognitive decline and dementia (a clinical benefit).
  2. What the evidence establishes: the mechanism/surrogate (cerebral blood flow) is real and
     invoked, but randomized human trials (GEM, GuidAge) show no reduction in dementia/Alzheimer's
     incidence and no reliable memory benefit in healthy adults.
  3. Mismatch: a mechanism plus a physiological surrogate is presented as a clinical benefit that
     direct human trials do not support (and contradict).
  4. Frozen label triggered: overclaim — a surrogate/mechanism framed as a clinical benefit
     (rhetorical inflation); per docs/study_forensics_taxonomy.md this "Shape B" routes to overclaim.
  5. Why mechanism_vs_evidence is tempting: the cerebral-blood-flow mechanism is real and is the
     explicit rhetorical basis of the claim, so the mechanism boundary looks directly relevant.
  6. Why precedence rejects it as primary: mechanism_vs_evidence applies when a described animal/
     preclinical PATHWAY is extrapolated to a human benefit with NO direct human outcome data. Here
     the human clinical outcome (dementia incidence, memory) has been tested directly in RCTs and not
     supported; the decisive gap is surrogate/mechanism-to-clinical against existing human data, which
     the taxonomy routes to overclaim (Shape B; docs/taxonomy_precedence.md; case054 precedent).
  7. What would change the classification: had the label said "may increase cerebral blood flow but
     has not been shown to prevent dementia or improve memory," it would be solid; had it rested only
     on an animal blood-flow model with no human trials, mechanism_vs_evidence could apply.
gold_alternative_reading: |
  Alternative: mechanism_vs_evidence. Plausible because ginkgo's cerebral-blood-flow / antioxidant
  mechanism is real and is the explicit basis of the claim. It loses under precedence because this is
  not a preclinical-only extrapolation: the human clinical outcome (dementia, memory) was tested
  directly in RCTs (GEM, GuidAge) and not supported, so the failure is a surrogate/mechanism inflated
  against human clinical data. The taxonomy routes surrogate-to-clinical ("Shape B") to overclaim.
gold_summary: |
  Ginkgo's real cerebral-blood-flow mechanism and surrogate are sold as memory protection and
  dementia prevention, but randomized human trials (GEM, GuidAge) show no dementia reduction and no
  reliable memory benefit. Mechanism + surrogate framed as clinical benefit = overclaim (Shape B),
  not mechanism_vs_evidence, because direct human outcome trials exist and are contradicted.
curator_notes: |
  Boundary family B2 (overclaim <-> mechanism_vs_evidence), overclaim direction. Independent
  replacement for retired P7A-BND-008; supersedes it. Unlike 008 (vitamin C, where no described
  mechanism did rhetorical work), here a described mechanism — increased cerebral blood flow — is the
  explicit rhetorical basis, so mechanism_vs_evidence is a genuine attractor; but frozen Shape-B
  routing (surrogate/mechanism framed as a clinical benefit, contradicted by direct human RCTs) keeps
  overclaim primary. Distinct from P7A-BND-006 (bone/BMD) and P7A-BND-015 (oncology/PFS): different
  agent (herbal cognitive supplement), different surrogate (cerebral blood flow), neuro domain.
  Sourced from ginkgo memory-supplement marketing + GEM (JAMA 2008). Gold frozen before any model
  output.
