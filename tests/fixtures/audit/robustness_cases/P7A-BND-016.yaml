key_insights:
  - keyword: "surrogate endpoint"
    variants: ["cerebral blood flow", "mechanism", "not dementia incidence"]
    functional_descriptions:
      - "Blood flow is a surrogate; dementia incidence and everyday memory are the clinical outcomes"
  - keyword: "Shape B routes to overclaim"
    variants: ["surrogate-to-clinical", "not mechanism_vs_evidence", "human RCT exists"]
    functional_descriptions:
      - "A real mechanism/surrogate framed as clinical benefit is overclaim, not a preclinical-to-human leap"
common_errors:
  - labelling a blood-flow / antioxidant mechanism claim mechanism_vs_evidence
  - accepting increased cerebral blood flow as proof of memory/dementia benefit
  - missing that RCTs tested dementia prevention directly and found none
