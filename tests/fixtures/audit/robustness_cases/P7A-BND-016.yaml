robustness:
  robustness_case_id: P7A-BND-016
  case_family: boundary
  boundary_family_id: B2
  boundary: "overclaim <-> mechanism_vs_evidence"
  gold_status: frozen_pre_model
  difficulty_tier: D2
  difficulty_rationale: |
    One primary (overclaim) plus a genuine alternate (mechanism_vs_evidence, invited by the real
    cerebral-blood-flow mechanism that is the explicit basis of the claim); precedence decides via
    Shape-B routing. Evidence-tier nuance (surrogate/mechanism vs a clinical RCT endpoint that was
    tested directly and not supported). Property-based tagging.
  precedence_rationale: |
    mechanism_vs_evidence requires a described animal/preclinical pathway extrapolated to a human
    benefit with no direct human outcome evidence. Here the human clinical outcome (dementia
    incidence, memory) was tested directly in RCTs (GEM, GuidAge) and not supported, so the decisive
    gap is a surrogate/mechanism inflated against human clinical data. The taxonomy routes this
    surrogate-to-clinical gap ("Shape B") to overclaim (docs/taxonomy_precedence.md; case054).
    Primary = overclaim.
  ambiguity_note: |
    Determinate: overclaim is the single defensible primary under the frozen Shape-B routing;
    mechanism_vs_evidence is a genuine but documented-and-rejected alternative (the mechanism is real
    and invoked, but direct human clinical trials exist and are contradicted).
  steelman_challenge: |
    Strongest case the gold is wrong: ginkgo's cerebral-blood-flow / antioxidant mechanism is real and
    is the explicit rhetorical basis, so the claim could be read as a mechanism-to-human leap
    (mechanism_vs_evidence). Counter-evidence weighed: this is not a preclinical-only extrapolation —
    randomized human trials (GEM 2008, GuidAge 2012) tested the clinical outcome (dementia, memory)
    directly and found no benefit; the failure is a surrogate/mechanism inflated against human clinical
    data. The taxonomy routes surrogate-to-clinical to overclaim (Shape B; case054 precedent).
    Resolution: gold remains overclaim.
