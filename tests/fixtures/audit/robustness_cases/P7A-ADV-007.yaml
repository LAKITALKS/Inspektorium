robustness:
  robustness_case_id: P7A-ADV-007
  case_family: adversarial
  adversarial_family_id: A4
  adversarial_family: "subgroup -> general-population generalization"
  adversarial_mechanism: |
    A benefit that is real and important for a specific subgroup (celiac disease, ~1%) is generalized to
    the entire population ("everyone should cut gluten"). The surface pressure is that the subgroup
    benefit is genuinely true and medically endorsed, lending credibility to the generalization, plus a
    pseudo-mechanistic 'inflammation' framing. The pressure to resist: extrapolating a subgroup-specific
    benefit to an unstudied general population where evidence shows no benefit.
  gold_status: frozen_pre_model
  difficulty_tier: D2
  difficulty_rationale: |
    One primary (overclaim) with one genuinely plausible alternate (solid, invited by the real celiac
    benefit); recognising the subgroup-to-general extrapolation decides it. No competing specific
    trigger and a single dominant defect keep it at D2. Property-based.
  precedence_rationale: |
    No specific-label trigger is present: no observational dataset is read causally (rules out
    correlation_vs_causation) and no animal/preclinical mechanism is the basis (rules out
    mechanism_vs_evidence). The defect is generalization beyond the evidenced population = overclaim,
    per docs/taxonomy_precedence.md (extrapolation to unstudied populations is an overclaim signal).
  ambiguity_note: |
    Determinate: overclaim is the single defensible primary; solid is tempting only because the claim
    is true for the celiac subgroup, not for the general population it addresses.
  steelman_challenge: |
    Strongest case the gold is wrong: gluten-free eating is genuinely necessary and effective for celiac
    disease and helps diagnosed non-celiac gluten sensitivity, so a reader might call the claim solid
    or merely cautious. Counter-evidence weighed: reviews find no experimental evidence of benefit for
    people without a gluten-related disorder and note risks (nutritional deficiencies, cost), and celiac
    is ~1% of people; the claim addresses "everyone". Resolution: the subgroup-to-general extrapolation
    exceeds the evidence for the population addressed; gold remains overclaim.
