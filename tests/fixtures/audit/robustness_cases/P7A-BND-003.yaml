robustness:
  robustness_case_id: P7A-BND-003
  case_family: boundary
  boundary_family_id: B1
  boundary: "overclaim <-> correlation_vs_causation"
  gold_status: frozen_pre_model
  difficulty_tier: D3
  difficulty_rationale: |
    >=2 plausible labels and a subtle discriminator: prediction vs causation. The observational
    marker strongly invites correlation_vs_causation, and separating "best predictor" overreach from
    a causal error requires care; large claim-evidence distance. Property-based tagging.
  precedence_rationale: |
    correlation_vs_causation requires a causal claim from a non-causal design. The claim is
    predictive, not causal (no intervention, no "grip causes longevity"), so the specific trigger is
    absent. The defect is inflated superiority/magnitude/individual-forecast = generic overclaim,
    which remains primary under docs/taxonomy_precedence.md.
  ambiguity_note: |
    Difficult but determinate: overclaim is the single defensible primary; correlation_vs_causation
    is tempting because the marker is observational but is not the disputed step (prediction != cause).
  steelman_challenge: |
    Strongest case the gold is wrong: grip strength is a confounded marker of illness/frailty, so a
    reviewer could call the whole claim correlation_vs_causation. Counter-evidence weighed: the claim
    never asserts causation or an intervention; PURE explicitly frames grip as prognostic. The
    checkable overreach is superiority + individual forecast, independent of any causal question.
    Resolution: gold remains overclaim.
