id: P7A-ADV-001
title: "Adversarial A1: Airborne 'clinically proven' cold prevention (decorative citation to a non-probative study)"
domain: study_forensics
difficulty: hard
task_type: study_forensics
task_family: overclaim
trap_type: decorative_citation
ambiguity_level: low
prompt: |
  A supplement label and its advertising state: "Airborne is clinically proven to help prevent colds. In a double-blind, placebo-controlled study, Airborne was shown to help your body combat germs — created by a schoolteacher who was sick of catching colds."

  The cited "double-blind, placebo-controlled study" was conducted by GNG Pharmaceutical Services, a two-person company set up specifically to run the Airborne trial; it had no clinic, employed no qualified scientists or physicians, and the work was never published in a peer-reviewed journal. The US Federal Trade Commission concluded there was no competent and reliable scientific evidence that Airborne prevents or reduces the risk of colds, and the marketers settled deceptive-advertising charges (2008; $30 million in total settlement funds).
context: |
  Evidence tier: a regulator's evidence assessment (FTC) plus the documented character of the cited
  "study". The claim carries a citation ("clinically proven", "double-blind, placebo-controlled
  study") that lends an appearance of scientific support, but the cited study is non-probative — it
  was not a legitimate controlled trial. The defect is rhetorical inflation dressed with a decorative
  citation: overclaim. There is no described biological mechanism and no observational-to-causal
  structure; the load-bearing move is the empty appeal to a "clinical study".
expected_answer: "overclaim"
reference_solution: |
  The claim advertises "clinical proof" and a "double-blind, placebo-controlled study" to support cold
  prevention, but the cited study was run by a two-person outfit with no clinic, scientists, or
  physicians and was never peer-reviewed; the FTC found no competent and reliable scientific evidence
  for the claim. The citation is decoration — it does not support the proposition. A conclusion sold as
  scientifically proven when the underlying evidence is absent is rhetorical inflation = overclaim. It
  is not mechanism_vs_evidence (no biological mechanism is described) or correlation_vs_causation (no
  observational dataset is over-interpreted).
gold_label: overclaim
gold_confidence: high
gold_case_type: clear
gold_justification: |
  1. Exact proposition: Airborne is clinically proven, via a double-blind placebo-controlled study, to
     help prevent colds.
  2. What the strongest evidence establishes: the FTC found no competent and reliable scientific
     evidence supporting cold prevention; the cited study was not a legitimate controlled trial (GNG
     Pharmaceutical Services, no clinic/scientists/physicians, unpublished).
  3. Adversarial surface feature: the words "clinically proven" and "double-blind, placebo-controlled
     study" signal scientific backing and can lead a shallow reader to treat the claim as evidenced.
  4. Actual forensic mismatch: the citation is non-probative; it does not establish the outcome. The
     claim's strength (proven prevention) is supplied by rhetoric, not by the cited study.
  5. Primary frozen label: overclaim — a conclusion framed as scientifically proven that exceeds the
     (absent) evidence.
  6. Why: overclaim is the generic rhetorical-inflation category, and here the inflation is the entire
     defect; the citation adds authority without support.
  7. Strongest competing label: solid — if the cited study were a real, adequate trial, faithful
     reporting of it could be solid.
  8. Why it loses: the study is non-probative and the regulator found no reliable evidence, so nothing
     the claim asserts is actually supported; a proof-claim without proof is overclaim, not solid.
  9. What would change the verdict: a genuine, adequately powered, peer-reviewed RCT showing Airborne
     prevents colds would move faithful reporting of it toward solid.
gold_alternative_reading: |
  Alternative: solid. Strongest good-faith version: the ad names a specific double-blind,
  placebo-controlled study, which superficially looks like exactly the evidence tier a solid claim
  needs. It loses because that study was not a legitimate trial (no clinic, no scientists, unpublished)
  and the FTC found no competent and reliable scientific evidence; the citation is decorative and
  non-probative, so the proof-claim is unsupported = overclaim.
gold_summary: |
  Airborne advertised "clinically proven" cold prevention citing a "double-blind, placebo-controlled
  study" that was run by a two-person firm with no clinic or scientists and never published; the FTC
  found no reliable supporting evidence. A decorative citation dressing an unsupported proof-claim =
  overclaim (not mechanism or correlation).
curator_notes: |
  Adversarial family A1 (decorative citation: citation present, does not support the claim). Real
  public claim documented by the FTC 2008 deceptive-advertising action against Airborne Health.
  Distinct proposition from all Boundary/Class-A cases (cold-prevention supplement + non-probative
  clinical-study citation). Gold frozen before any model output.
