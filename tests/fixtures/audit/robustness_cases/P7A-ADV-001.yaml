  adversarial_family: "decorative citation (citation present, does not support the claim)"
  adversarial_mechanism: |
    The claim carries an authoritative-sounding citation ("clinically proven", "a double-blind,
    placebo-controlled study"), but the cited study is non-probative — a two-person firm with no
    clinic/scientists, never peer-reviewed, and the FTC found no reliable supporting evidence. The
    surface pressure is that the presence of a "clinical study" invites a shallow evaluator to treat
    the proposition as evidenced. The pressure the model must resist: mistaking a decorative citation
    for genuine support.
  gold_status: frozen_pre_model
  difficulty_tier: D2
  difficulty_rationale: |
    One primary (overclaim) with one genuinely plausible alternate (solid, invited by the explicit
    "double-blind study" citation); recognising the cited study is non-probative decides it. Low
    number of competing failure modes and no mechanism/causal structure keep it at D2. Property-based.
  precedence_rationale: |
    No specific-label trigger is present: there is no described biological mechanism (rules out
    mechanism_vs_evidence) and no observational dataset being read causally (rules out
    correlation_vs_causation). The defect is generic rhetorical inflation supported by a non-probative
    citation, so the primary stays overclaim per docs/taxonomy_precedence.md (residual/generic rule).
  ambiguity_note: |
    Determinate: overclaim is the single defensible primary; solid is tempting only if the cited study
    is credited, which the FTC finding and the study's character rule out.
  steelman_challenge: |
    Strongest case the gold is wrong: the ad cites a specific double-blind, placebo-controlled study,
    the exact design a solid claim would rest on, so a good-faith reader could call it solid.
    Counter-evidence weighed: the study was run by GNG Pharmaceutical Services (no clinic, no
    scientists, unpublished) and the FTC found no competent and reliable scientific evidence for cold
    prevention; searching for supporting evidence returns none. Resolution: the citation is decorative
    and non-probative, so gold remains overclaim.
