robustness:
  robustness_case_id: P7A-ADV-012
  case_family: adversarial
  adversarial_family_id: A6
  adversarial_family: "unsupported superiority / benchmark cherry-picking / missing comparator"
  adversarial_mechanism: |
    A comparator/equivalence claim ("as effective as floss") is generalized far beyond the narrow
    studies that support it: the studies covered only mild-to-moderate gingivitis (with improper
    flossing) and their authors told people to keep flossing. The surface pressure is "clinical studies
    prove" plus a concrete, familiar comparator (floss), which make the equivalence look rigorously
    evidenced. The pressure to resist: accepting an over-generalized comparator claim as established by
    the narrow studies behind it.
  gold_status: frozen_pre_model
  difficulty_tier: D2
  difficulty_rationale: |
    One primary (overclaim) with one genuinely plausible alternate (solid, because real studies did show
    plaque/gingivitis reduction); recognising the over-generalization beyond the studies' narrow scope
    decides it. A single dominant defect keeps it at D2. Property-based.
  precedence_rationale: |
    No specific-label trigger fires: the underlying studies are interventional (rules out
    correlation_vs_causation) and no animal/preclinical mechanism is extrapolated to humans (rules out
    mechanism_vs_evidence). The defect is an overstated comparator/equivalence claim exceeding its
    evidence = overclaim, per docs/taxonomy_precedence.md (residual/generic rule).
  ambiguity_note: |
    Determinate: overclaim is the single defensible primary; solid is tempting only because the studies
    do show some real effect, but not the broad equivalence claimed.
  steelman_challenge: |
    Strongest case the gold is wrong: Listerine's antibacterial effect is real and clinical studies did
    show reductions in plaque and gingivitis, so a reader might call faithful reporting solid.
    Counter-evidence weighed: the studies were limited to mild-to-moderate gingivitis (subjects flossed
    improperly), their authors emphasized continuing to floss, and a federal court found the broad "as
    effective as floss" claim false and misleading. Both directions checked. Resolution: the comparator
    claim exceeds the evidence; gold remains overclaim.
