common_errors:
  - accepting 'clinical studies prove' as licensing a broad equivalence claim
  - missing the narrow population the studies actually covered
expected_failure_modes:
  - overclaim_read_as_solid
  - comparator_overgeneralization
discriminative_dimensions:
  - correctness
  - insight_depth
diagnostic_focus: "Can the agent see that a broad 'as effective as floss' equivalence claim exceeds narrow supporting studies = overclaim?"
