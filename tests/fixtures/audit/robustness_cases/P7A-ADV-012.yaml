id: P7A-ADV-012
title: "Adversarial A6: Listerine 'clinically proven as effective as floss' (comparator claim over-generalized beyond the studies)"
domain: study_forensics
difficulty: hard
task_type: study_forensics
task_family: overclaim
trap_type: unsupported_superiority_missing_comparator
ambiguity_level: low
prompt: |
  A Listerine advertising campaign claims: "Clinical studies prove Listerine antiseptic mouthwash is as effective as floss at fighting plaque and gingivitis between the teeth. Why floss? Just rinse."

  In litigation over this campaign, a federal court (McNeil-PPC, Inc. v. Pfizer Inc., S.D.N.Y. 2005) issued a preliminary injunction, finding the "as effective as floss" claim false and misleading. The underlying studies were limited to people with only mild-to-moderate gingivitis (so the broad, unqualified claim was overbroad), the subjects had not flossed properly, and the studies' own authors had emphasized that people should continue to floss daily and did not suggest mouthwash be used instead of floss.
context: |
  Evidence tier: a comparator (floss) is present, but the equivalence claim is generalized far beyond
  what the underlying studies support. The studies covered a narrow subgroup (mild-to-moderate
  gingivitis, with questionable flossing) and their authors explicitly said not to substitute rinsing
  for flossing; a court found the broad "as effective as floss" claim false and misleading. A comparator
  claim overstated beyond the evidence is overclaim.
expected_answer: "overclaim"
reference_solution: |
  Listerine claimed to be "as effective as floss", but the underlying studies were limited to
  mild-to-moderate gingivitis (with improper flossing) and their authors said to keep flossing; a court
  enjoined the claim as false and misleading. A comparator/equivalence claim generalized beyond the
  studies that support it is overclaim. It is not correlation_vs_causation (the studies are
  interventional) or mechanism_vs_evidence (no animal/preclinical-mechanism-to-human leap is central).
gold_label: overclaim
gold_confidence: high
gold_case_type: clear
gold_justification: |
  1. Exact proposition: Listerine rinse is as effective as flossing at fighting plaque and gingivitis,
     so people can rinse instead of floss.
  2. What the strongest evidence establishes: the supporting studies were limited to mild-to-moderate
     gingivitis (with improper flossing), and their authors said to keep flossing; a court found the
     broad equivalence claim false and misleading.
  3. Adversarial surface feature: "clinical studies prove" plus a concrete comparator (floss) make the
     equivalence claim look rigorously evidenced.
  4. Actual forensic mismatch: the equivalence is generalized far beyond the narrow population and
     conditions the studies covered; the comparator claim is overstated.
  5. Primary frozen label: overclaim - a comparator/equivalence claim exceeding what the studies
     support (over-generalized population and conclusion).
  6. Why: the core defect is an overstated comparison; no specific structural trigger fires.
  7. Strongest competing label: solid - the studies did show plaque/gingivitis reduction, so the claim
     has an evidentiary basis.
  8. Why it loses: the studies do not support the broad, unqualified "as effective as floss / just
     rinse" claim (narrow subgroup, authors' caveats, court finding), so the claim exceeds the evidence
     = overclaim.
  9. What would change the verdict: broad, well-conducted trials showing rinsing equals flossing across
     the general population would make the claim solid.
gold_alternative_reading: |
  Alternative: solid. Strongest good-faith version: real clinical studies did show Listerine reduces
  plaque and gingivitis, so the claim has evidentiary support. It loses because the studies were limited
  to mild-to-moderate gingivitis (with improper flossing) and their authors said to keep flossing, and
  a court found the broad "as effective as floss" claim false and misleading - the comparator claim
  exceeds the evidence = overclaim.
gold_summary: |
  Listerine claimed to be 'as effective as floss'; the supporting studies were limited to mild-moderate
  gingivitis and their authors said to keep flossing, and a court enjoined the claim as false. A
  comparator/equivalence claim over-generalized beyond its studies = overclaim (solid tempting).
curator_notes: |
  Adversarial family A6 (unsupported superiority / benchmark cherry-picking / missing comparator;
  comparator overstatement variant). Real public claim: Pfizer's Listerine 'as effective as floss'
  campaign (2004). Evidence: McNeil-PPC v. Pfizer, 351 F. Supp. 2d 226 (S.D.N.Y. 2005) preliminary
  injunction. Distinct from A6 Nexium (P7A-ADV-011; rigged unequal-dose comparator) and all
  Boundary/Class-A cases. Gold frozen before any model output.
expected_findings:
  - finding: comparator_claim_over_generalized
    severity: major
    confidence: high
    note: "'As effective as floss' generalized beyond studies limited to mild-moderate gingivitis"
  - finding: court_found_false_and_misleading
    severity: major
    confidence: high
    note: "Federal court enjoined the claim; study authors said to keep flossing"
gold_evidence_spans:
  - span: "Listerine antiseptic mouthwash is as effective as floss at fighting plaque and gingivitis"
    why_it_matters: "A broad equivalence claim the underlying narrow studies do not support."
    supports_finding: comparator_claim_over_generalized
  - span: "the studies' own authors had emphasized that people should continue to floss daily"
    why_it_matters: "The cited studies do not support substituting rinsing for flossing."
    supports_finding: court_found_false_and_misleading
