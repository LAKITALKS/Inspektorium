  method: auto
  answer_match: contains
key_insights:
  - keyword: "over-generalized comparator"
    variants: ["as effective as floss", "mild-to-moderate gingivitis", "overbroad"]
    functional_descriptions:
      - "An equivalence claim is generalized beyond the studies' narrow scope"
  - keyword: "court finding"
