robustness:
  robustness_case_id: P7A-BND-010
  case_family: boundary
  boundary_family_id: B2
  boundary: "overclaim <-> mechanism_vs_evidence"
  gold_status: frozen_pre_model
  difficulty_tier: D3
  difficulty_rationale: |
    >=2 plausible labels, plus an evidence-tier wrinkle: in-vitro human donor-cell data are present
    and could be mistaken for demonstrated human benefit (they are preclinical). Distinguishing the
    animal/preclinical mechanism-to-human leap from generic overclaim, while correctly discounting
    the in-vitro human work, requires care. Property-based tagging.
  precedence_rationale: |
    A described animal/preclinical pathway (Ngn3-driven beta-cell regeneration in mice, plus in-vitro
    human cells) used to imply an undemonstrated human clinical cure is the mechanism_vs_evidence
    trigger (Shape A/C). It is present and central, so under docs/taxonomy_precedence.md rule 1 it
    outranks generic overclaim, which is retained as secondary. The in-vitro human work is preclinical
    and does not establish a demonstrated human benefit.
  ambiguity_note: |
    Determinate: mechanism_vs_evidence is the single defensible primary; overclaim is a real secondary
    reading. The in-vitro human data are a distractor, not a demonstrated human benefit.
  steelman_challenge: |
    Strongest case the gold is wrong: (a) the copy is inflated -> plain overclaim; (b) there IS human
    data (donor cells), so maybe the mechanism-gap is closed. Counter-evidence weighed: the human data
    are in-vitro/preclinical, not a patient trial, and the authors explicitly call for a trial, so the
    human clinical benefit remains undemonstrated; the decisive structure is an animal/preclinical
    pathway extrapolated to a human cure (Shape A/C). Resolution: gold remains mechanism_vs_evidence.
