robustness:
  robustness_case_id: P7A-ADV-011
  case_family: adversarial
  adversarial_family_id: A6
  adversarial_family: "unsupported superiority / benchmark cherry-picking / missing comparator"
  adversarial_mechanism: |
    A clinical superiority claim over a named competitor is built on a rigged comparator: the pivotal
    head-to-head comparison used unequal doses (Nexium 40 mg vs omeprazole 20 mg), and any genuine edge
    sits in an acid-suppression surrogate rather than a clinically meaningful outcome. The surface
    pressure is that real randomized trials and a genuine pharmacodynamic difference make the superiority
    claim look evidence-based. The pressure to resist: accepting a superiority claim whose comparator was
    stacked (unequal doses) and whose advantage narrows substantially at fair comparison.
  gold_status: frozen_pre_model
  difficulty_tier: D3
  difficulty_rationale: |
    An evidence-tier conflict is central (a real acid-suppression surrogate edge and a real 8-week
    healing difference at unequal doses versus a much smaller advantage at equal doses), and separating a
    dose-inflated superiority from a genuine effect requires attention to the comparator design, raising
    difficulty to D3. Property-based.
  precedence_rationale: |
    No specific-label trigger fires: the trials are randomized (rules out correlation_vs_causation) and
    no animal/preclinical mechanism is extrapolated to humans (rules out mechanism_vs_evidence). The
    defect is a comparator-based superiority claim exceeding the demonstrated clinical difference =
    overclaim, per docs/taxonomy_precedence.md (residual/generic rhetorical-inflation rule).
  ambiguity_note: |
    Determinate: overclaim is the single defensible primary; solid is tempting because Nexium has a real
    surrogate edge and a real (unequal-dose) healing advantage, but neither establishes the marketed
    clinical superiority at fair comparison.
  steelman_challenge: |
    Strongest case the gold is wrong: esomeprazole genuinely achieves greater and longer acid
    suppression, the pivotal trial did show significantly better 8-week healing (93.7% vs 84.2%), and it
    is a legitimately approved drug, so a reader might call the superiority claim solid. Counter-evidence
    weighed: that pivotal trial compared unequal doses (esomeprazole 40 vs omeprazole 20 mg); the
    advantage narrows substantially at equal doses and the clearest edge is a pharmacodynamic surrogate.
    Both directions checked. Resolution: the marketed clinical-superiority/switch claim exceeds the
    fair-comparison evidence; gold remains overclaim.
