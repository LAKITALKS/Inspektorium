id: P7A-ADV-011
title: "Adversarial A6: Nexium 'the better purple pill' vs Prilosec (superiority from an unequal-dose comparison; rigged comparator)"
domain: study_forensics
difficulty: hard
task_type: study_forensics
task_family: overclaim
trap_type: unsupported_superiority_rigged_comparator
ambiguity_level: low
prompt: |
  Advertising for Nexium (esomeprazole) positions it against Prilosec (omeprazole): "Nexium, the new purple pill, heals acid-reflux damage and relieves heartburn better than Prilosec. Ask your doctor to switch you to the better purple pill."

  Esomeprazole is the single (S-) isomer of omeprazole, which is a mixture of the S- and R- isomers. The pivotal head-to-head healing trial (Kahrilas et al., Aliment Pharmacol Ther 2000) compared Nexium 40 mg against omeprazole 20 mg — unequal doses — and found erosive-oesophagitis healing at 8 weeks of 93.7% vs 84.2% (p<0.001). The advantage is real but was demonstrated only at unequal doses; at equivalent doses the difference narrows substantially, and for most patients with typical gastro-oesophageal reflux (symptom control) the drugs are broadly comparable. Nexium's clearest edge is in a pharmacodynamic surrogate (degree/duration of acid suppression), rather than a large clinically meaningful advantage for typical patients at fair comparison.
context: |
  Evidence tier: a randomized head-to-head healing trial and its dosing design. The claim asserts
  clinical superiority over a competitor, but the pivotal comparison used unequal doses (Nexium 40 mg
  vs omeprazole 20 mg); the ~9.5 percentage-point healing advantage (93.7% vs 84.2% at 8 weeks) was
  demonstrated at those unequal doses, narrows substantially at equal doses, and the clearest edge is
  an acid-suppression surrogate. A superiority claim resting on a rigged/unequal-dose comparator,
  exceeding the fair-comparison difference, is overclaim.
expected_answer: "overclaim"
reference_solution: |
  Nexium is marketed as clinically superior to Prilosec, but the pivotal healing superiority (93.7% vs
  84.2% at 8 weeks, Kahrilas 2000) was demonstrated at unequal doses (esomeprazole 40 mg vs omeprazole
  20 mg); at equivalent doses the difference narrows substantially and for typical reflux the drugs are
  broadly comparable, with the clearest edge in an acid-suppression surrogate. A superiority/switch
  claim that rests on a rigged (unequal-dose) comparator and exceeds the fair-comparison difference is
  overclaim. It is not correlation_vs_causation (the trial is randomized) or mechanism_vs_evidence (no
  animal/preclinical-mechanism-to-human leap is central).
gold_label: overclaim
gold_confidence: high
gold_case_type: clear
gold_justification: |
  1. Exact proposition: Nexium heals and relieves reflux clinically better than Prilosec; patients
     should switch.
  2. What the strongest evidence establishes: the pivotal healing superiority (93.7% vs 84.2% at 8
     weeks, Kahrilas 2000) used unequal doses (esomeprazole 40 mg vs omeprazole 20 mg); at comparable
     doses the difference narrows substantially, for typical reflux the drugs are broadly comparable,
     and the clearest edge is an acid-suppression surrogate.
  3. Adversarial surface feature: real trials and a genuine pharmacodynamic edge make the superiority
     claim look evidence-based.
  4. Actual forensic mismatch: the clinical superiority is not demonstrated at fair (equal-dose)
     comparison; the marketed advantage exceeds the clinically meaningful difference.
  5. Primary frozen label: overclaim - an unsupported superiority claim resting on a rigged/unequal
     comparator.
  6. Why: the core defect is a comparator-based superiority claim exceeding the evidence; no specific
     structural trigger (causal-inference or mechanism-to-human) fires.
  7. Strongest competing label: solid - Nexium is a real drug with a genuine acid-suppression edge, so
     the claim seems evidence-based.
  8. Why it loses: the head-to-head clinical superiority rests on an unequal-dose comparison (40 vs 20
     mg); at equal doses the difference narrows substantially and the clearest edge is a surrogate, so
     the marketed clinical-superiority/switch claim exceeds the fair-comparison difference = overclaim.
  9. What would change the verdict: equal-dose head-to-head trials showing a clinically meaningful
     healing/relief advantage would make the superiority claim solid.
gold_alternative_reading: |
  Alternative: solid. Strongest good-faith version: esomeprazole genuinely produces greater/longer acid
  suppression and the pivotal trial did show significantly better 8-week healing (93.7% vs 84.2%), so a
  reader could call the superiority claim solid. It loses because that trial compared unequal doses (40
  vs 20 mg); at comparable doses the difference narrows substantially and the clearest edge is a
  surrogate, so the marketed clinical-superiority/switch claim exceeds the fair-comparison evidence =
  overclaim.
gold_summary: |
  Nexium is marketed as clinically better than Prilosec, but the pivotal healing superiority (93.7% vs
  84.2%) came from a 40-vs-20 mg (unequal-dose) comparison; at equal doses it narrows substantially and
  the clearest edge is an acid-suppression surrogate. Unsupported superiority via a rigged comparator
  = overclaim (solid tempting).
curator_notes: |
  Adversarial family A6 (unsupported superiority / benchmark cherry-picking / missing comparator). Real
  public claim: AstraZeneca's Nexium 'better purple pill' switch marketing against Prilosec. Decisive
  documented fact (curator-verified, WP-2 gold review): the pivotal head-to-head healing trial
  (Kahrilas 2000, Aliment Pharmacol Ther) compared esomeprazole 40 mg vs omeprazole 20 mg (unequal
  doses), 8-week healing 93.7% vs 84.2% (p<0.001) — primary evidence now bound (primary_research). The
  superiority is real but rests on an unequal-dose comparison and narrows at equal doses. Distinct from A6
  Listerine (P7A-ADV-012) and all Boundary/Class-A cases. Gold frozen before any model output.
