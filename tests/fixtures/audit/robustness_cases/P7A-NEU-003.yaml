id: P7A-NEU-003
title: "Neutral anchor (correlation_vs_causation): 'coffee causes cancer' from observational data confounded by smoking"
domain: study_forensics
difficulty: medium
task_type: study_forensics
task_family: correlation_vs_causation
trap_type: confounded_association
ambiguity_level: low
prompt: |
  A widely shared health article warns: "Coffee causes cancer. Studies found that people who drink coffee have higher rates of bladder cancer, so drinking coffee raises your cancer risk - cut out coffee to protect yourself."

  The claim draws on older observational studies that reported an association between coffee drinking and bladder cancer. But coffee drinkers were also, on average, much more likely to be cigarette smokers, and smoking is a strong established cause of bladder cancer. When the International Agency for Research on Cancer (IARC) re-evaluated the evidence in 2016 (Monographs Volume 116), it concluded that coffee is "not classifiable as to its carcinogenicity to humans" (Group 3) and that the earlier associations were attributable to inadequate control for smoking and other confounders rather than to coffee itself; IARC removed coffee from the "possibly carcinogenic" category it had held since 1991.
context: |
  Evidence tier: older observational associations reinterpreted causally, versus an authoritative
  IARC re-evaluation that attributes those associations to confounding by smoking. Nothing here is a
  described biological mechanism being over-extrapolated, and nothing is a benefit-over-evidence
  inflation. The load-bearing move is reading a correlation (coffee drinkers ~ more bladder cancer) as
  causation while ignoring a strong confounder (coffee drinkers smoked more, and smoking causes bladder
  cancer). This is the correlation_vs_causation trigger operating as the central failure.
expected_answer: "correlation_vs_causation"
reference_solution: |
  The claim asserts that coffee causes cancer because coffee drinkers have higher bladder-cancer rates.
  That is an observational association read as causation. Coffee drinking is confounded by smoking -
  coffee drinkers were more likely to smoke, and smoking is an established cause of bladder cancer - and
  IARC's 2016 re-evaluation concluded coffee is not classifiable as carcinogenic (Group 3), attributing
  the earlier associations to inadequate control for smoking. Reading a confounded correlation as a
  causal effect is the correlation_vs_causation error. It is not overclaim as the primary (the specific
  causal-inference trigger is present and takes precedence) and not mechanism_vs_evidence (no biological
  mechanism is described and extrapolated).
gold_label: correlation_vs_causation
gold_confidence: high
gold_case_type: clear
gold_justification: |
  1. Exact proposition: coffee causes cancer / drinking coffee raises your cancer risk, inferred from
     coffee drinkers having higher bladder-cancer rates.
  2. Study design behind the association: observational (case-control / cohort) studies of coffee
     drinking and bladder cancer.
  3. Confounder: coffee drinkers were substantially more likely to smoke, and smoking is a strong
     established cause of bladder cancer, so the association is confounded.
  4. Authoritative resolution: IARC's 2016 re-evaluation (Monographs Vol 116) classified coffee as
     Group 3 (not classifiable) and attributed prior associations to inadequate control for smoking,
     removing coffee from the Group 2B ("possibly carcinogenic") category.
  5. Primary frozen label: correlation_vs_causation - a causal claim built on a confounded observational
     association.
  6. Why: the decisive defect is the unjustified causal leap from a confounded correlation; the specific
     causal-inference trigger is present.
  7. Strongest competing label: overclaim - the claim also overstates what the evidence shows.
  8. Why it loses: precedence routes a causal claim resting on a confounded observational association to
     correlation_vs_causation, the more specific and load-bearing failure, rather than the generic
     overclaim.
  9. What would change the verdict: if the claim rested on a described biological mechanism extrapolated
     to humans it would move toward mechanism_vs_evidence; if it made no causal claim and merely
     overstated a benefit/harm without the correlation-as-cause structure it would be overclaim.
gold_alternative_reading: |
  Alternative: overclaim. Strongest good-faith version: "coffee causes cancer" plainly overstates what
  the evidence supports, so overclaim is defensible as a generic label. It loses on precedence: the
  claim's specific structure is a causal conclusion drawn from a confounded observational association
  (coffee drinkers ~ bladder cancer, confounded by smoking), which is exactly the correlation_vs_causation
  trigger; the more specific, load-bearing failure mode governs the primary label.
gold_summary: |
  "Coffee causes cancer" was inferred from observational studies where coffee drinkers had more bladder
  cancer - but coffee drinking was confounded by smoking, an established cause of bladder cancer. IARC's
  2016 re-evaluation classified coffee as Group 3 and attributed the association to inadequate control
  for smoking. A causal claim from a confounded correlation = correlation_vs_causation (not primarily
  overclaim, not mechanism_vs_evidence).
curator_notes: |
  Neutral perturbation anchor for the gold label 'correlation_vs_causation' (Phase-7A perturbation
  track, contract §5). NOT selected from Boundary/Adversarial performance; a clean, representative
  correlation_vs_causation case with a crisp, named confounder (smoking) and an authoritative resolution
  (IARC 2016). Distinct decisive proposition and confounder from the existing correlation cases:
  moderate-alcohol J-curve / abstainer bias (P7A-BND-004), dog ownership / SES confounding (P7A-BND-005),
  skipping breakfast (P7A-ADV-005), violent video games (P7A-ADV-006). Gold frozen before any model
  output.
expected_findings:
  - finding: causal_claim_from_observational_association
    severity: major
    confidence: high
    note: "'Coffee causes cancer' inferred from an observational coffee~bladder-cancer association"
  - finding: uncontrolled_confounder_smoking
    severity: major
    confidence: high
    note: "Coffee drinking confounded by smoking; IARC 2016 attributed the association to inadequate control for smoking"
gold_evidence_spans:
  - span: "people who drink coffee have higher rates of bladder cancer, so drinking coffee raises your cancer risk"
    why_it_matters: "Reads an observational association as a causal effect."
    supports_finding: causal_claim_from_observational_association
  - span: "coffee is 'not classifiable as to its carcinogenicity to humans' (Group 3) ... earlier associations were attributable to inadequate control for smoking"
    why_it_matters: "Authoritative resolution identifying smoking as the confounder."
    supports_finding: uncontrolled_confounder_smoking
evaluation:
  method: auto
  answer_match: contains
key_insights:
  - keyword: "confounding"
    variants: ["smoking", "coffee drinkers smoked more", "not adjusted"]
    functional_descriptions:
      - "A third variable (smoking) explains the coffee-cancer association"
  - keyword: "correlation not causation"
    variants: ["observational", "association", "IARC Group 3"]
    functional_descriptions:
      - "A causal claim is drawn from a confounded observational association"
common_errors:
  - accepting a causal claim from an observational association without asking about confounders
  - calling it a generic overclaim and missing the specific correlation-as-cause structure
expected_failure_modes:
  - correlation_read_as_causation
  - correlation_case_read_as_overclaim
discriminative_dimensions:
  - correctness
  - insight_depth
diagnostic_focus: "Can the agent identify a confounded observational association (coffee~cancer, confounded by smoking) read as causation, and route it to correlation_vs_causation rather than generic overclaim?"
