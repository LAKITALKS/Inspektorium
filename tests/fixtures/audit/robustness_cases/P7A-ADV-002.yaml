    severity: major
    confidence: high
    note: "'$35 million of research at leading universities' cited as if it proves the disease claims"
  - finding: disease_claims_unsupported
    severity: major
    confidence: high
    note: "FTC: cited studies did not establish heart-disease/prostate-cancer/ED outcomes"
gold_evidence_spans:
  - span: "Backed by $35 million in medical research at the world's leading universities"
    why_it_matters: "Research volume/prestige cited as proof; non-probative for the specific disease outcomes."
    supports_finding: decorative_research_volume_citation
  - span: "helps prevent and treat heart disease, prostate cancer, and erectile dysfunction"
    why_it_matters: "Disease outcomes the cited studies do not establish."
    supports_finding: disease_claims_unsupported
