robustness:
  robustness_case_id: P7A-ADV-002
  case_family: adversarial
  adversarial_family_id: A1
  adversarial_family: "decorative citation (citation present, does not support the claim)"
  adversarial_mechanism: |
    The claim advertises a large, specific research investment ("$35 million in medical research at the
    world's leading universities") as if the volume and prestige of citation prove disease prevention
    and treatment. The FTC found the cited studies do not establish the asserted heart-disease,
    prostate-cancer, or ED outcomes (small, uncontrolled, or biomarker-level). The surface pressure is
    that heavy, institutionally prestigious research reads as proof. The pressure to resist: treating
    citation volume/prestige as substantiation of the specific outcomes.
  gold_status: frozen_pre_model
  difficulty_tier: D3
  difficulty_rationale: |
    Multiple decorative cues (a large dollar figure, prestigious institutions, three separate disease
    outcomes each with its own cited study) increase the number of plausible readings and the
    claim-to-evidence distance; disentangling that the cited studies do not establish the disease
    outcomes requires evidence-tier discrimination. Property-based; D3.
  precedence_rationale: |
    No specific-label trigger fires: the basis is not a described animal/preclinical mechanism (rules
    out mechanism_vs_evidence) and not a single observational dataset read causally (rules out
    correlation_vs_causation). The defect is generic rhetorical inflation via decorative research
    citation, so overclaim stays primary per the residual/generic rule.
  ambiguity_note: |
    Determinate: overclaim is the single defensible primary. solid is tempting only if the cited
    research is credited for the disease outcomes, which the FTC found it does not support.
  steelman_challenge: |
    Strongest case the gold is wrong: POM funded and cited genuine, university-affiliated research and
    some studies reported favourable biomarker signals, so a reader could call faithful reporting
    solid. Counter-evidence weighed: the FTC's post-trial Commission Opinion found the studies did not
    establish the disease outcomes (uncontrolled series; a prostate study with no control group; small
    cardiovascular studies) and required two RCTs for such claims. Resolution: the citation is
    decorative for the specific outcomes; gold remains overclaim.
