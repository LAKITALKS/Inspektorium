id: P7A-ADV-002
title: "Adversarial A1: POM Wonderful 'backed by $35 million of research' treats heart disease/prostate cancer/ED (decorative citation)"
domain: study_forensics
difficulty: hard
task_type: study_forensics
task_family: overclaim
trap_type: decorative_citation
ambiguity_level: low
prompt: |
  Advertising for POM Wonderful pomegranate juice and POMx supplements states: "Backed by $35 million in medical research at the world's leading universities, POM Wonderful helps prevent and treat heart disease, prostate cancer, and erectile dysfunction. Cheat death."

  The US Federal Trade Commission challenged 36 advertisements and, after trial, the Commission (2013) found there was insufficient competent and reliable scientific evidence that POM products treat, prevent, or reduce the risk of heart disease, prostate cancer, or erectile dysfunction. The company-funded studies it cited did not establish those disease outcomes: the cardiovascular studies were small or lacked adequate controls, and the prostate-cancer study had no control group. The Final Order requires two randomized, well-controlled human trials to support any such disease claim.
context: |
  Evidence tier: a regulator's post-trial evidence assessment (FTC Commission Opinion), weighing the
  company's own cited research. The advertising foregrounds a large research investment ("$35 million",
  "leading universities") as if the volume of citation proves disease prevention/treatment. The cited
  studies support, at most, adjacent or preliminary findings (biomarkers, uncontrolled series) — not
  the asserted clinical disease outcomes. The load-bearing move is the decorative appeal to expensive
  research; the defect is rhetorical inflation = overclaim.
expected_answer: "overclaim"
reference_solution: |
  POM's ads cite "$35 million in medical research at leading universities" to claim its products
  prevent and treat heart disease, prostate cancer, and erectile dysfunction. The FTC found the cited
  studies did not establish those disease outcomes (small/uncontrolled cardiovascular studies; a
  prostate study with no control group). The research volume is decoration; it does not support the
  disease claims. Conclusions framed as research-proven that exceed what the studies show = overclaim.
  It is not mechanism_vs_evidence (no animal/preclinical mechanism is the basis) or
  correlation_vs_causation (the defect is the unsupported proof-claim, not a specific observational
  design error).
gold_label: overclaim
gold_confidence: high
gold_case_type: clear
gold_justification: |
  1. Exact proposition: POM products, "backed by $35 million in medical research", prevent and treat
     heart disease, prostate cancer, and erectile dysfunction.
  2. What the strongest evidence establishes: the FTC found insufficient competent and reliable
     evidence for those disease outcomes; the cited studies were small, uncontrolled, or measured
     adjacent endpoints, not the asserted clinical outcomes.
  3. Adversarial surface feature: the large, specific research investment ("$35 million", "world's
     leading universities") signals heavy scientific backing and invites crediting the disease claims.
  4. Actual forensic mismatch: the cited research does not establish the disease claims; the dollar
     figure and institutional prestige are non-probative for the specific outcomes asserted.
  5. Primary frozen label: overclaim — disease-prevention/treatment claims framed as research-proven
     that exceed what the cited studies establish.
  6. Why: the entire defect is rhetorical inflation via a decorative appeal to research volume; there
     is no specific structural trigger doing the decisive work.
  7. Strongest competing label: solid — the studies are real and university-affiliated, so faithful
     reporting of them might seem solid.
  8. Why it loses: the studies do not support the disease outcomes claimed (uncontrolled/biomarker
     level), so the disease claims are unsupported; volume of research is not evidence of the specific
     outcomes = overclaim, not solid.
  9. What would change the verdict: two randomized, well-controlled human trials showing POM prevents
     or treats these diseases (the FTC's required standard) would move the claim toward solid.
gold_alternative_reading: |
  Alternative: solid. Strongest good-faith version: the ads cite substantial, real, university-based
  research, so a reader might treat the disease claims as well-supported. It loses because the FTC
  found the cited studies do not establish the heart-disease, prostate-cancer, or ED outcomes (small,
  uncontrolled, or biomarker-level); the research investment is decorative relative to the specific
  claims = overclaim.
gold_summary: |
  POM cited "$35 million in medical research at leading universities" to claim it treats/prevents heart
  disease, prostate cancer, and ED; the FTC found the cited studies did not establish those outcomes.
  A large but non-probative research citation dressing unsupported disease claims = overclaim.
curator_notes: |
  Adversarial family A1 (decorative citation). Real public claim documented by the FTC 2013 Commission
  Opinion (POM Wonderful). Distinct proposition from Airborne A1 (P7A-ADV-001): here the decoration is
  research VOLUME/prestige ($35M, leading universities) across three disease outcomes, not a single
  fake trial. Independent of all Boundary/Class-A cases. Gold frozen before any model output.
