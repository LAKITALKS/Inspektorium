  boundary: "overclaim <-> correlation_vs_causation"
  gold_status: frozen_pre_model
  difficulty_tier: D2
  difficulty_rationale: |
    One primary (overclaim) plus one genuinely plausible alternate (correlation_vs_causation,
    invited by the observational data); precedence decides. Moderate claim-evidence distance; no
    deep evidence-tier conflict. Property-based tagging.
  precedence_rationale: |
    The specific correlation_vs_causation trigger (causal claim from a non-causal design) is not the
    decisive defect; even if walking helps, the claim's unsupported 10,000 threshold and
    all-or-nothing certainty are generic inflation. Under docs/taxonomy_precedence.md the primary
    stays overclaim; correlation_vs_causation is the documented alternative.
  ambiguity_note: |
    Difficult but determinate: overclaim is the single defensible primary; the observational nature
    of the evidence makes correlation_vs_causation tempting but not controlling.
  steelman_challenge: |
    Strongest case the gold is wrong: the step-mortality data are observational and confounded, so
    the whole claim could be attacked as correlation_vs_causation. Counter-evidence weighed: the
    claim does not hinge on inferring causation from a confounded design; its decisive, checkable
    error is the fabricated 10,000 threshold and certainty, which stands even if walking is causally
    beneficial. Resolution: gold remains overclaim.
