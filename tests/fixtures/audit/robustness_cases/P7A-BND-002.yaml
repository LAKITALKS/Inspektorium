id: P7A-BND-002
title: "Boundary: '10,000 steps a day is required for health' (marketing-derived threshold)"
domain: study_forensics
difficulty: medium
task_type: study_forensics
task_family: overclaim
trap_type: unsupported_threshold_overclaim
ambiguity_level: medium
prompt: |
  A wellness brand's campaign asserts: "The science is clear — you must walk 10,000 steps every day to stay healthy and lower your risk of early death. Anything less and you are not doing enough."

  The 10,000-steps figure originated in 1965 as a marketing slogan for the Japanese "manpo-kei" ("10,000-steps meter") pedometer; it was chosen as a memorable round number and has no scientific basis. A 2022 meta-analysis of 15 international cohorts (Paluch et al., Lancet Public Health, 47,471 adults) found that all-cause mortality risk decreases with more daily steps but the benefit PLATEAUS at roughly 6,000-8,000 steps/day for older adults (60+) and roughly 8,000-10,000 steps/day for younger adults, with no clear additional mortality benefit beyond those ranges. Related cohort work found much of the mortality benefit is already captured well below 10,000 steps (e.g. around 7,000 steps/day). Step-count/mortality evidence is observational (associational).
context: |
  Evidence tier: pooled prospective cohort meta-analysis (observational). The dose-response
  association is real but the benefit plateaus below 10,000 steps; the specific 10,000 threshold is
  a 1965 marketing number, not an evidence-derived cut-point. The claim's error is asserting a
  specific unsupported threshold ("must ... 10,000 ... anything less is not enough"), not a
  causal-inference leap.
expected_answer: "overclaim"
reference_solution: |
  The public claim manufactures a hard, specific requirement ("must walk 10,000 ... anything less is
  not enough") that the evidence does not support: the 10,000 number is a marketing artifact and the
  observed mortality benefit plateaus at ~6,000-8,000 (older) / ~8,000-10,000 (younger) steps, with
  much of the benefit already below 10,000. The framing exceeds the evidence via an unsupported
  specific threshold and false all-or-nothing certainty = overclaim. It is not primarily a
  correlation/causation error: the claim's defect is the fabricated threshold and certainty, not the
  (separate) observational-vs-causal question.
gold_label: overclaim
gold_confidence: high
gold_case_type: clear
gold_justification: |
  1. What the claim asserts: a mandatory, specific threshold — 10,000 steps/day is required, and any
     amount below it is insufficient for health.
  2. What the evidence establishes: an observational dose-response in which mortality risk falls with
     more steps but plateaus at ~6,000-8,000 (older) / ~8,000-10,000 (younger) steps; the 10,000
     figure is a 1965 marketing slogan with no scientific basis.
  3. Mismatch: the claim converts a graded, plateauing association into a hard specific cut-point and
     an all-or-nothing rule — a threshold and certainty the data do not support.
  4. Frozen label triggered: overclaim (unsupported specificity + certainty inflation; framing
     exceeds evidence).
  5. Why correlation_vs_causation is tempting: the step-mortality evidence is observational, so a
     reviewer may reach for the correlation/causation boundary.
  6. Why precedence rejects it as primary: the claim's central failure is not "causation inferred
     from a non-causal design"; even granting an effect of walking, the specific 10,000 requirement
     and "anything less is not enough" are unsupported by the dose-response, which plateaus lower.
     The generic inflation (unsupported threshold/certainty) is the core error, so the primary stays
     overclaim (docs/taxonomy_precedence.md rule 2).
  7. What would change the classification: if the claim were "people who walk more tend to live
     longer, so walking causes longer life — everyone should walk to prevent death," the
     causal-from-observational trigger would move to the foreground (correlation_vs_causation).
gold_alternative_reading: |
  Alternative: correlation_vs_causation. Plausible because step-count/mortality data are
  observational and confounded (healthier people walk more). It loses under precedence because the
  claim's decisive defect is the fabricated specific threshold and all-or-nothing certainty, not a
  causal inference from a confounded design; the association's direction is not the disputed point.
gold_summary: |
  A campaign insists 10,000 steps/day is required and anything less is "not enough." The 10,000
  figure is a 1965 marketing slogan; the observational dose-response plateaus at ~6,000-8,000
  (older)/8,000-10,000 (younger) steps. The defect is an unsupported specific threshold + certainty
  = overclaim, not a causal-inference error.
curator_notes: |
  Boundary family B1 (overclaim <-> correlation_vs_causation), overclaim direction. Sourced from the
  manpo-kei marketing origin and Paluch et al. 2022 (Lancet Public Health). Independent proposition
  (no steps/exercise case in Class A). Gold frozen before any model output.
expected_findings:
  - finding: unsupported_threshold
    severity: major
    confidence: high
    note: "10,000 is a 1965 marketing number; benefit plateaus below it"
  - finding: certainty_inflation
    severity: moderate
    confidence: high
    note: "'Must ... anything less is not enough' is an all-or-nothing rule the graded data do not support"
  - finding: conclusion_exceeds_results
    severity: moderate
    confidence: medium
    note: "Observational dose-response reframed as a hard mandatory cut-point"
gold_evidence_spans:
  - span: "you must walk 10,000 steps every day to stay healthy"
    why_it_matters: "Asserts a specific, mandatory threshold that the evidence does not support."
    supports_finding: unsupported_threshold
  - span: "Anything less and you are not doing enough"
    why_it_matters: "All-or-nothing certainty contradicted by a graded, plateauing dose-response."
    supports_finding: certainty_inflation
evaluation:
  method: auto
  answer_match: contains
key_insights:
  - keyword: "marketing origin"
    variants: ["manpo-kei", "1965", "no scientific basis"]
    functional_descriptions:
      - "The 10,000 figure is a marketing slogan, not an evidence-derived threshold"
  - keyword: "benefit plateau"
    variants: ["6,000-8,000", "diminishing returns", "below 10,000"]
    functional_descriptions:
      - "Mortality benefit plateaus below 10,000 steps in cohort meta-analysis"
common_errors:
  - defaulting to correlation_vs_causation for any observational health claim
  - accepting 10,000 as an evidence-based target
  - missing the plateau / diminishing returns
expected_failure_modes:
  - overclaim_to_over_specific
  - threshold_fabrication
discriminative_dimensions:
  - correctness
  - insight_depth
diagnostic_focus: "Can the agent identify an unsupported specific threshold as overclaim rather than a causal-inference error?"
