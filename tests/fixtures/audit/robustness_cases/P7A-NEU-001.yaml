id: P7A-NEU-001
title: "Neutral anchor (solid): periconceptional folic acid substantially reduces neural tube defect risk (stated faithfully to the MRC RCT)"
domain: study_forensics
difficulty: medium
task_type: study_forensics
task_family: solid
trap_type: none
ambiguity_level: low
prompt: |
  A public-health guidance page advises: "Taking a folic acid supplement before conception and during the first weeks of pregnancy substantially reduces the risk of neural tube defects such as spina bifida and anencephaly. All women who could become pregnant are advised to take 400 micrograms of folic acid a day."

  The recommendation rests on the Medical Research Council (MRC) Vitamin Study, a randomised, double-blind, placebo-controlled trial published in the Lancet in 1991, in which periconceptional folic acid supplementation reduced the recurrence of neural tube defects by about 72% in women at high risk. The finding has since been supported by a further primary-prevention randomised trial (Czeizal & Dudas 1992), by large observational studies, and by population-wide mandatory folic-acid food fortification programmes that have been followed by marked declines in neural-tube-defect prevalence; the US Preventive Services Task Force gives periconceptional folic acid supplementation its highest (Grade A) recommendation. The guidance names the intervention (folic acid), the timing (before conception and early pregnancy), the outcome (neural tube defects), and the direction of effect, without extending the claim to unrelated benefits or to untested populations.
context: |
  Evidence tier: a randomised, double-blind, placebo-controlled trial with a clinical endpoint
  (neural tube defect recurrence), corroborated by a further primary-prevention RCT, fortification
  programmes, and a Grade A USPSTF recommendation - the strongest tier. The public claim reports the
  intervention, timing, outcome, and direction faithfully and is appropriately scoped
  (periconceptional timing, neural tube defects specifically); it does not overreach to unrelated
  benefits, to "prevents all birth defects", or to unstudied groups. This is a claim/evidence-fidelity
  test for the solid label: the pull is to distrust a strong, confident public-health statement, but
  here the claim and its scope match the trial evidence.
expected_answer: "solid"
reference_solution: |
  The claim is that periconceptional folic acid substantially reduces neural tube defect risk. That is
  exactly what the MRC Vitamin Study (1991), a randomised double-blind placebo-controlled trial,
  demonstrated (about 72% reduction in NTD recurrence), and it has been corroborated by a further RCT,
  by fortification programmes, and by a Grade A USPSTF recommendation. The claim is faithfully scoped
  (periconceptional timing, NTDs specifically, a hedged "substantially reduces" rather than "eliminates")
  and does not extend to unrelated benefits or untested populations. Faithful reporting of adequate
  randomised evidence with no overreach = solid. It is not overclaim (the claim does not exceed the
  evidence), not mechanism_vs_evidence (the support is a human clinical-endpoint RCT, not a mechanism
  extrapolation), and not correlation_vs_causation (the load-bearing evidence is randomised).
gold_label: solid
gold_confidence: high
gold_case_type: clear
gold_justification: |
  1. Exact proposition: taking folic acid before conception and in early pregnancy substantially
     reduces the risk of neural tube defects (spina bifida, anencephaly).
  2. What the strongest evidence establishes: the MRC Vitamin Study (Lancet 1991), a randomised,
     double-blind, placebo-controlled trial, found ~72% fewer NTD recurrences with periconceptional
     folic acid; a further primary-prevention RCT, fortification programmes, and a Grade A USPSTF
     recommendation corroborate it.
  3. Fidelity check: the claim states the intervention, timing, outcome, direction, and a calibrated
     magnitude word ("substantially reduces", not "eliminates") and keeps to the studied window and
     endpoint.
  4. Primary frozen label: solid - a faithful public-health report of adequate randomised evidence,
     with scope matching the trial and no overreach.
  5. Strongest competing label: overclaim - one could suspect a confident prevention claim of
     exceeding the evidence.
  6. Why it loses: the claim does not exceed the evidence; a randomised clinical-endpoint trial plus
     replication and a Grade A recommendation support exactly what is asserted, and the wording is
     appropriately hedged and scoped.
  7. What would change the verdict: if the claim were widened to "prevents all birth defects", to a
     population or timing the trials did not study, or asserted a benefit with only observational or
     mechanistic support, it would move toward overclaim.
gold_alternative_reading: |
  Alternative: overclaim. Strongest good-faith version: a strong, confident public claim that a
  supplement "substantially reduces" a serious birth defect can look like marketing-style inflation,
  and readers are primed to distrust confident health claims. It loses because the claim is backed by a
  randomised, double-blind, placebo-controlled trial with a clinical endpoint (plus replication,
  fortification data, and a Grade A recommendation), is calibrated in magnitude, and is scoped to the
  studied timing and outcome - so nothing is asserted beyond the evidence.
gold_summary: |
  A public-health page states that periconceptional folic acid substantially reduces neural tube
  defect risk and advises 400 mcg/day. This is faithfully supported by the MRC 1991 randomised
  double-blind placebo-controlled trial (~72% fewer recurrences), a further RCT, fortification data,
  and a Grade A USPSTF recommendation, and it is properly scoped = solid (not overclaim).
curator_notes: |
  Neutral perturbation anchor for the gold label 'solid' (Phase-7A perturbation track, contract §5).
  NOT selected from Boundary/Adversarial performance; a clean, representative solid case with a
  defensible gold and no adversarial trick structure. Distinct decisive proposition from the two
  Boundary solid cases (Shingrix vaccine efficacy P7A-BND-011; SPRINT intensive BP control
  P7A-BND-012) - different domain (periconceptional nutrition / NTD prevention), different trial, and
  different claim. Gold frozen before any model output.
