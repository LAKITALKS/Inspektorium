  precedence_rationale: |
    The correlation_vs_causation trigger (causal claim from a confounded, non-causal design with a
    biased comparator) is genuinely present and is the core error, so under
    docs/taxonomy_precedence.md rule 1 it outranks the generic overclaim reading, which is retained
    as secondary.
  ambiguity_note: |
    Difficult-but-determinate boundary: correlation_vs_causation is the single defensible primary;
