id: P7A-BND-004
title: "Boundary: 'a daily drink protects your heart' (moderate-alcohol J-curve, abstainer bias)"
domain: study_forensics
difficulty: medium
task_type: study_forensics
task_family: correlation_vs_causation
trap_type: confounded_causal_claim
ambiguity_level: low
prompt: |
  A lifestyle column advises: "The evidence shows that a daily glass of wine protects your heart and helps you live longer. Moderate drinkers outlive teetotallers, so if you don't drink, consider starting — one drink a day is good for you."

  The claim rests on the long-observed "J-curve": in many observational cohorts, moderate drinkers show lower mortality than non-drinkers. A 2023 systematic review and meta-analysis (Zhao et al., JAMA Network Open) of 107 cohort studies and more than 4.8 million participants found NO statistically significant reduction in all-cause mortality among low-volume drinkers (about one drink/day) compared with LIFETIME nondrinkers, once the analysis corrected for study biases. The apparent benefit in earlier studies is largely explained by the "abstainer/sick-quitter bias" — former drinkers and people who quit because of ill health were misclassified into the nondrinker reference group, making non-drinkers look unhealthy. No level of drinking was associated with longer life; risk rose above ~2 drinks/day (women) and ~3/day (men).
context: |
  Evidence tier: large meta-analysis of observational cohorts. The exposure-outcome design is
  non-randomized and confounded; the reference group is corrupted by abstainer/sick-quitter bias.
  The public claim converts this confounded association into a causal, prescriptive recommendation
  ("protects your heart," "start drinking"). This is the correlation_vs_causation trigger operating
  as the central failure.
expected_answer: "correlation_vs_causation"
reference_solution: |
  The public claim makes a causal, prescriptive statement (moderate drinking "protects your heart,"
  non-drinkers should "consider starting") from a NON-CAUSAL, confounded observational design. The
  apparent J-curve benefit is explained by abstainer/sick-quitter bias (ill former drinkers
  misclassified as non-drinkers); when corrected, low-volume drinking shows no mortality benefit.
  The central forensic defect is inferring causation from a confounded association and recommending
  action on that basis = correlation_vs_causation. (An overclaim reading also exists, but the causal
  boundary crossing is the core error.)
gold_label: correlation_vs_causation
gold_confidence: high
gold_case_type: clear
gold_justification: |
  1. What the claim asserts: a causal, prescriptive conclusion — a daily drink "protects your heart"
     and non-drinkers should "consider starting."
  2. What the evidence establishes: an observational association (J-curve) that disappears for
     low-volume drinkers vs LIFETIME nondrinkers after correcting for abstainer/sick-quitter bias;
     no protective effect once confounding is addressed.
  3. Mismatch: a confounded, non-randomized association with a corrupted reference group is treated
     as a causal effect and turned into behavioural advice.
  4. Frozen label triggered: correlation_vs_causation — a causal claim (and policy/behaviour
     recommendation) drawn from a non-causal, confounded design; the specific trigger is genuinely
     present and captures the core error.
  5. Why overclaim is tempting: "protects your heart / live longer" is also rhetorical inflation, so
     a generic overclaim reading is available.
  6. Why precedence keeps the specific label primary: the decisive failure is structural — causation
     asserted from a confounded observational design with a biased comparator — exactly the
     correlation_vs_causation definitional trigger, which outranks generic overclaim when present and
     central (docs/taxonomy_precedence.md rule 1). overclaim is recorded as the secondary reading.
  7. What would change the classification: if a randomized/Mendelian-randomization design had shown a
     causal protective effect, the causal claim would be supported (solid); if the claim had merely
     said "moderate drinkers tend to have lower mortality" without causal/prescriptive framing, it
     would not cross the causal boundary.
gold_alternative_reading: |
  Alternative: overclaim. Plausible because "protects your heart / live longer" is rhetorical
  inflation. It is the secondary reading; it loses as PRIMARY because the core, structural defect is
  the causal inference from a confounded observational design (abstainer bias), which is precisely
  the correlation_vs_causation trigger and captures the central error.
gold_summary: |
  A column tells non-drinkers to start because "a daily drink protects your heart." The J-curve is
  observational and explained by abstainer/sick-quitter bias; a 2023 meta-analysis (107 studies,
  4.8M+) found no low-volume mortality benefit after correction. Causal, prescriptive claim from a
  confounded design = correlation_vs_causation (overclaim secondary).
curator_notes: |
  Boundary family B1 (overclaim <-> correlation_vs_causation), correlation_vs_causation direction —
  a counter-directional (specific-that-also-looks-overclaim) anchor for the transition matrix.
  Sourced from Zhao et al. 2023 (JAMA Network Open) and the abstainer-bias literature. The
  causal/prescriptive framing is what crosses the boundary; a merely descriptive association would
  not. Gold frozen before any model output.
expected_findings:
  - finding: correlation_as_causation
    severity: major
    confidence: high
    note: "Causal, prescriptive claim from a confounded observational design"
  - finding: confounding_reference_group_bias
    severity: major
    confidence: high
    note: "Abstainer/sick-quitter bias corrupts the non-drinker comparator"
  - finding: conclusion_exceeds_results
    severity: moderate
    confidence: medium
    note: "'Protects your heart / start drinking' is also rhetorical inflation (secondary)"
gold_evidence_spans:
  - span: "a daily glass of wine protects your heart and helps you live longer"
    why_it_matters: "Causal claim drawn from a confounded observational association."
    supports_finding: correlation_as_causation
  - span: "if you don't drink, consider starting"
    why_it_matters: "Behavioural recommendation built on the non-causal design — the causal boundary crossing."
    supports_finding: correlation_as_causation
evaluation:
  method: auto
  answer_match: contains
key_insights:
  - keyword: "abstainer bias"
    variants: ["sick-quitter", "former drinkers", "reference group"]
    functional_descriptions:
      - "Ill former drinkers misclassified as non-drinkers create a spurious J-curve"
  - keyword: "confounded observational design"
    variants: ["non-randomized", "cohort", "no counterfactual"]
    functional_descriptions:
      - "Association cannot support a causal, prescriptive recommendation"
common_errors:
  - defaulting to overclaim because the wording is inflated
  - accepting the J-curve as a causal protective effect
  - missing abstainer/sick-quitter bias
expected_failure_modes:
  - specific_to_overclaim
  - missing_confounders
discriminative_dimensions:
  - correctness
  - insight_depth
diagnostic_focus: "Can the agent hold correlation_vs_causation as primary when the causal boundary crossing is central, resisting the generic overclaim reading?"
