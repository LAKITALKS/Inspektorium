    prior_case_fingerprint: "ad9a886265e048ebbdfd2b866e3ebc284caea4536df9ecba0f2d7f2d628ec325"
    trigger: "curator gold re-adjudication (WP-2 §7): direct human RCT/meta-analytic evidence exists for probiotics in depression, so mechanism_vs_evidence is not uniquely defensible"
    rationale: >
      Re-adjudicated from scratch per WP-2 §7. Direct human evidence exists: randomized trials and
      meta-analyses (e.g. Nikolova 2019/2021; Goh 2019) show probiotics reduce depressive symptoms as an
      ADJUNCT to antidepressants (SMD ~0.83) but NOT stand-alone (SMD ~ -0.02). The frozen claim ("cure
      your anxiety, lift your depression, no medication needed") therefore EXAGGERATES and OVER-GENERALIZES
      real-but-weak human evidence, and "no medication needed" contradicts the adjunct-only finding -
      which makes generic OVERCLAIM at least equally defensible as mechanism_vs_evidence. Because the A7
      family requires a mechanism used to imply human efficacy that is NOT demonstrated (gold
      mechanism_vs_evidence), this case no longer cleanly instantiates A7. Retired (not deleted); replaced
      by an independent A7 case (P7A-ADV-017, nattokinase) whose claimed human CLINICAL OUTCOME (prevent
      heart attacks/strokes) has NO human outcome trials, so mechanism_vs_evidence is uniquely defensible.
    label_flip: false
    hard_deleted: false
    superseded_by: P7A-ADV-017
