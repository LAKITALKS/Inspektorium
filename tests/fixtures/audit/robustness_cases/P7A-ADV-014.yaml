  adversarial_mechanism: |
    A genuine, actively studied biological pathway (the gut-brain axis: vagus, HPA axis, short-chain
    fatty acids, serotonin/GABA), supported mostly by animal studies, is extrapolated to a strong,
    established human psychiatric treatment (curing anxiety and depression, replacing medication). The
    surface pressure is that the mechanism is real, specific, and fashionable ("second brain"), making
    the human benefit sound grounded. The pressure to resist: accepting a preclinical-dominant mechanism
    (and sparse, inconsistent human trials) as an established human treatment.
  gold_status: frozen_pre_model
  difficulty_tier: D3
  difficulty_rationale: |
    An evidence-tier conflict is central: some human trials exist but are early, small, and inconsistent,
    tempting a reviewer to reclassify the defect as overstatement of weak human data (overclaim). Keeping
    the mechanism-to-treatment leap primary while weighing the mixed human evidence raises difficulty to
    D3. Property-based.
  precedence_rationale: |
    A described biological mechanism (gut-brain axis), supported predominantly by preclinical work and
    used to imply an undemonstrated human clinical benefit, is the mechanism_vs_evidence trigger (Shape C,
    translational). It is present and central and outranks generic overclaim per docs/taxonomy_precedence.md
    rule 1; the sparse, inconsistent human trials do not establish the claim (not solid).
  ambiguity_note: |
    Determinate: mechanism_vs_evidence is the single defensible primary; overclaim is a real secondary
    reading. Early/inconsistent human trials neither establish the cure (not solid) nor displace the
    mechanism-to-treatment leap as the core error.
  steelman_challenge: |
    Strongest case the gold is wrong: unlike a pure animal claim, probiotics for mood have some human
    trials, and reviews suggest possible benefit in subclinical/stressed groups, so a reviewer might call
    the claim overstatement of real (if weak) human evidence (overclaim). Counter-evidence weighed: the
    human trials are early, small, short, and inconsistent and do not establish a cure; the mouse-to-human
    translational gap is explicitly recognized, and the claim's load-bearing basis is the gut-brain
    mechanism. Both directions checked. Resolution: the mechanism-to-human-treatment leap is the core
    error; gold remains mechanism_vs_evidence.
