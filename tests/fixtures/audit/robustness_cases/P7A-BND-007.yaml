    One primary (overclaim) plus one plausible alternate (mechanism_vs_evidence, invited by the
    gut-immune narrative); precedence decides. Low evidence-tier conflict (regulator clearly found
    the claim unsubstantiated). Property-based tagging.
  precedence_rationale: |
    mechanism_vs_evidence requires a described animal/preclinical pathway extrapolated to human
    benefit. EFSA found no plausible mechanism at all, so there is nothing for the specific label to
    attach to; the claim is generic unsupported-breadth inflation, primary = overclaim
    (docs/taxonomy_precedence.md rule 2).
  ambiguity_note: |
    Determinate: overclaim is the single defensible primary; mechanism_vs_evidence is tempting via
    marketing narrative but has no described pathway to rest on.
  steelman_challenge: |
    Strongest case the gold is wrong: the gut-immune axis is a real biological system, so one might
    call this mechanism_vs_evidence. Counter-evidence weighed: the claim presents no specific animal/
    preclinical pathway, and EFSA explicitly found no plausible mechanism; the specific label needs a
    described mechanism to over-extrapolate, which is absent. Resolution: gold remains overclaim.
