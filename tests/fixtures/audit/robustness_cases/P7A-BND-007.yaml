id: P7A-BND-007
title: "Boundary: 'probiotics boost your immune system' (unsubstantiated breadth, no established mechanism)"
domain: study_forensics
difficulty: medium
task_type: study_forensics
task_family: overclaim
trap_type: unsupported_breadth_health_halo
ambiguity_level: medium
prompt: |
  A supplement label states: "Our daily probiotic boosts your immune system and strengthens your body's natural defences."

  The European Food Safety Authority (EFSA) has assessed probiotic immune-health claims and has rejected all of them submitted to date. In its evaluation of one such product (Nutrimune), the EFSA Panel concluded that the evidence was insufficient to establish a cause-and-effect relationship between consumption and immune defence against pathogens in the gastrointestinal and upper respiratory tracts; it noted that the human study had not been replicated and that no evidence was provided for a plausible mechanism by which the product could exert the claimed effect in vivo in humans. EFSA's general reasons for rejecting probiotic claims are that the strains were insufficiently characterized or that the cause-and-effect link was poorly substantiated.
context: |
  Evidence tier: regulatory evidence assessment (EFSA), which found the human evidence insufficient
  and, notably, NO substantiated biological mechanism. The claim asserts a broad immune benefit
  ("boosts your immune system") that the evidence does not support. Because no described animal/
  preclinical pathway is being extrapolated (and EFSA found no plausible mechanism), the failure is
  generic unsupported-breadth inflation = overclaim, not mechanism_vs_evidence.
expected_answer: "overclaim"
reference_solution: |
  The label makes a broad, vague immune-benefit claim ("boosts your immune system") that regulators
  have repeatedly found unsubstantiated: EFSA found insufficient human evidence AND no plausible
  mechanism. The failure is a health-halo, unsupported-breadth claim = overclaim. It is not
  mechanism_vs_evidence: that label requires a DESCRIBED animal/preclinical biological pathway used
  to imply human benefit; here there is no such pathway being over-extrapolated (EFSA explicitly
  found none), so the mechanism reading has nothing to attach to.
gold_label: overclaim
gold_confidence: high
gold_case_type: clear
gold_justification: |
  1. What the claim asserts: a broad benefit — the probiotic "boosts your immune system" and
     "strengthens natural defences."
  2. What the evidence establishes: EFSA found the human evidence insufficient to establish
     cause-and-effect and found no plausible mechanism substantiated; strains often insufficiently
     characterized.
  3. Mismatch: an unsubstantiated broad immune benefit is asserted as fact.
  4. Frozen label triggered: overclaim — framing exceeds the evidence (unsupported breadth / vague
     health-halo), the generic/residual failure.
  5. Why mechanism_vs_evidence is tempting: probiotics are popularly marketed via a gut-immune
     "mechanism" narrative, so a reviewer may reach for that specific label.
  6. Why precedence rejects it as primary: mechanism_vs_evidence requires a DESCRIBED biological
     mechanism (animal/preclinical pathway) extrapolated to human benefit. Here no such pathway is
     presented or over-extrapolated — EFSA explicitly found no plausible mechanism — so the specific
     trigger is absent and the primary stays overclaim (docs/taxonomy_precedence.md rule 2).
  7. What would change the classification: if the claim had rested on a specific described animal/
     preclinical immune pathway implying human protection, mechanism_vs_evidence could apply; if it
     had stated only what a replicated human trial supported, it could be solid.
gold_alternative_reading: |
  Alternative: mechanism_vs_evidence. Plausible because probiotics carry a gut-immune mechanism
  narrative. It loses under precedence because no described animal/preclinical pathway is being
  extrapolated (EFSA found no plausible mechanism at all); the claim is generic unsupported-breadth
  inflation = overclaim.
gold_summary: |
  A supplement claims its probiotic "boosts your immune system." EFSA rejected such claims for
  insufficient human evidence and NO plausible mechanism. Unsupported broad health-halo claim =
  overclaim; mechanism_vs_evidence fails because there is no described pathway to over-extrapolate.
curator_notes: |
  Boundary family B2 (overclaim <-> mechanism_vs_evidence), overclaim direction. Sourced from EFSA
  probiotic health-claim rejections (incl. Nutrimune opinion). Chosen as a mechanism-tempting case
  where the mechanism label FAILS precisely because no described biological pathway exists to
  extrapolate. Independent proposition (no probiotics case in Class A). Gold frozen before any model
  output.
expected_findings:
  - finding: unsupported_breadth
    severity: major
    confidence: high
    note: "'Boosts your immune system' is a broad claim EFSA found unsubstantiated"
  - finding: no_established_mechanism
    severity: moderate
    confidence: high
    note: "EFSA found no plausible in-vivo mechanism, so a mechanism_vs_evidence reading has nothing to attach to"
  - finding: health_halo_framing
    severity: moderate
    confidence: medium
    note: "Vague 'natural defences' marketing exceeds the replicated human evidence"
gold_evidence_spans:
  - span: "boosts your immune system and strengthens your body's natural defences"
    why_it_matters: "Broad immune-benefit claim regulators found unsubstantiated."
    supports_finding: unsupported_breadth
  - span: "no evidence was provided for a plausible mechanism"
    why_it_matters: "Removes the basis for a mechanism_vs_evidence reading; the failure is generic overclaim."
    supports_finding: no_established_mechanism
evaluation:
  method: auto
  answer_match: contains
key_insights:
  - keyword: "no substantiated mechanism"
    variants: ["EFSA rejected", "insufficient evidence", "not replicated"]
    functional_descriptions:
      - "Without a described biological pathway, mechanism_vs_evidence does not apply"
  - keyword: "unsupported breadth"
    variants: ["immune boost", "health halo", "natural defences"]
    functional_descriptions:
      - "Broad vague benefit exceeding the evidence is overclaim"
common_errors:
  - labelling any probiotic/immune claim mechanism_vs_evidence
  - accepting a broad 'immune boost' as substantiated
  - missing that no mechanism was demonstrated
expected_failure_modes:
  - overclaim_to_over_specific
  - mechanism_narrative_without_pathway
discriminative_dimensions:
  - correctness
  - insight_depth
diagnostic_focus: "Can the agent see that a mechanism-flavoured marketing claim with no described pathway is overclaim, not mechanism_vs_evidence?"
