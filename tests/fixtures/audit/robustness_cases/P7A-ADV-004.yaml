id: P7A-ADV-004
title: "Adversarial A2: spermidine supplement 'triggers autophagy to protect your heart and extend life' cites a mouse study (citation supports mechanism, not human outcome)"
domain: study_forensics
difficulty: hard
task_type: study_forensics
task_family: mechanism_vs_evidence
trap_type: citation_supports_mechanism_not_outcome
ambiguity_level: low
prompt: |
  A cellular-renewal supplement is marketed: "Spermidine switches on autophagy, your body's cellular 'self-cleaning' system. A Nature Medicine study proved spermidine protects the heart and extends lifespan — so a daily spermidine supplement will renew your cells, guard your heart, and help you live longer."

  The cited study (Eisenberg et al., Nature Medicine, 2016, "Cardioprotection and lifespan extension by the natural polyamine spermidine") showed that oral spermidine induced cardioprotective autophagy, reduced cardiac hypertrophy, preserved diastolic function, and extended lifespan in MICE, and that these effects required the autophagy gene Atg5. In humans, evidence is observational only: higher dietary spermidine intake (from food-frequency questionnaires) has been associated with lower blood pressure and cardiovascular risk, but no randomized trial has shown that spermidine supplementation protects the heart or extends lifespan in people.
context: |
  Evidence tier: a real, specific citation (a mouse interventional study, Nature Medicine) establishes
  the MECHANISM (autophagy induction) and the animal outcomes (cardioprotection, mouse lifespan). The
  human evidence is observational association only. The claim uses the mouse citation, plus the
  autophagy mechanism, to assert human cardioprotection and longevity. The citation supports the
  mechanism/animal outcome, not the human clinical outcome. A described animal/preclinical mechanism
  used to imply an undemonstrated human clinical benefit is the mechanism_vs_evidence trigger (Shape A).
expected_answer: "mechanism_vs_evidence"
reference_solution: |
  The ad cites a genuine Nature Medicine mouse study (spermidine induces autophagy, is cardioprotective,
  and extends lifespan in mice) to claim spermidine protects the human heart and extends human life.
  The citation and the autophagy mechanism support the animal outcome, not the human clinical outcome
  (human data are observational only; no RCT). An animal mechanism extrapolated to an undemonstrated
  human clinical benefit is mechanism_vs_evidence (Shape A). Generic overclaim also fits, but the
  decisive structure is the animal-mechanism-to-human-benefit leap.
gold_label: mechanism_vs_evidence
gold_confidence: high
gold_case_type: clear
gold_justification: |
  1. Exact proposition: a daily spermidine supplement protects the human heart and extends human
     lifespan, because a study proved spermidine is cardioprotective and life-extending via autophagy.
  2. What the strongest evidence establishes: in mice, spermidine induced cardioprotective autophagy,
     preserved cardiac function, and extended lifespan (Atg5-dependent); in humans only observational
     associations exist, no interventional trial of supplementation on heart/lifespan outcomes.
  3. Adversarial surface feature: a real, prestigious citation (Nature Medicine) plus a compelling,
     currently fashionable mechanism (autophagy) invite crediting the human outcomes.
  4. Actual forensic mismatch: the citation supports the mechanism and the mouse outcomes, not the
     human clinical outcomes; the human benefit of supplementation is undemonstrated.
  5. Primary frozen label: mechanism_vs_evidence — a described animal/preclinical mechanism used to
     imply an undemonstrated human clinical benefit (Shape A).
  6. Why precedence keeps it primary: the decisive defect is the animal-mechanism-to-human-benefit
     structure, exactly the mechanism_vs_evidence trigger, which outranks generic overclaim when
     present and central (docs/taxonomy_precedence.md rule 1).
  7. Strongest competing label: overclaim — "live longer / guard your heart" is inflated marketing,
     and one might argue the human observational data make it plain overstatement rather than a
     mechanism leap.
  8. Why it loses: the load-bearing citation and reasoning are the mouse study and the autophagy
     mechanism, not the observational human data; the core error is the animal-to-human extrapolation,
     so mechanism_vs_evidence is primary and overclaim secondary.
  9. What would change the verdict: a randomized human trial showing spermidine supplementation
     protects the heart or extends healthy lifespan would support the claim; if the case rested only
     on a human surrogate framed as clinical benefit it would route to overclaim (Shape B).
gold_alternative_reading: |
  Alternative: overclaim. Plausible because the copy is inflated and human observational associations
  exist, so a reviewer could call it overstatement of weak human data. It loses as primary because the
  decisive, load-bearing move is citing a mouse interventional study and an autophagy mechanism to
  assert human cardioprotection/longevity - the animal-to-human mechanism_vs_evidence trigger.
gold_summary: |
  A supplement cites a Nature Medicine mouse study (spermidine -> autophagy -> cardioprotection +
  lifespan) to claim it protects the human heart and extends human life; human data are observational
  only. Animal mechanism cited for a human outcome = mechanism_vs_evidence (overclaim secondary).
curator_notes: |
  Adversarial family A2 (citation supports mechanism but not outcome). Real public claim: spermidine
  ('autophagy/cellular renewal') longevity-supplement marketing. Cited study: Eisenberg 2016 (Nature
  Medicine, mice). Independent of A2 metformin (P7A-ADV-003): distinct decisive study (Eisenberg 2016
  vs Martin-Montalvo 2013), distinct mechanism (autophagy vs AMPK), and a distinct cardioprotection
  endpoint alongside lifespan. Distinct from Boundary senolytics/fasting. Gold frozen before any model
  output.
