robustness:
  robustness_case_id: P7A-ADV-004
  case_family: adversarial
  adversarial_family_id: A2
  adversarial_family: "citation supports mechanism but not outcome"
  adversarial_mechanism: |
    A specific, real, prestigious citation (Eisenberg 2016, Nature Medicine) establishes the mechanism
    (autophagy induction) and the animal outcomes (cardioprotection, mouse lifespan), and the claim
    wields it for the human outcomes (protect your heart, live longer). The surface pressure is the
    adjacency plus a fashionable mechanism (autophagy) and the existence of supportive human
    observational associations. The pressure to resist: accepting a mechanism/animal-outcome citation
    (and confounded human associations) as proof of a human clinical outcome.
  gold_status: frozen_pre_model
  difficulty_tier: D3
  difficulty_rationale: |
    Beyond the animal-to-human structure, an evidence-tier conflict is present: supportive human
    OBSERVATIONAL associations exist, which tempt a reader to treat the human claim as partly evidenced
    and to reclassify the defect as generic overstatement (overclaim). Distinguishing the interventional
    animal citation from confounded human associations, and keeping the mechanism leap primary, raises
    difficulty to D3. Property-based.
  precedence_rationale: |
    A described animal/preclinical mechanism (autophagy induction; cardioprotection and lifespan in
    mice) used to imply an undemonstrated human clinical benefit is the mechanism_vs_evidence trigger
    (Shape A). It is genuinely present and central and outranks generic overclaim per
    docs/taxonomy_precedence.md rule 1; the human observational associations do not establish the
    claimed supplementation benefit, so they do not move the case to solid.
  ambiguity_note: |
    Determinate: mechanism_vs_evidence is the single defensible primary; overclaim is a real secondary
    reading. The human observational associations are supportive but confounded and non-interventional,
    so they neither establish the claim (not solid) nor displace the mechanism leap as the core error.
  steelman_challenge: |
    Strongest case the gold is wrong: unlike a pure animal claim, spermidine has supportive human
    observational data (dietary intake associated with lower blood pressure and cardiovascular risk),
    so a reviewer might call the claim a modest overstatement of real human signals (overclaim) or even
    borderline solid. Counter-evidence weighed: those human data are observational and confounded, and
    the load-bearing evidence/reasoning the ad uses is a mouse interventional study plus the autophagy
    mechanism; no human trial shows supplementation protects the heart or extends life. Resolution: the
    animal-mechanism-to-human-benefit leap is the core error; gold remains mechanism_vs_evidence.
