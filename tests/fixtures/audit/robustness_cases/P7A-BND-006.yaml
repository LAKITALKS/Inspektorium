id: P7A-BND-006
title: "Boundary: 'raises bone density 35%, so it prevents fractures' (Shape B surrogate-to-clinical)"
domain: study_forensics
difficulty: hard
task_type: study_forensics
task_family: overclaim
trap_type: surrogate_endpoint_overclaim
ambiguity_level: medium
prompt: |
  A bone-health treatment is promoted as follows: "This therapy increases your spinal bone mineral density by 35% — denser bones are stronger bones, so it protects you from the fractures that osteoporosis causes."

  The claim draws on a landmark randomized trial of sodium fluoride for postmenopausal osteoporosis (Riggs et al., New England Journal of Medicine 1990). Over four years, the fluoride-plus-calcium group's median lumbar-spine (L2-L4) bone mineral density rose by about 35% from its own baseline (a within-group increase, not a placebo-subtracted between-group difference; the placebo group changed little). However, the number of new vertebral fractures was NOT significantly reduced (163 in the fluoride group vs 136 with placebo, not significant), and non-vertebral fractures were about three times more common in the fluoride group (72 vs 24). The added bone was structurally abnormal and more fragile. Bone mineral density is a surrogate/biomarker endpoint; fracture incidence is the clinical outcome that matters to patients.
context: |
  Evidence tier: a randomized controlled trial with a clinical fracture endpoint. Bone mineral
  density (BMD) is a SURROGATE endpoint; the trial shows the surrogate improved dramatically (a
  ~35% median WITHIN-GROUP increase in the fluoride arm, not a placebo-adjusted between-group gain)
  while the clinical outcome did not (no vertebral-fracture reduction; more non-vertebral fractures).
  The claim sells the surrogate improvement as the clinical benefit ("prevents fractures"). Under the
  frozen taxonomy this "Shape B" surrogate-to-clinical framing routes to overclaim, not
  mechanism_vs_evidence.
expected_answer: "overclaim"
reference_solution: |
  The therapy improves a SURROGATE (bone mineral density, +35%) but the actual RCT shows the clinical
  outcome did not improve — vertebral fractures were not reduced and non-vertebral fractures
  increased. Selling the density gain as fracture protection ("denser bones are stronger bones, so it
  protects you from fractures") is a surrogate-endpoint-framed-as-clinical-outcome overclaim. Under
  the frozen taxonomy, surrogate-to-clinical ("Shape B") routes to overclaim; it is not
  mechanism_vs_evidence, which requires a described animal/preclinical biological pathway extrapolated
  to humans.
gold_label: overclaim
gold_confidence: high
gold_case_type: clear
gold_justification: |
  1. What the claim asserts: because the treatment raises bone density 35%, it strengthens bones and
     prevents fractures (a clinical benefit).
  2. What the evidence establishes: in a human RCT the surrogate (spinal BMD) rose by a median of
     ~35% within the fluoride arm (a within-group increase from baseline, not a placebo-adjusted
     between-group difference), but the clinical endpoint did not improve — no significant reduction
     in vertebral fractures (163 fluoride vs 136 placebo, NS) and about three-fold MORE non-vertebral
     fractures (72 vs 24); the extra bone was structurally weaker.
  3. Mismatch: a surrogate improvement is presented as the clinical outcome, which the trial directly
     contradicts.
  4. Frozen label triggered: overclaim — a surrogate/biomarker framed as a clinical benefit
     (rhetorical inflation); per docs/study_forensics_taxonomy.md this "Shape B" routes to overclaim.
  5. Why mechanism_vs_evidence is tempting: a biological rationale ("denser bones are stronger") is
     invoked, so the mechanism boundary looks relevant.
  6. Why precedence rejects it as primary: mechanism_vs_evidence requires a described animal/
     preclinical PATHWAY used to imply human benefit. Here the evidence is a human RCT with a
     surrogate ENDPOINT (BMD), not an animal/preclinical pathway; the taxonomy explicitly EXCLUDES
     the biomarker/surrogate-to-clinical gap from mechanism_vs_evidence and routes it to overclaim
     (docs/taxonomy_precedence.md; case054 precedent).
  7. What would change the classification: if the density claim honestly reported that fractures were
     not reduced (and were higher non-vertebrally), it would be solid; if the argument rested on an
     animal-model bone-formation pathway to imply human benefit, mechanism_vs_evidence could apply.
gold_alternative_reading: |
  Alternative: mechanism_vs_evidence. Plausible because a biological "denser = stronger" rationale is
  invoked. It loses under precedence because the evidence is a human trial with a surrogate ENDPOINT
  (BMD), not an animal/preclinical pathway; the taxonomy routes surrogate-to-clinical ("Shape B") to
  overclaim and excludes it from mechanism_vs_evidence.
gold_summary: |
  A treatment that raises spinal bone density 35% is sold as fracture protection, but the RCT (Riggs
  1990) showed no vertebral-fracture reduction and MORE non-vertebral fractures. Surrogate (BMD)
  framed as clinical benefit = overclaim (Shape B), not mechanism_vs_evidence.
curator_notes: |
  Boundary family B2 (overclaim <-> mechanism_vs_evidence), overclaim direction. This is the explicit
  Shape-B surrogate-to-clinical positive control: it must route to overclaim, not
  mechanism_vs_evidence. Sourced from Riggs et al. 1990 (NEJM). Deliberately NON-cardiovascular and
  distinct from Class-A biomarker cases (LDL case032, hs-CRP case045). Gold frozen before any model
  output.
expected_findings:
  - finding: surrogate_framed_as_clinical
    severity: major
    confidence: high
    note: "Bone mineral density (surrogate) sold as fracture prevention (clinical outcome)"
  - finding: contradicted_by_clinical_endpoint
    severity: major
    confidence: high
    note: "RCT showed no significant vertebral-fracture reduction and ~3-fold more non-vertebral fractures despite +35% BMD"
  - finding: conclusion_exceeds_results
    severity: moderate
    confidence: high
    note: "'Denser bones are stronger bones' ignores the abnormal, more fragile bone produced"
gold_evidence_spans:
  - span: "denser bones are stronger bones, so it protects you from the fractures"
    why_it_matters: "Equates a surrogate (density) with the clinical outcome (fracture prevention)."
    supports_finding: surrogate_framed_as_clinical
  - span: "increases your spinal bone mineral density by 35%"
    why_it_matters: "The surrogate improvement that the trial shows did not translate into fewer fractures."
    supports_finding: contradicted_by_clinical_endpoint
evaluation:
  method: auto
  answer_match: contains
key_insights:
  - keyword: "surrogate endpoint"
    variants: ["bone mineral density", "biomarker", "not the clinical outcome"]
    functional_descriptions:
      - "BMD is a surrogate; fracture incidence is the outcome that matters"
  - keyword: "Shape B routes to overclaim"
    variants: ["surrogate-to-clinical", "not mechanism_vs_evidence", "no animal pathway"]
    functional_descriptions:
      - "Surrogate-framed-as-clinical is overclaim, not mechanism_vs_evidence"
common_errors:
  - labelling any biological-rationale claim mechanism_vs_evidence
  - accepting BMD gains as fracture prevention
  - missing that fractures were not reduced (and rose)
expected_failure_modes:
  - overclaim_to_over_specific
  - surrogate_to_clinical_leap
discriminative_dimensions:
  - correctness
  - insight_depth
diagnostic_focus: "Does the agent route a surrogate-to-clinical (Shape B) claim to overclaim rather than mechanism_vs_evidence?"
