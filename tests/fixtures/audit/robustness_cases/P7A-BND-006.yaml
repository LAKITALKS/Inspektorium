  difficulty_rationale: |
    >=2 plausible labels and a subtle precedence call: a biological "denser = stronger" rationale
    invites mechanism_vs_evidence, but the frozen taxonomy routes surrogate-to-clinical to overclaim.
    Evidence-tier nuance (surrogate vs clinical endpoint within a human RCT). Property-based tagging.
  precedence_rationale: |
    mechanism_vs_evidence requires a described animal/preclinical pathway extrapolated to human
    benefit. Here the evidence is a human RCT with a surrogate endpoint (BMD); the taxonomy
    explicitly excludes the surrogate-to-clinical gap ("Shape B") and routes it to overclaim
    (docs/taxonomy_precedence.md; case054). Primary = overclaim.
  ambiguity_note: |
    Determinate: overclaim is the single defensible primary under the frozen Shape-B routing;
    mechanism_vs_evidence is a documented-but-rejected alternative.
  steelman_challenge: |
    Strongest case the gold is wrong: the "denser bones are stronger" biological rationale could be
    read as a mechanism-to-clinical leap (mechanism_vs_evidence). Counter-evidence weighed: the
    decisive evidence is a human RCT surrogate endpoint, not an animal/preclinical pathway; the
    frozen taxonomy routes this to overclaim and case054 is the precedent for rejecting a
    mechanism reading absent a described biological pathway. Resolution: gold remains overclaim.
