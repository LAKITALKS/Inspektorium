  adversarial_family: "biologically plausible mechanism -> implied human efficacy"
  adversarial_mechanism: |
    A genuine, textbook cellular mechanism (red/near-infrared light absorbed by cytochrome c oxidase,
    increasing mitochondrial ATP), demonstrated mostly in vitro and in animals, is extrapolated to
    sweeping human clinical outcomes (reverse aging, heal the body, restore vitality). The surface
    pressure is that the mechanism is real and specific, making the human benefit sound scientifically
    inevitable. The pressure to resist: accepting a plausible, largely preclinical mechanism as proof of
    broad human clinical efficacy.
  gold_status: frozen_pre_model
  difficulty_tier: D2
  difficulty_rationale: |
    One primary (mechanism_vs_evidence) with one genuinely plausible alternate (overclaim, invited by
    the inflated 'reverses aging' language); precedence decides. The mechanism-to-efficacy structure is
    clear (Shape C) and the preclinical nature is stated, keeping it at D2. Property-based.
  precedence_rationale: |
    A described biological mechanism (photobiomodulation of cytochrome c oxidase -> ATP), largely
    preclinical, used to imply an undemonstrated human clinical benefit is the mechanism_vs_evidence
    trigger (Shape C: preclinical pathway to therapeutic promise). It is genuinely present and central,
    so it outranks generic overclaim per docs/taxonomy_precedence.md rule 1; overclaim is secondary.
  ambiguity_note: |
    Determinate: mechanism_vs_evidence is the single defensible primary; overclaim is a real secondary
    reading. Narrow, specific human uses with limited evidence do not establish the broad claim (not solid).
  steelman_challenge: |
    Strongest case the gold is wrong: photobiomodulation is a real phenomenon with FDA-cleared devices
    for some narrow indications (e.g., certain pain/wound/hair-growth uses) and a plausible mechanism,
    so a reader might call the claim solid or plain marketing hype (overclaim). Counter-evidence weighed:
    the broad claims (reverse aging, heal the body) rest on a largely preclinical mechanism and are not
    demonstrated in adequate human trials; human evidence is limited to narrow uses. Resolution: the
    mechanism-to-human-efficacy leap is the core error; gold remains mechanism_vs_evidence.
