id: P7A-ADV-013
title: "Adversarial A7: red light therapy 'stimulates your mitochondria, so it reverses aging and heals your body' (plausible mechanism to implied human efficacy)"
domain: study_forensics
difficulty: hard
task_type: study_forensics
task_family: mechanism_vs_evidence
trap_type: mechanism_plausibility_to_human_efficacy
ambiguity_level: low
prompt: |
  A red-light-therapy device is marketed: "Red and near-infrared light are absorbed by cytochrome c oxidase in your mitochondria, boosting ATP energy production. By supercharging your cells' energy, our panel reverses aging, heals your body, and restores youthful vitality — just 10 minutes a day."

  The described mechanism is real at the cellular level: red/near-infrared photons are absorbed by cytochrome c oxidase and can increase mitochondrial ATP production in cells and animal tissue (photobiomodulation). But most of this evidence is in vitro and in animals. Broad human clinical benefits — reversing aging, "healing your body", restoring vitality — have not been demonstrated in adequate human trials; human clinical evidence exists only for narrow, specific uses and remains limited.
context: |
  Evidence tier: a genuine cellular/animal mechanism (photobiomodulation of cytochrome c oxidase ->
  ATP) used to imply broad human clinical benefits that have not been demonstrated. The device's sweeping
  anti-aging/healing claims rest on a biologically plausible, preclinically supported mechanism rather
  than on human clinical outcomes. A described biological mechanism (largely preclinical) used to imply
  undemonstrated human clinical benefit is the mechanism_vs_evidence trigger (Shape C).
expected_answer: "mechanism_vs_evidence"
reference_solution: |
  The claim rests on a real, biologically plausible mechanism (red/near-infrared light -> cytochrome c
  oxidase -> more ATP), shown mostly in vitro and in animals, and extrapolates it to broad human
  benefits (reverse aging, heal the body) not demonstrated in adequate human trials. A plausible,
  preclinically supported mechanism used to imply undemonstrated human clinical efficacy is
  mechanism_vs_evidence (Shape C). Generic overclaim also fits, but the decisive structure is the
  mechanism-to-human-efficacy leap.
gold_label: mechanism_vs_evidence
gold_confidence: high
gold_case_type: clear
gold_justification: |
  1. Exact proposition: because red/near-infrared light boosts mitochondrial ATP, the device reverses
     aging, heals your body, and restores vitality in people.
  2. What the strongest evidence establishes: photobiomodulation of cytochrome c oxidase can increase
     ATP in cells and animal tissue (real mechanism, mostly preclinical); broad human clinical benefits
     are not demonstrated (human evidence limited to narrow uses).
  3. Adversarial surface feature: a specific, real, textbook cellular mechanism (cytochrome c oxidase,
     ATP) makes the human benefit sound scientifically inevitable.
  4. Actual forensic mismatch: a largely preclinical mechanism is extrapolated to sweeping human
     clinical outcomes that have not been shown.
  5. Primary frozen label: mechanism_vs_evidence - a described (preclinical) biological mechanism used
     to imply undemonstrated human clinical benefit (Shape C).
  6. Why precedence keeps it primary: the mechanism-to-human-efficacy structure is genuinely present and
     central, so it outranks generic overclaim (docs/taxonomy_precedence.md rule 1).
  7. Strongest competing label: overclaim - "reverses aging" is inflated marketing.
  8. Why it loses: the load-bearing move is the mechanistic pathway extrapolated to human benefit, which
     is the mechanism_vs_evidence trigger; overclaim is secondary.
  9. What would change the verdict: adequate human trials showing the device reverses aging/heals would
     make the claim solid; if it rested only on a human surrogate framed as clinical benefit it would be
     overclaim (Shape B).
gold_alternative_reading: |
  Alternative: overclaim. Plausible because "reverses aging" and "heals your body" are rhetorically
  inflated. It is the secondary reading; it loses as primary because the decisive, load-bearing move is
  extrapolating a (largely preclinical) cellular mechanism to sweeping human clinical benefits - the
  mechanism_vs_evidence trigger (Shape C).
gold_summary: |
  A red-light panel cites a real cellular mechanism (photobiomodulation -> ATP), shown mostly in
  vitro/animals, to claim it reverses aging and heals the body in people - benefits not demonstrated in
  humans. Plausible mechanism -> implied human efficacy = mechanism_vs_evidence (overclaim secondary).
curator_notes: |
  Adversarial family A7 (biologically plausible mechanism -> implied human efficacy). Real public claim:
  red-light-therapy device marketing (mitochondria/ATP -> anti-aging/healing). Mechanism is genuine and
  preclinically supported (cytochrome c oxidase photobiomodulation); broad human clinical benefit
  unestablished. Distinct from A7 probiotics-mood (P7A-ADV-014) and from A2 metformin/spermidine (which
  foreground a specific outcome-citation). Distinct from Boundary senolytics/fasting. Gold frozen before
  any model output.
expected_findings:
  - finding: preclinical_mechanism_to_human_benefit
    severity: major
    confidence: high
    note: "A largely in-vitro/animal ATP mechanism extrapolated to broad human benefits"
  - finding: human_benefit_not_demonstrated
    severity: major
    confidence: high
    note: "Reversing aging/healing not shown in adequate human trials; human evidence narrow/limited"
gold_evidence_spans:
  - span: "By supercharging your cells' energy, our panel reverses aging, heals your body, and restores youthful vitality"
    why_it_matters: "Broad human clinical outcomes asserted from a cellular mechanism."
    supports_finding: preclinical_mechanism_to_human_benefit
  - span: "Broad human clinical benefits ... have not been demonstrated in adequate human trials"
    why_it_matters: "The human clinical benefit is undemonstrated."
    supports_finding: human_benefit_not_demonstrated
