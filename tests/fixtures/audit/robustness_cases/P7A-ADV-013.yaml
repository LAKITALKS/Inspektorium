  method: auto
  answer_match: contains
key_insights:
  - keyword: "mechanism to efficacy"
    variants: ["cytochrome c oxidase", "ATP", "in vitro/animal"]
    functional_descriptions:
      - "A real cellular mechanism does not establish broad human clinical benefit"
  - keyword: "preclinical only"
