  difficulty_tier: D2
  difficulty_rationale: |
    One primary (mechanism_vs_evidence) with one genuinely plausible alternate (overclaim), resolved by
    precedence because a described mechanism is used to imply an unproven clinical benefit. A single
    clear mechanism-to-outcome leap and an authoritative evidence-gap statement keep competing failure
    modes low = D2. Property-based, pre-result.
  precedence_rationale: |
    The specific mechanism_vs_evidence trigger is present (a described, plausible physiological mechanism
    - cold blunts acute inflammation - used to imply unproven human clinical benefit), and per
    docs/taxonomy_precedence.md this specific mechanism-to-clinical-benefit failure takes precedence over
    the generic overclaim label. There is no observational dataset read causally, so
    correlation_vs_causation does not apply; the clinical outcomes are unproven, so it is not solid.
  ambiguity_note: |
    Determinate: mechanism_vs_evidence is the single most-specific defensible primary; overclaim is a
    real but generic alternate that loses on precedence. Solid is excluded because the clinical benefits
    are not established.
  steelman_challenge: |
    Strongest case the gold is wrong: the advertised benefits clearly exceed the evidence, so a reviewer
    could call it overclaim; or, since cold genuinely reduces acute inflammation, a reader might over-credit
    the mechanism and drift toward solid. Counter-evidence weighed: the claim's decisive structure is a
    described mechanism used to bridge to unproven human clinical benefits, and the FDA (2016) states a
    lack of evidence for the marketed benefits with no cleared device (systematic reviews concur).
    Resolution: the specific mechanism-to-clinical-benefit trigger governs, so gold remains
    mechanism_vs_evidence.
