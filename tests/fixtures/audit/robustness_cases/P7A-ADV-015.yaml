  adversarial_mechanism: |
    A numerically-correct statistic (a 36% relative risk reduction) is framed - prominent headline,
    relative metric - to convey a far larger benefit than the ~1.1 percentage-point absolute reduction it
    represents, while the absolute rates are relegated to a footnote that does not repair the impression.
    The surface pressure is that the number is accurate and even partially disclosed, so the ad looks
    honest. The pressure to resist: accepting a true-but-relatively-framed figure (with a decorative
    hedge) as an honest summary of the benefit's magnitude.
  gold_status: frozen_pre_model
  difficulty_tier: D3
  difficulty_rationale: |
    The number is accurate and the absolute figures are disclosed, so a strong solid reading is
    available; separating a true statistic from a misleading framing (relative vs absolute, and a hedge
    that does not repair) requires quantitative discrimination. Property-based; D3.
  precedence_rationale: |
    No specific-label trigger fires: the trial is randomized (rules out correlation_vs_causation) and no
    animal/preclinical mechanism is extrapolated to humans (rules out mechanism_vs_evidence). The defect
    is framing/rhetorical inflation of a technically-correct number = overclaim, per docs/taxonomy_precedence.md
    (residual/generic rule; decorative hedging that does not constrain the claim is an overclaim signal).
  ambiguity_note: |
    Determinate: overclaim is the single defensible primary; solid is tempting because the figure is
    accurate and the absolute rates are footnoted, but the headline framing overstates the benefit and
    the hedge does not repair it.
  steelman_challenge: |
    Strongest case the gold is wrong: the 36% relative risk reduction is genuinely correct, ASCOT-LLA is
    a randomized trial, atorvastatin really does reduce heart attacks, and the ad even discloses the
    absolute rates (3% vs 2%) - so a reader could call it solid, honest reporting. Counter-evidence
    weighed: the headline uses the relative figure to convey a benefit far larger than the ~1.1
    percentage-point absolute reduction, and the absolute numbers are buried in a footnote that does not
    repair the impression. Resolution: a correct number framed to mislead about magnitude is overclaim.
