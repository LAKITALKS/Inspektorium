id: P7A-BND-001
title: "Boundary: processed meat 'as dangerous as smoking' after IARC Group 1 classification"
domain: study_forensics
difficulty: hard
task_type: study_forensics
task_family: overclaim
trap_type: hazard_vs_risk_conflation
ambiguity_level: medium
prompt: |
  A widely shared health article reports on the World Health Organization's 2015 classification of processed meat. It states: "The WHO has now put processed meat in the same category as cigarettes and asbestos — Group 1 carcinogens. That means a daily bacon sandwich is as dangerous as smoking, and there is no safe amount of processed meat."

  The underlying source is the International Agency for Research on Cancer (IARC) Monographs Working Group evaluation of October 2015, which classified processed meat as Group 1 ("carcinogenic to humans") on the basis of sufficient epidemiological evidence for colorectal cancer. IARC's own Q&A states that its classification "describes the strength of the scientific evidence about an agent being a cause of cancer, rather than assessing the level of risk," and that being in the same category "does NOT mean that they are all equally dangerous." Each 50 g portion of processed meat eaten daily is associated with about an 18% increase in the relative risk of colorectal cancer. WHO estimates about 34,000 cancer deaths per year worldwide are attributable to diets high in processed meat, versus about 1,000,000 per year from tobacco smoking and 600,000 from alcohol.
context: |
  Evidence tier: an IARC Group 1 evaluation (systematic review of the epidemiological and
  mechanistic literature) — a high-tier causal classification. The classification concerns the
  STRENGTH OF EVIDENCE that processed meat causes cancer, not the MAGNITUDE of risk. The public
  claim's error is the "as dangerous as smoking / no safe amount" equivalence, which conflates the
  hazard category with the size of the risk (18% relative per 50 g/day; ~34k vs ~1M deaths/yr).
expected_answer: "overclaim"
reference_solution: |
  The IARC classification establishes that processed meat is a cause of colorectal cancer (Group 1
  = sufficient evidence of causation) — so this is not a case of inferring causation from a
  non-causal design. The forensic defect is that the article equates the hazard CATEGORY (strength
  of evidence) with the LEVEL of risk, producing "as dangerous as smoking" and "no safe amount."
  The magnitude of risk is far smaller than smoking (18% relative increase per 50 g/day; ~34,000 vs
  ~1,000,000 attributable cancer deaths/yr). The framing exceeds the evidence: rhetorical/magnitude
  inflation = overclaim.
gold_label: overclaim
gold_confidence: high
gold_case_type: clear
gold_justification: |
  1. What the claim asserts: processed meat is "as dangerous as smoking," in the "same category as
     cigarettes and asbestos," with "no safe amount" — an equivalence of danger/magnitude.
  2. What the evidence establishes: IARC Group 1 is a statement about the STRENGTH of evidence that
     an agent causes cancer, explicitly "rather than assessing the level of risk"; the associated
     magnitude is ~18% relative risk per 50 g/day and ~34,000 attributable deaths/yr worldwide
     (vs ~1,000,000 for tobacco).
  3. Mismatch: the claim upgrades a shared evidence-strength category into an equivalence of danger
     and an absolute "no safe amount" — a category error that inflates the magnitude.
  4. Frozen label triggered: overclaim — the framing of the result exceeds what the evidence
     supports (rhetorical/magnitude inflation), the generic/residual failure.
  5. Why correlation_vs_causation is tempting: this is a diet–cancer claim built on epidemiology,
     the surface most associated with the correlation/causation boundary.
  6. Why precedence rejects it as primary: the correlation_vs_causation trigger is a causal claim
     drawn from a NON-CAUSAL / confounded design. Here causation is exactly what IARC judged
     ESTABLISHED (Group 1, sufficient evidence); the claim does not misinfer causation from an
     uncontrolled design. The specific trigger is absent, so under docs/taxonomy_precedence.md the
     primary stays the generic overclaim.
  7. What would change the classification: had the article inferred "processed meat caused my
     cancer" from a single confounded correlation (ignoring the IARC causal evaluation), the
     correlation_vs_causation trigger could be present; had it accurately reported the 18% relative
     and small absolute risk, it would be solid.
gold_alternative_reading: |
  Alternative: correlation_vs_causation. Plausible because the whole processed-meat/cancer question
  is epidemiological, and readers frequently attack diet–disease claims on causal-inference grounds.
  It loses under precedence because the causal relationship is not the disputed step — IARC
  classified it as established (Group 1). Nothing in the claim infers causation from a non-causal
  design; the defect is magnitude/hazard inflation. A causal-inference critique would misdiagnose
  the failure.
gold_summary: |
  A health article turns IARC's Group-1 classification of processed meat ("strength of evidence"
  category, shared with tobacco/asbestos) into "as dangerous as smoking / no safe amount." Causation
  is established, so this is not correlation_vs_causation; the defect is conflating hazard category
  with risk magnitude — rhetorical inflation = overclaim.
curator_notes: |
  Boundary family B1 (overclaim <-> correlation_vs_causation), overclaim direction. Sourced from the
  WHO/IARC 2015 processed-meat evaluation and its Q&A; a real, well-documented public
  misinterpretation (hazard vs risk). Independent of Class-A cases (no processed-meat/hazard case in
  the library). Gold frozen before any model output. See robustness.provenance for exact sources.
expected_findings:
  - finding: magnitude_inflation
    severity: major
    confidence: high
    note: "'As dangerous as smoking / no safe amount' conflates hazard category with level of risk"
  - finding: hazard_vs_risk_conflation
    severity: major
    confidence: high
    note: "Group 1 describes strength of evidence for causation, not magnitude of risk"
  - finding: conclusion_exceeds_results
    severity: moderate
    confidence: high
    note: "Absolute/attributable risk far smaller than smoking (~34k vs ~1M deaths/yr)"
gold_evidence_spans:
  - span: "a daily bacon sandwich is as dangerous as smoking, and there is no safe amount"
    why_it_matters: "The magnitude-equivalence and absolutist framing that exceeds the evidence — the core overclaim."
    supports_finding: magnitude_inflation
  - span: "describes the strength of the scientific evidence about an agent being a cause of cancer, rather than assessing the level of risk"
    why_it_matters: "IARC's own statement that Group 1 is not a statement about how large the risk is."
    supports_finding: hazard_vs_risk_conflation
evaluation:
  method: auto
  answer_match: contains
key_insights:
  - keyword: "hazard versus risk"
    variants: ["strength of evidence", "not the level of risk", "category not magnitude"]
    functional_descriptions:
      - "IARC Group 1 rates evidence strength for causation, not the size of the risk"
  - keyword: "relative vs absolute risk"
    variants: ["18% per 50g", "attributable deaths", "34,000 vs 1 million"]
    functional_descriptions:
      - "The absolute/attributable risk is far smaller than the smoking comparison implies"
common_errors:
  - reading a diet-cancer claim as automatically correlation_vs_causation
  - treating a shared classification category as equal danger
  - missing that IARC already judged causation established
expected_failure_modes:
  - overclaim_to_over_specific
  - hazard_risk_confusion
discriminative_dimensions:
  - correctness
  - insight_depth
diagnostic_focus: "Can the agent see that an established carcinogen claim inflated in magnitude is overclaim, not a causal-inference error?"
origin: curated
