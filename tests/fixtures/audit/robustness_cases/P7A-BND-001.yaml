gold_status: frozen_pre_model
robustness:
  robustness_case_id: P7A-BND-001
  case_family: boundary
  boundary_family_id: B1
  boundary: "overclaim <-> correlation_vs_causation"
  gold_status: frozen_pre_model
  difficulty_tier: D3
  difficulty_rationale: |
    >=2 plausible labels (overclaim vs correlation_vs_causation); resolving it requires the
    non-obvious hazard-vs-risk distinction and knowing that IARC already established causation;
    evidence-tier nuance (high-tier causal classification misused for magnitude). Property-based,
    no model performance considered.
  precedence_rationale: |
    overclaim is the generic/residual label (rhetorical inflation). correlation_vs_causation
    outranks it ONLY if a causal claim is drawn from a non-causal/confounded design. Here causation
    is the ESTABLISHED IARC judgment, not an inference from a confounded design, so the specific
    trigger is absent and the primary stays overclaim (docs/taxonomy_precedence.md rule 2).
  ambiguity_note: |
    Difficult but not indeterminate: only overclaim is defensible as primary; correlation_vs_causation
    is a documented-but-rejected alternative because the causal step is not the disputed one.
  steelman_challenge: |
    Strongest case that the gold is wrong: argue the sentence "processed meat causes cancer" is a
    causal statement, so correlation_vs_causation applies. Counter-evidence found and weighed: IARC
    Group 1 IS the causal finding (sufficient evidence), so asserting causation here is correct, not
    a fallacy; the only thing exceeding evidence is the smoking-equivalence/absolutism (magnitude).
    No material evidence supports correlation_vs_causation as the CENTRAL failure. Resolution: gold
    remains overclaim.
