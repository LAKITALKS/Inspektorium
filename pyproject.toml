[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "inspektorium"
version = "0.0.1"
description = "A small evidence-binding reference tool for source-grounded evaluation"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Inspektorium contributors" },
]
dependencies = [
  "pydantic>=2.8,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/inspektorium"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["inspektorium"]

[tool.coverage.report]
show_missing = true
skip_covered = true
