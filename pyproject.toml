[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "inspektorium"
version = "0.1.0"
description = "A small evidence-binding reference tool for source-grounded evaluation"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
  { name = "Lazaros Varvatis", email = "varvatislazaros@gmail.com" },
]
dependencies = [
  "pydantic>=2.8,<3",
]

[project.scripts]
inspektorium = "inspektorium.cli:main"

[project.optional-dependencies]
anthropic = [
  "anthropic>=0.77",
]
dev = [
  "anthropic>=0.77",
  "build>=1.2,<2",
  "mypy>=1.13,<2",
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.8,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/inspektorium"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["inspektorium"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
