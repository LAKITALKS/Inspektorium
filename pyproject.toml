[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "inspektorium"
version = "0.3.0"
description = "Fail-closed evidence integrity for AI-generated claims and AI evaluation reports"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [
  { name = "Lazaros Varvatis", email = "varvatislazaros@gmail.com" },
]
dependencies = [
  "click>=8.1",
  "pydantic>=2.8,<3",
  "pyyaml>=6.0",
]

[project.scripts]
inspektorium = "inspektorium.cli:main"

[project.optional-dependencies]
# Provider SDKs for the live paths. SDK 1.x uses httpx2; the counted transport
# and the validated adapter contract use httpx.Client.
providers = [
  "anthropic>=0.77,<1",
  "httpx>=0.27,<1",
  "openai>=1.0",
]
# Former name of the provider extra, kept as an alias.
anthropic = [
  "anthropic>=0.77,<1",
  "httpx>=0.27,<1",
  "openai>=1.0",
]
dev = [
  "anthropic>=0.77,<1",
  "build>=1.2,<2",
  "httpx>=0.27,<1",
  "linkify-it-py>=2,<3",
  "markdown-it-py>=3,<5",
  "mypy>=1.13,<2",
  "openai>=1.0",
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.8,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/inspektorium"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/examples", "/evidence", "/docs", "/paper", "/scripts", "/*.md", "/CITATION.cff", "/LICENSE", "/NOTICE", "/pyproject.toml"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["inspektorium"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.format]
# These files are byte-bound to the v0.1.1 evidence package and are never reformatted.
exclude = ["evidence/**", "src/inspektorium/core/**", "src/inspektorium/report/**", "src/inspektorium/providers/**"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
# The audit runtime, its tests and its scripts keep the runtime's historical rule set
# (E4, E7, E9, F); docs/development/testing.md records this baseline.
"src/inspektorium/audit/**" = ["B", "E501", "I", "UP"]
# The recording tools of the 0.3.0 behavior comparison stay as they ran.
"evidence/v0.3.0-behavior/tools/compare.py" = ["B", "E501", "I", "UP"]
