[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "inspektorium"
version = "0.1.1"
description = "A small evidence-binding reference tool for source-grounded evaluation"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
  { name = "Lazaros Varvatis", email = "varvatislazaros@gmail.com" },
]
dependencies = [
  "pydantic>=2.8,<3",
]

[project.scripts]
inspektorium = "inspektorium.cli:main"

[project.optional-dependencies]
# SDK 1.x uses httpx2; retain the validated httpx-based adapter contract.
anthropic = [
  "anthropic>=0.77,<1",
]
dev = [
  "anthropic>=0.77,<1",
  "build>=1.2,<2",
  "httpx>=0.27,<1",
  "markdown-it-py>=3,<5",
  "linkify-it-py>=2,<3",
  "mypy>=1.13,<2",
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.8,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/inspektorium"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/examples", "/evidence", "/*.md", "/CITATION.cff", "/LICENSE", "/pyproject.toml"]
exclude = ["/agent-arena", "/publication"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["inspektorium"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
extend-exclude = ["agent-arena", "publication/historical-source"]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
