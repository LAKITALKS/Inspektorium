name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  instrument:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            agent-arena/pyproject.toml
      - name: Build the public entry and unchanged audit engine
        run: |
          python -m pip install build hatchling setuptools wheel
          python -m build --wheel --no-isolation --outdir "$RUNNER_TEMP/instrument-wheels"
          python -m build --wheel --no-isolation --outdir "$RUNNER_TEMP/instrument-wheels" agent-arena
      - name: Check explicit missing-engine handling
        run: |
          python -m venv "$RUNNER_TEMP/instrument-env"
          "$RUNNER_TEMP/instrument-env/bin/python" -m pip install "$RUNNER_TEMP"/instrument-wheels/inspektorium-*.whl
          python - <<'PY'
          import os, subprocess
          from pathlib import Path
          command = Path(os.environ['RUNNER_TEMP']) / 'instrument-env/bin/inspektorium'
          result = subprocess.run([str(command), 'audit', '--help'], text=True, capture_output=True)
          assert result.returncode == 2, result
          assert 'python -m pip install . ./agent-arena' in result.stderr
          assert not result.stdout
          PY
      - name: Complete joint installation and arm Python socket guard
        run: |
          "$RUNNER_TEMP/instrument-env/bin/python" -m pip install "$RUNNER_TEMP"/instrument-wheels/agent_arena-*.whl
          python evidence/v0.1.1/tools/setup_env.py guard --venv "$RUNNER_TEMP/instrument-env"
      - name: Verify installed public workflow and compatibility
        run: |
          "$RUNNER_TEMP/instrument-env/bin/python" scripts/verify_instrument.py \
            --repo "$GITHUB_WORKSPACE" --output "$RUNNER_TEMP/instrument-verification"
      - name: Preserve measured integration results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrument-verification-${{ matrix.python-version }}
          path: |
            ${{ runner.temp }}/instrument-verification/results.json
            ${{ runner.temp }}/instrument-verification/guard-canary.jsonl
            ${{ runner.temp }}/instrument-verification/offline-network.jsonl
          if-no-files-found: error
  core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install public development dependencies
        run: python -m pip install -e '.[dev]' hatchling
      - name: Arm and countercheck Python network guard
        run: |
          python evidence/v0.1.1/tools/setup_env.py guard --venv "$pythonLocation"
          python - <<'PY'
          import json, os, sys
          from pathlib import Path
          sys.path.insert(0, 'evidence/v0.1.1/tools')
          from canary import python_canary
          result = python_canary(Path(sys.prefix), Path(os.environ['RUNNER_TEMP']) / 'canary.jsonl')
          print(json.dumps(result))
          assert result['passed']
          PY
      - name: Core full acceptance
        env:
          EVIDENCE_NETGUARD_LOG: ${{ runner.temp }}/core-offline.jsonl
          PIP_NO_INDEX: "1"
        run: |
          ruff check .
          mypy src
          pytest --cov=inspektorium --cov-report=term-missing --cov-fail-under=80
          python -m build --no-isolation
      - name: Check monitored operations
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          rows = [json.loads(s) for s in (Path(os.environ['RUNNER_TEMP']) / 'core-offline.jsonl').read_text().splitlines()]
          assert any(r['event'] == 'armed' for r in rows)
          assert not any(r['event'] == 'refused' for r in rows)
          print('Recorded Python socket events:', len(rows))
          PY
  arena:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: agent-arena
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: agent-arena/pyproject.toml
      - name: Create isolated Arena environment
        run: |
          python -m venv "$RUNNER_TEMP/arena-ci-env"
          echo "$RUNNER_TEMP/arena-ci-env/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$RUNNER_TEMP/arena-ci-env" >> "$GITHUB_ENV"
      - name: Install public development dependencies
        run: |
          python -c 'import sys; assert sys.prefix != sys.base_prefix'
          python -m pip install -e '.[dev,providers]' build setuptools wheel
      - name: Arm and countercheck Python network guard
        run: |
          python ../evidence/v0.1.1/tools/setup_env.py guard --venv "$VIRTUAL_ENV"
          python - <<'PY'
          import json, os, sys
          from pathlib import Path
          sys.path.insert(0, '../evidence/v0.1.1/tools')
          from canary import python_canary
          result = python_canary(Path(sys.prefix), Path(os.environ['RUNNER_TEMP']) / 'canary.jsonl')
          print(json.dumps(result))
          assert result['passed']
          PY
      - name: Check Arena environment binding
        env:
          EVIDENCE_NETGUARD_LOG: ${{ runner.temp }}/arena-offline.jsonl
          PIP_NO_INDEX: "1"
        run: |
          python -m pytest -q tests/test_preflight_integrity.py::test_U01_material_parent_and_real_subprocess_probe_match tests/test_preflight_integrity.py::test_U10_wrong_interpreter_or_virtual_environment_changes_material_identity
      - name: Arena full acceptance
        env:
          EVIDENCE_NETGUARD_LOG: ${{ runner.temp }}/arena-offline.jsonl
          PIP_NO_INDEX: "1"
        run: |
          python -m pytest tests
          python scripts/phase10_acceptance.py --output "$RUNNER_TEMP/arena-gates"
          ruff check src/agent_arena/phase10_*.py src/agent_arena/cli.py src/agent_arena/condition_contract.py tests/test_phase10_*.py tests/test_monorepo_plan_binding.py scripts/phase10_acceptance.py scripts/phase10_clean_reproduce.py scripts/phase10_print_qa.py scripts/extract_recorded_capture.py scripts/offline_netguard.py scripts/offline_canary.py tests/test_capture_derivation.py tests/test_reproduction_guard_counter.py
          python -m compileall -q src
          python -m build --no-isolation
      - name: Check monitored operations
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          rows = [json.loads(s) for s in (Path(os.environ['RUNNER_TEMP']) / 'arena-offline.jsonl').read_text().splitlines()]
          assert any(r['event'] == 'armed' for r in rows)
          assert not any(r['event'] == 'refused' for r in rows)
          print('Recorded Python socket events:', len(rows))
          PY
